<style>
/* Layout: one narrow column like a ward handout — program tabs on top, device picker, one big button, then 3 steps */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16211E; --sub:#5B6763; --line:#DCE3E0;
  --accent:#0F7B6C; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC; --warn:#9A5B00; --warn-soft:#FFF2DC;
  --kakao:#FEE500; --kakao-ink:#191919;
  --display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18211E; --ink:#E9F0ED; --sub:#9AA8A3; --line:#2A3632;
  --accent:#3CC2AA; --accent-ink:#06201B; --accent-soft:#163A33; --warn:#F2B860; --warn-soft:#33270F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211E; --ink:#E9F0ED; --sub:#9AA8A3; --line:#2A3632;
  --accent:#3CC2AA; --accent-ink:#06201B; --accent-soft:#163A33; --warn:#F2B860; --warn-soft:#33270F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,38px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.5px}
header p{margin:8px 0 0;color:var(--sub);font-size:15px}
.badge{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin-bottom:12px}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 6px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tab .ico{font-size:24px;line-height:1.2}
.tab small{font-weight:500;color:var(--sub);font-size:11.5px;text-align:center;overflow-wrap:anywhere;line-height:1.3}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.dev:focus-visible,.go:focus-visible,.copy:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.intro{display:grid;grid-template-columns:1fr 112px;gap:16px;align-items:start}
.intro.wide{grid-template-columns:1fr}
.intro h2{font-family:var(--display);font-size:22px;margin:0 0 6px;font-weight:800}
.intro ul{margin:0;padding-left:18px;color:var(--sub);font-size:14.5px}
.intro li{margin:2px 0}
.shot{width:112px;border-radius:14px;border:1px solid var(--line);display:block}
.shot.icon{border:0;border-radius:24px}
.shot.wide{width:100%;border-radius:12px}
.label{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--sub)}

.devs{display:flex;flex-wrap:wrap;gap:8px}
.dev{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.dev[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dev .mine{font-size:11px;font-weight:700;color:var(--accent);margin-left:4px}
.dev[aria-pressed="true"] .mine{color:var(--bg);opacity:.8}

.go{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px 18px;box-shadow:0 6px 18px -8px var(--accent)}
.go:active{transform:scale(.985)}
.go .arrow{font-size:28px;line-height:1;flex:none}
.go b{display:block;font-family:var(--display);font-size:19px;font-weight:800}
.go small{display:block;font-size:13px;opacity:.85}
.alt{font-size:13.5px;color:var(--sub);margin:-8px 0 0}
.alt a{color:var(--accent);font-weight:600}

ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px;min-width:0}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px}
ol.steps b{font-weight:700}
.tip{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.tip strong{color:var(--warn)}
.cmd{display:flex;gap:8px;align-items:center;margin-top:8px;min-width:0}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.copy{appearance:none;border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:none}

.coffee{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--kakao);color:var(--kakao-ink);border-radius:16px;padding:14px 16px}
.coffee .cup{font-size:26px}
.coffee b{display:block;font-size:15px}
.coffee small{display:block;font-size:12.5px;opacity:.75}
footer{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
footer a{color:var(--sub)}
@media (max-width:420px){.intro{grid-template-columns:1fr 88px}.shot{width:88px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var MAC_WEB_TIP='설치 파일이 필요 없고, 한 번 연 뒤에는 인터넷이 없어도 돼요. 메뉴가 안 보이면 macOS가 옛 버전이에요. 그럴 땐 크롬으로 열어 주세요.';

var APPS={

      ios:{web:'nursing/',name:'아이폰에서 열기',size:'웹앱 · 홈 화면에 추가해서 사용',steps:IOS_STEPS,tip:IOS_TIP}}},
  flash:{title:'플래시카드',img:'flash',points:['PDF(굿노트 필기) · PPT · 워드 · 한글 파일에서','형광펜 · 굵은 글씨 · 필기 부분만 카드와 문제로','모름 / 애매 / 알아요 채점, 복습 주기, 학습지 저장'],
    devs:{
      android:{file:'StudyHelper/StudyHelper.apk',name:'안드로이드 앱 받기',size:'apk · 버전 2.1.1',steps:APK_STEPS,tip:APK_TIP},
      windows:{file:'StudyHelper/Flashcards-Windows-2.1.2.zip',name:'Windows 10/11용 받기',size:'zip · 버전 2.1.2',steps:WIN_STEPS,exe:'플래시카드.exe',tip:WIN_TIP+' 앱 창은 Windows에 들어 있는 Edge로 열려요.'},
      mac:{web:'flashcards/',name:'Mac에서 열기',size:'웹앱 · Dock에 추가해서 사용',steps:MAC_WEB_STEPS,tip:MAC_WEB_TIP},

      windows:{url:MJ+'Matjip-Windows-1.0.1.zip',name:'Windows 10/11용 받기',size:'zip · 버전 1.0.1',steps:WIN_STEPS,exe:'맛볼거리.exe',tip:WIN_TIP+' 앱 창은 Windows에 들어 있는 Edge로 열려요.'},

var LABEL={android:'📱 안드로이드',windows:'💻 Windows 10/11',mac:'🍎 Mac',ios:'📱 아이폰 · 아이패드'};
var ORDER=['android','ios','windows','mac'];
function myDevice(){
  var u=navigator.userAgent||'';
  if(/Android/i.test(u))return'android';
  if(/iPhone|iPad|iPod/i.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))return'ios';
  if(/Macintosh|Mac OS X/i.test(u))return'mac';
  return'windows';
}
var state={app:'nurse',dev:myDevice()};
function btn(f){var href=f.url?f.url:f.web?WEB+f.web:RAW+f.file;return '<a class="go" href="'+href+'" target="_blank" rel="noopener"><span class="arrow">'+(f.web?'↗':'⬇')+'</span><span><b>'+f.name+'</b><small>'+f.size+'</small></span></a>';}
function render(){
  var a=APPS[state.app], devs=a.devs;
  if(!devs[state.dev]) state.dev=ORDER.filter(function(k){return devs[k]&&!devs[k].none;})[0];
  var d=devs[state.dev], mine=myDevice(), h='';
  h+='<div class="intro'+(a.wide?' wide':'')+'"><div><h2>'+a.title+'</h2><ul>'+a.points.map(function(p){return'<li>'+p+'</li>';}).join('')+'</ul></div>'+
     '<img class="shot'+(a.wide?' wide':'')+(a.img==='matjip'?' icon':'')+'" src="'+IMG[(d&&d.shot)||a.img]+'" alt="'+a.title+' 화면"></div>';
  h+='<div><div class="label">어떤 기기에서 쓰나요?</div><div class="devs" role="group" aria-label="기기">';
  ORDER.forEach(function(k){ if(!devs[k])return;
    h+='<button class="dev" type="button" data-dev="'+k+'" aria-pressed="'+(k===state.dev)+'">'+LABEL[k]+(k===mine?'<span class="mine">내 기기</span>':'')+'</button>'; });
  h+='</div></div>';
  if(d.none){ h+='<div class="tip">'+d.none+'</div>'; }
  else{
    (d.multi||[d]).forEach(function(f){ h+=btn(f); });
    if((state.dev==='android'||state.dev==='ios')&&mine!==state.dev) h+='<p class="alt">컴퓨터에서 보고 있다면, 이 페이지 링크를 카톡으로 휴대폰에 보내서 휴대폰에서 누르세요.</p>';
    h+='<div><div class="label">'+(d.web?'앱처럼 쓰는 방법':'설치 방법')+'</div></div><ol class="steps">'+d.steps.map(function(s){return'<li><span>'+s.replace('FILE',d.exe||'')+'</span></li>';}).join('')+'</ol>';
    if(d.tip) h+='<div class="tip">'+d.tip+'</div>';
  }
  var p=document.getElementById('panel'); p.innerHTML=h; p.setAttribute('aria-labelledby','t-'+state.app);
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.app===state.app);t.tabIndex=t.dataset.app===state.app?0:-1;});
}
var KEYS=[].map.call(document.querySelectorAll('.tab'),function(t){return t.dataset.app;});
document.querySelector('.tabs').addEventListener('click',function(e){var t=e.target.closest('.tab');if(!t)return;state.app=t.dataset.app;try{history.replaceState(null,'','#'+state.app)}catch(_){}render();});
document.querySelector('.tabs').addEventListener('keydown',function(e){
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return; var i=KEYS.indexOf(state.app);
  state.app=KEYS[(i+(e.key==='ArrowRight'?1:KEYS.length-1))%KEYS.length]; render(); document.getElementById('t-'+state.app).focus();});
document.getElementById('panel').addEventListener('click',function(e){
  var d=e.target.closest('.dev'); if(d){state.dev=d.dataset.dev;render();return;}
  var c=e.target.closest('.copy'); if(c){var el=document.getElementById(c.dataset.copy),txt=el.textContent;
    var done=function(){c.textContent='복사됨';setTimeout(function(){c.textContent='복사'},1500)};
    var pick=function(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent='선택됨 · Ctrl+C';};
    try{navigator.clipboard.writeText(txt).then(done,pick)}catch(_){pick()} }
});
var hh=(location.hash||'').slice(1); if(APPS[hh])state.app=hh;
render();
</script>
