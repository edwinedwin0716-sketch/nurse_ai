<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등불 원정대</title>
<style>
/* 등불 하나로 어두운 동굴을 비추는 느낌: 따뜻한 검은 바탕 + 호박색(등불) 강조 하나 */
:root{
  --bg:#14100b; --surface:#211a12; --surface2:#2b2218; --line:#40331f; --ink:#f1e8d8; --sub:#ac9d84;
  --amber:#f0a63a; --amber-ink:#1c1206; --amber-soft:rgba(240,166,58,.16);
  --red:#e0654f; --green:#7fc98b; --floor:#2c251b; --floor-line:#463a28;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#14100b radial-gradient(900px 420px at 50% -80px,rgba(240,166,58,.17),transparent 70%) no-repeat;color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top,0) max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:700;min-height:42px}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}

/* 첫 화면 */
.title{max-width:640px;margin:0 auto;padding:22px 0 30px;display:flex;flex-direction:column;gap:20px}
.hero-head{display:flex;align-items:center;gap:14px}
.hero-head svg{width:68px;height:84px;flex:none}
.hero-head h1{font-size:clamp(28px,8vw,40px);letter-spacing:-1px;line-height:1.15}
.hero-head p{margin:4px 0 0;color:var(--sub);font-size:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:13px;letter-spacing:.08em;color:var(--amber);font-weight:700}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .em{font-size:30px;line-height:1.2}
.pcard b{font-size:15px}
.pcard small{color:var(--sub);font-size:12px;line-height:1.35}
.pcard[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.pcard .tick{font-size:12px;font-weight:700;color:var(--amber);min-height:18px}
.scen{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%}
.scen .no{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--amber)}
.scen b{display:block}.scen small{color:var(--sub);font-size:12.5px;display:block}
.scen .go{color:var(--amber);font-weight:700;font-size:13px;white-space:nowrap}
.scen:disabled{opacity:.45;cursor:default}.scen:disabled .go{color:var(--sub)}
.note{color:var(--sub);font-size:13px;margin:0}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.foot a{color:var(--sub);font-size:13px}

/* 전투 화면 */
.bar{display:flex;align-items:center;gap:8px;padding:8px 0}
.bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.bar .round{color:var(--amber);font-weight:700;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.left{min-width:0;display:flex;flex-direction:column;gap:8px}
@media (min-width:920px){.main{grid-template-columns:minmax(0,1fr) 400px;align-items:start;gap:18px}}
.order{display:flex;gap:6px;overflow-x:auto;min-height:36px;padding-bottom:2px;scrollbar-width:none}
.order::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 6px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
.chip .e{font-size:17px}
.chip.now{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.chip.done{opacity:.4}
.chip.hint{color:var(--sub);font-weight:500;padding-left:10px}
#board{display:block;width:100%;height:auto;max-height:66vh;background:#0e0b07;border:1px solid var(--line);border-radius:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cell{fill:var(--floor);stroke:var(--floor-line);stroke-width:1.5}
.cell.rock{fill:#18130d;stroke:#2a2217}
.cell.hl{cursor:pointer;stroke-width:2.5}
.cell.hl.move{fill:rgba(240,166,58,.30);stroke:var(--amber)}
.cell.hl.atk{fill:rgba(224,101,79,.34);stroke:var(--red)}
.cell.hl.heal{fill:rgba(127,201,139,.30);stroke:var(--green)}
.deco{font-size:24px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.unit{transition:transform .22s ease-out;cursor:pointer}
.unit circle.body{fill:#1a2430;stroke:#8fb2d6;stroke-width:2}
.unit.mon circle.body{fill:#2a1512;stroke:#a85a48}
.unit.active circle.body{stroke:var(--amber);stroke-width:3.5}
.unit .em{font-size:23px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.unit .hpbg{fill:#000;opacity:.75}
.unit .hpfg{fill:var(--green)}
.unit.mon .hpfg{fill:var(--red)}
.unit .hpt{font-size:10px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.unit .st{font-size:12px;text-anchor:middle;pointer-events:none}
.float{font-size:19px;font-weight:800;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:4px;animation:rise .85s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
@media (prefers-reduced-motion:reduce){.unit{transition:none}.float{animation-duration:.01s}}
#info{font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
#info:empty{display:none}
#log{font-size:13px;color:var(--sub);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end}
#log div:last-child{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
#prompt{display:flex;align-items:center;gap:8px;font-weight:700;min-height:42px}
#prompt span{flex:1;min-width:0}
#pbody{display:flex;flex-direction:column;gap:10px}
#pbody.dim{opacity:.4;pointer-events:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{appearance:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px;min-height:38px}
.tabs button[aria-selected="true"]{border-color:var(--amber);background:var(--amber-soft)}
.tabs .ok{color:var(--green)}
.stat{color:var(--sub);font-size:13px;margin:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.card{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.card .nm{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;min-width:0}
.card .nm i{font-style:normal;flex:none;min-width:26px;text-align:center;background:#000;color:var(--amber);border-radius:6px;font-size:12px;padding:1px 4px;font-variant-numeric:tabular-nums}
.card .nm span{overflow-wrap:anywhere;line-height:1.25}
.card .hf{font-size:12px;color:var(--sub);line-height:1.35;overflow-wrap:anywhere}
.card .hf b{color:var(--ink);font-weight:600}
.card.sel{border-color:var(--amber);background:var(--amber-soft)}
.card .badge{position:absolute;top:-7px;right:-5px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap}
.rowbtn .btn{flex:1}
.tcard{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.tcard .nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.tcard .nm i{font-style:normal;background:#000;color:var(--amber);border-radius:6px;font-size:12px;padding:1px 6px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:6px}
.half{appearance:none;text-align:left;border:1.5px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:7px 9px;font-size:13px;min-height:42px;font-weight:600;overflow-wrap:anywhere}
.half small{display:block;color:var(--sub);font-weight:500;font-size:11px}
.half.basic{border-color:var(--line);background:transparent;font-size:12px;text-align:center;padding:4px}
.half:disabled{opacity:.3;border-color:var(--line);background:transparent;cursor:default}
.overlay{position:fixed;inset:0;background:rgba(6,4,2,.8);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.dialog h2{font-size:22px}
.dialog h3{font-size:14px;color:var(--amber);margin-top:4px}
.dialog p,.dialog ul{margin:0;font-size:14px}
.dialog ul{padding-left:18px}.dialog li{margin:3px 0}
.dialog .btn{width:100%}
.big{font-size:44px;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:700;min-height:44px}
.seg button[aria-selected="true"]{background:var(--amber);color:var(--amber-ink)}
.inp{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--amber);outline-offset:1px}
.inp.code{text-transform:uppercase;letter-spacing:.2em;font-weight:800;font-variant-numeric:tabular-nums}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.netmsg{margin:0;font-size:14px;color:var(--amber);min-height:21px}
.netmsg.err{color:var(--red)}
.codebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.code{font-size:34px;font-weight:800;letter-spacing:.18em;color:var(--amber);font-variant-numeric:tabular-nums}
.plist{display:flex;gap:6px;flex-wrap:wrap}
.pcard:disabled{opacity:.55;cursor:default}
.scen.on{border-color:var(--amber);background:var(--amber-soft)}
.title .bar{padding-top:0}
.emotes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.emotes::-webkit-scrollbar{display:none}
.emotes .btn{flex:none;white-space:nowrap}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
.toast{background:var(--amber);color:var(--amber-ink);font-weight:700;border-radius:999px;padding:7px 16px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.cell.hl.watch{cursor:default;stroke-dasharray:5 4}
.unit.other circle.body{stroke:#5d7790}
.tabs small{font-weight:500;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>

/* ───────── 연결 통로: PeerJS(WebRTC) 또는 같은 브라우저 탭끼리(시험용 loop) ─────────

var LOOP = !!window.__loop || /[?&]loop\b/.test(location.search);
var PAGE_URL = 'https://edwinedwin0716-sketch.github.io/nurse_ai/game/';

  dc.on('data', function (d) { if (c.ondata) c.ondata(d); });

}
function peerHost(code, cb) {

  peer.on('disconnected', function () { if (!dead) setTimeout(function () { try { if (!dead && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 2000); });
  peer.on('error', function (e) { cb.error(e.type || 'error'); });

}

  var peer = new Peer({ debug: 0 }), dead = false;
  peer.on('open', function () {

}

  sendLobby();
}
function lobbyData() { return { code: LB.code, claims: LB.claims, si: LB.si, unlocked: S.unlocked, hp: S.hp, players: NET.players.map(function (p) { return { pid: p.pid, name: p.name, on: p.on }; }) }; }
function sendLobby() {
  var d = lobbyData();
  for (var pid in NET.conns) { try { NET.conns[pid].send({ t: 'lobby', lb: d }); } catch (e) {} }
  showLobby(d);
}
function toLobby() {
  NET.players.filter(function (p) { return !p.on; }).forEach(function (p) { dropPlayer(p.pid); });
  LB.si = Math.min(LB.si, S.unlocked - 1);
  sendLobby();
}
function hostStart() {
  var party = HERO_IDS.filter(function (id) { return LB.claims[id]; }).map(function (id) { return { id: id, owner: LB.claims[id] }; });
  if (party.length < 2) return;
  newGame(LB.si, party);
}

/* ───────── 친구(들어가는) 쪽 ───────── */
var joinInfo = null;
function clientJoin(code, name) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
  if (code.length < 5) { netFail('방 코드는 글자·숫자 5개예요.'); return; }
  joinInfo = { code: code, name: name };
  netBusy('방 ' + code + '에 들어가는 중…');
  var done = false, tr = peerJoin(code, {
    open: function (c) {
      if (done) return; done = true;
      NET = { mode: 'client', me: 'p:' + name, players: [], conns: {}, code: code, tr: tr, conn: c };
      c.ondata = clientData;
      c.onclose = function () { if (NET.mode === 'client' && NET.conn === c) clientLost('방장이 나갔어요', '방장이 방을 닫았거나 연결이 끊겼어요.'); };
      c.send({ t: 'hello', name: name });
    },
    error: function (type) {
      if (done) { if (type === 'peer-unavailable') return; return; }
      done = true; try { tr.close(); } catch (e) {} netFail(netErrText(type));
    }
  });
  setTimeout(function () { if (!done) { done = true; try { tr.close(); } catch (e) {} netFail(netErrText('timeout')); } }, 15000);
}
function clientData(d) {
  if (!d || typeof d !== 'object' || NET.mode !== 'client') return;
  if (d.t === 'ok') NET.me = d.pid;
  else if (d.t === 'no') { var why = d.why; NET.conn.onclose = null; netReset(); showTitle(); netFail(why); }
  else if (d.t === 'lobby') { V = null; closeOverlay(); showLobby(d.lb); }
  else if (d.t === 'view') { V = d.v; render(); }
}
function clientLost(title, text) {
  netReset(); V = null;
  overlay('<div class="big">🕯️</div><h2>' + title + '</h2><p>' + text + ' 방이 아직 열려 있다면 같은 코드와 이름으로 다시 들어갈 수 있어요.</p>' +
    '<button class="btn primary" data-act="re">다시 들어가기</button><button class="btn" data-act="home">처음 화면으로</button>', function (act) {
    closeOverlay(); showTitle(); if (act === 're' && joinInfo) clientJoin(joinInfo.code, joinInfo.name);
  });
}
function netLeave() {
  if (NET.mode === 'client' && NET.conn) { NET.conn.onclose = null; try { NET.conn.send({ t: 'bye' }); } catch (e) {} }
  abortAll(); G = null; V = null; netReset(); showTitle();
}
window.addEventListener('pagehide', function () { if (NET.mode === 'client' && NET.conn) { try { NET.conn.send({ t: 'bye' }); } catch (e) {} } else if (NET.mode === 'host' && NET.tr) { try { NET.tr.close(); } catch (e) {} } });

/* ───────── 대기실 화면 ───────── */
function netBusy(text) { var el = $('netmsg'); if (el) { el.textContent = text; el.className = 'netmsg'; } }
function netFail(text) { var el = $('netmsg'); if (el) { el.textContent = text; el.className = 'netmsg err'; } }
function lobbyNote(text) { var el = $('lbnote'); if (el) el.textContent = text; }
function showLobby(d) {
  scr = 'lobby'; B = null;
  var host = NET.mode === 'host', me = NET.me, n = Object.keys(d.claims).length;
  NET.players = host ? NET.players : d.players;
  var nameOf = function (pid) { var p = d.players.filter(function (x) { return x.pid === pid; })[0]; return p ? p.name : '?'; };
  var html = '<div class="title"><header class="bar"><button class="btn small" id="leave">← 나가기</button><b>대기실</b><button class="btn small" id="rules">규칙 보기</button></header>' +
    '<div class="sec"><h2>방 코드 — 친구에게 알려 주세요</h2><div class="codebox"><span class="code" id="roomCode">' + d.code + '</span><button class="btn small" id="copy">초대 링크 복사</button></div>' +
    '<p class="note" id="lbnote">친구는 첫 화면 → 친구와 온라인 → 방 들어가기에 이 코드를 넣으면 돼요.</p></div>' +
    '<div class="sec"><h2>함께 하는 사람 (' + d.players.length + '/3)</h2><div class="plist">' + d.players.map(function (p) {
      return '<span class="chip">' + (p.pid === 'host' ? '👑 ' : '🙂 ') + esc(p.name) + (p.pid === me ? ' (나)' : '') + '</span>';
    }).join('') + '</div></div>' +
    '<div class="sec"><h2>영웅 맡기 (모두 합쳐 2~3명)</h2><div class="party">' + HERO_IDS.map(function (id) {
      var h = HEROES[id], own = d.claims[id], mine = own === me;
      return '<button class="pcard" data-claim="' + id + '" aria-pressed="' + !!mine + '"' + (own && !mine ? ' disabled' : '') + '><span class="em">' + h.emoji + '</span><b>' + h.name + '</b><small>체력 ' + (h.hp + d.hp) + ' · 카드 ' + h.cards.length + '장<br>' + h.blurb + '</small><span class="tick">' + (own ? (mine ? '✔ 내가 맡아요' : esc(nameOf(own)) + ' 님') : '비어 있어요') + '</span></button>';
    }).join('') + '</div><p class="note">' + (host ? '방장은 여러 영웅을 맡을 수 있어요. 둘이서 영웅 3명으로 할 때 남는 영웅을 눌러 주세요.' : '영웅 하나를 눌러서 맡아요. 다시 누르면 내려놓아요.') + '</p></div>' +
    '<div class="sec"><h2>모험' + (host ? ' 고르기' : ' (방장이 골라요)') + '</h2>' + SCEN.map(function (s, i) {
      var open = i < d.unlocked;
      return '<button class="scen' + (i === d.si ? ' on' : '') + '" data-si="' + i + '"' + (open && host ? '' : ' disabled') + '><span class="no">' + (i + 1) + '</span><span><b>' + s.name + '</b><small>' + (open ? s.intro : '앞 모험을 깨면 열려요') + '</small></span><span class="go">' + (i === d.si ? '✔ 선택' : open ? '' : '🔒') + '</span></button>';
    }).join('') + '</div>' +
    (host ? '<button class="btn primary" id="start"' + (n >= 2 ? '' : ' disabled') + '>' + (n >= 2 ? '모험 시작 ▶ (영웅 ' + n + '명)' : '영웅을 2명 이상 맡아야 시작해요') + '</button>' : '<p class="note">방장이 시작하면 바로 모험이 열려요.</p>') + '</div>';
  $('app').innerHTML = html;
  $('rules').onclick = showRules;
  $('leave').onclick = function () { if (host) { abortAll(); G = null; netReset(); showTitle(); } else netLeave(); };
  $('copy').onclick = function () {
    var url = (/^https?:/.test(location.protocol) ? location.href.split('#')[0] : PAGE_URL) + '#room-' + d.code, done = function () { lobbyNote('초대 링크를 복사했어요. 카톡에 붙여넣어 보내세요.'); };
    try { navigator.clipboard.writeText(url).then(done, function () { lobbyNote(url); }); } catch (e) { lobbyNote(url); }
  };
  if ($('start')) $('start').onclick = hostStart;
  $('app').onclick = function (e) {
    var c = e.target.closest('[data-claim]'), s = e.target.closest('[data-si]');
    if (c && !c.disabled) { if (host) lobbyClaim('host', c.dataset.claim); else { try { NET.conn.send({ t: 'claim', hero: c.dataset.claim }); } catch (e2) {} } }
    else if (s && !s.disabled && host) { LB.si = +s.dataset.si; sendLobby(); }
  };
}

/* ───────── 첫 화면 ───────── */
var LANTERN = '<svg viewBox="0 0 68 84" aria-hidden="true"><defs><radialGradient id="lg" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#f0a63a"/><stop offset="1" stop-color="#b8601c"/></radialGradient></defs>' +
  '<circle cx="34" cy="48" r="32" fill="#f0a63a" opacity=".14"/><path d="M24 12a10 10 0 0 1 20 0" fill="none" stroke="#8a7350" stroke-width="3"/><rect x="22" y="14" width="24" height="7" rx="2" fill="#8a7350"/>' +
  '<path d="M18 24h32l-4 44H22z" fill="url(#lg)"/><path d="M34 24v44M26 24l3 44M42 24l-3 44" stroke="#7a4313" stroke-width="1.6" opacity=".55"/><rect x="20" y="67" width="28" height="7" rx="2" fill="#8a7350"/></svg>';
var titleTab = 'solo';
function getNick() { try { return cleanName(localStorage.getItem('lantern-nick')); } catch (e) { return ''; } }
function showTitle() {
  scr = 'title'; B = null; closeOverlay();
  var room = (location.hash.match(/^#room-([A-Za-z0-9]{5})/) || [])[1];
  if (room) titleTab = 'net';
  var html = '<div class="title"><div class="hero-head">' + LANTERN + '<div><h1>등불 원정대</h1><p>카드 두 장으로 싸우는 육각 칸 동굴 모험</p></div></div>' +
    '<div class="seg" role="tablist"><button role="tab" data-tab="solo" aria-selected="' + (titleTab === 'solo') + '">🕯️ 혼자 하기</button><button role="tab" data-tab="net" aria-selected="' + (titleTab === 'net') + '">🌐 친구와 온라인</button></div>';
  if (titleTab === 'solo') {
    html += '<div class="sec"><h2>원정대 고르기 (2명 또는 3명)</h2><div class="party">' + HERO_IDS.map(function (id) {
      var h = HEROES[id], on = S.party.indexOf(id) >= 0;
      return '<button class="pcard" data-hero="' + id + '" aria-pressed="' + on + '"><span class="em">' + h.emoji + '</span><b>' + h.name + '</b><small>체력 ' + (h.hp + S.hp) + ' · 카드 ' + h.cards.length + '장<br>' + h.blurb + '</small><span class="tick">' + (on ? '✔ 함께 가요' : '') + '</span></button>';
    }).join('') + '</div><p class="note">혼자서 영웅을 모두 조종해요. 처음이라면 수호기사 + 야전 간호사 2명을 추천해요.</p></div>';
    html += '<div class="sec"><h2>모험</h2>' + SCEN.map(function (s, i) {
      var open = i < S.unlocked, done = S.cleared.indexOf(i) >= 0;
      return '<button class="scen" data-scen="' + i + '"' + (open ? '' : ' disabled') + '><span class="no">' + (i + 1) + '</span><span><b>' + s.name + '</b><small>' + (open ? s.intro : '앞 모험을 깨면 열려요') + '</small></span><span class="go">' + (done ? '✔ 다시 하기' : open ? '출발 ▶' : '🔒') + '</span></button>';
    }).join('') + '</div>';
  } else {
    html += '<div class="sec"><h2>내 별명 (게임 안에서만 보여요)</h2><input class="inp" id="nick" maxlength="10" placeholder="예: 등불이" autocomplete="off" value="' + esc(getNick()) + '">' +
      '<p class="note">진짜 이름 대신 별명을 써 주세요. 이 기기에만 저장돼요.</p></div>' +
      '<div class="sec"><h2>방 만들기</h2><button class="btn primary" id="mk">방 만들기 (내가 방장)</button><p class="note">방 코드가 나오면 친구에게 알려 주세요. 모험 기록은 방장 기기에 저장돼요.</p></div>' +
      '<div class="sec"><h2>방 들어가기</h2><div class="joinrow"><input class="inp code" id="code" maxlength="5" placeholder="방 코드 5자" autocomplete="off" autocapitalize="characters" value="' + (room ? esc(room.toUpperCase()) : '') + '"><button class="btn primary" id="jn">들어가기</button></div></div>' +
      '<p class="netmsg" id="netmsg" role="status"></p>' +
      '<p class="note">온라인은 인터넷이 필요해요. 2~3명이 각자 기기로 함께 해요. 연결할 때만 공개 PeerJS 서버를 거치고(방 코드만 전달), 개인정보는 보내지 않아요. 학교·회사 와이파이에서는 안 될 수 있어요.</p>';
  }
  var ups = []; if (S.hp) ups.push('최대 체력 +' + S.hp); if (S.up1) ups.push('−1 → +1 카드 ' + S.up1 + '장'); if (S.up2) ups.push('−2 → +0');
  html += '<p class="note">원정대 강화: ' + (ups.length ? ups.join(' · ') : '아직 없어요. 모험을 처음 깰 때마다 하나씩 얻어요.') + '</p>';
  html += '<div class="foot"><button class="btn small" id="rules">규칙 보기</button><button class="btn small" id="reset">기록 지우기</button>' +
    '<a href="https://qr.kakaopay.com/Ej8Yr8VXm" target="_blank" rel="noopener">☕ 간호학생에게 커피 한 잔</a></div></div>';
  $('app').innerHTML = html;
  $('rules').onclick = showRules;
  $('reset').onclick = function () {
    overlay('<h2>기록을 지울까요?</h2><p>열린 모험과 원정대 강화가 모두 처음으로 돌아가요.</p><button class="btn primary" data-act="yes">지우기</button><button class="btn" data-act="no">그만두기</button>', function (act) {
      if (act === 'yes') { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = loadSave(); }
      closeOverlay(); showTitle();
    });
  };
  var nick = function () {
    var n = cleanName($('nick').value);
    if (!n) { netFail('먼저 별명을 적어 주세요.'); $('nick').focus(); return ''; }
    try { localStorage.setItem('lantern-nick', n); } catch (e) {}
    return n;
  };
  if ($('mk')) {
    $('mk').onclick = function () { var n = nick(); if (!n) return; if (navigator.onLine === false && !LOOP) { netFail(netErrText('offline')); return; } hostCreate(n); };
    $('jn').onclick = function () { var n = nick(); if (!n) return; if (navigator.onLine === false && !LOOP) { netFail(netErrText('offline')); return; } clientJoin($('code').value, n); };
    if (room) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} netBusy('별명을 적고 [들어가기]를 누르면 방 ' + room.toUpperCase() + '에 들어가요.'); }
  }
  $('app').onclick = function (e) {
    var p = e.target.closest('[data-hero]'), s = e.target.closest('[data-scen]'), t = e.target.closest('[data-tab]');
    if (t) { titleTab = t.dataset.tab; showTitle(); }
    else if (p) {
      var id = p.dataset.hero, i = S.party.indexOf(id);
      if (i >= 0) { if (S.party.length > 2) S.party.splice(i, 1); } else S.party.push(id);
      S.party = HERO_IDS.filter(function (x) { return S.party.indexOf(x) >= 0; });
      saveNow(); showTitle();
    } else if (s && !s.disabled) { netReset(); newGame(+s.dataset.scen, S.party.map(function (id) { return { id: id, owner: 'host' }; })); }
  };
}
window.onBack = function () {
  if ($('ov').innerHTML && !(V && V.over)) { closeOverlay(); ovKey = ''; return true; }
  if (scr === 'game' && !V.net) { leaveGame(); return true; }
  if (scr === 'game') { $('home').click(); return true; }
  if (scr === 'lobby') { $('leave').click(); return true; }
  return false;
};
window.LD = { get G() { return G; }, get V() { return V; }, get S() { return S; }, get NET() { return NET; }, K: K, dist: dist };
showTitle();
</script>
