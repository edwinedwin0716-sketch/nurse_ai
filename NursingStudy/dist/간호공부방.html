<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b1430">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>간호 공부방</title>
<style>
:root{--bg:#0b1430;--bg2:#101c40;--card:#16244f;--card2:#1c2c5e;--text:#eef2ff;--sub:#9aa7cc;--sep:rgba(160,180,255,.12);--accent:#5ab8ff;--fill:rgba(140,165,255,.12);--brand:#b18cff;--red:#ff6b81;--orange:#ffb547;--green:#4dffb0;--yellow:#ffe066;--hl:rgba(255,224,102,.22);--shadow:0 6px 24px rgba(0,0,0,.28);--r:20px;--r2:14px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(900px 600px at 10% -10%,#1b2d6b 0,transparent 60%),radial-gradient(700px 500px at 110% 10%,#2a1b5e 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--text);font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.view{display:none;max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));min-height:100vh}
.view.on{display:block}
.top{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.back{border:0;background:none;color:var(--accent);font-size:17px;padding:4px 0}
.icon-btn{border:0;background:var(--fill);border-radius:13px;width:34px;height:34px;font-size:17px;display:flex;align-items:center;justify-content:center}
.icon-btn.on{background:rgba(255,224,102,.18);color:var(--yellow);box-shadow:0 0 12px rgba(255,224,102,.4)}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.beta{font-size:12px;font-weight:800;color:#1a1033;background:var(--brand);box-shadow:0 0 14px rgba(177,140,255,.6);border-radius:999px;padding:2px 8px;letter-spacing:0}
.lead{color:var(--sub);margin:6px 2px 0;font-size:14.5px}
.section{color:var(--sub);font-size:13px;font-weight:600;margin:24px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep);border-radius:var(--r2);padding:9px 12px;margin-top:16px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:4px;border:0;background:var(--card);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow);min-width:0}
.tile .i{font-size:24px}.tile{border-radius:var(--r)}.tile b{font-size:16px}.tile small{color:var(--sub);font-size:12.5px}
.tile.primary{background:linear-gradient(135deg,#3a7bff,#8a5cff);color:#fff;box-shadow:0 0 22px rgba(110,120,255,.35)}.tile.primary small{color:rgba(255,255,255,.85)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--sep);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left}
.row:last-child{border-bottom:0}
.row{position:relative}.row::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c,transparent);box-shadow:0 0 10px var(--c,transparent);opacity:.9}
.row .em{font-size:19px;width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c,#5ab8ff) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#5ab8ff) 55%,transparent),0 0 14px color-mix(in srgb,var(--c,#5ab8ff) 30%,transparent)}
.row .info{flex:1;min-width:0}.row .info b{display:block;font-size:16px;font-weight:600}
.row .info small{color:var(--sub);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:#c7c7cc;font-size:18px;flex:none}
.pill{font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 7px;flex:none}
.pill{border-radius:999px}.pill.skill{background:rgba(77,255,176,.12);color:#6dffc0;box-shadow:inset 0 0 0 1px rgba(77,255,176,.35)}.pill.concept{background:rgba(90,184,255,.12);color:#7cc8ff;box-shadow:inset 0 0 0 1px rgba(90,184,255,.35)}
.pill.done{background:var(--fill);color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:26px 16px;font-size:15px}
.seg{display:flex;background:var(--fill);border-radius:14px;padding:2px}
.seg button{flex:1;border:0;background:transparent;font-size:14px;padding:6px 8px;border-radius:7px;white-space:nowrap}
.seg button.on{background:var(--card2);font-weight:700;color:#fff;box-shadow:0 0 0 1px rgba(90,184,255,.35),0 0 14px rgba(90,184,255,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--sep);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:color-mix(in srgb,var(--c,#5ab8ff) 22%,transparent);border-color:var(--c,#5ab8ff);color:#fff;font-weight:600;box-shadow:0 0 12px color-mix(in srgb,var(--c,#5ab8ff) 40%,transparent)}
.big{display:block;width:100%;margin-top:18px;padding:15px;border-radius:var(--r);border:0;background:linear-gradient(135deg,#3a7bff,#8a5cff);color:#fff;box-shadow:0 0 20px rgba(110,120,255,.3);font-size:17px;font-weight:700}
.big:disabled{opacity:.45}.big.ghost{background:var(--fill);color:var(--accent);box-shadow:none}
/* 주제 */
.t-head h1{font-size:26px}.t-en{color:var(--sub);font-size:14px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;color:var(--sub);background:var(--fill);border-radius:999px;padding:2px 8px}
.summary{background:linear-gradient(135deg,color-mix(in srgb,var(--c,#5ab8ff) 18%,transparent),rgba(138,92,255,.12));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#5ab8ff) 35%,transparent);border-radius:var(--r);padding:14px 16px;margin-top:14px;font-size:15.5px}
.tabs{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);padding:10px 0 8px;margin-top:8px}
.block{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-top:12px;box-shadow:var(--shadow)}
.block h3{margin:0 0 6px;font-size:16.5px}
.block p{margin:4px 0}
.block ul{margin:4px 0;padding-left:20px}.block li{margin:3px 0}
.nums{display:grid;grid-template-columns:auto 1fr;gap:0}
.nums div{padding:8px 4px;border-bottom:1px solid var(--sep);font-size:15px}
.nums div:nth-child(odd){color:var(--sub);padding-right:14px}
.nums div:nth-child(even){font-weight:700}
.nums div:nth-last-child(-n+2){border-bottom:0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:10px 0 10px 40px;border-bottom:1px solid var(--sep)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:var(--r);background:var(--fill);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.steps li.key::before{background:var(--orange);color:#1a1200;box-shadow:0 0 12px rgba(255,181,71,.55)}
.steps .why{display:block;color:var(--sub);font-size:13.5px;margin-top:2px}
.steps .do.hidden{background:var(--hl);color:transparent;border-radius:6px;user-select:none;cursor:pointer}
.steps .do.hidden::after{content:'눌러서 보기';color:var(--sub);font-size:13px}
.legend{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;background:var(--orange);box-shadow:0 0 8px rgba(255,181,71,.6)}
.warn{border-left:4px solid var(--orange)}
.vid{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep);text-decoration:none;color:var(--text)}
.vid:last-child{border-bottom:0}.vid .yt{width:34px;height:24px;border-radius:8px;background:#ff0000;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.vid small{color:var(--sub);display:block;font-size:12.5px}
.report{display:block;text-align:center;font-size:13.5px;margin-top:18px;color:var(--sub)}
/* 문제 */
.qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:14px;margin-top:6px}
.meter{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#5ab8ff,#b18cff);box-shadow:0 0 10px #5ab8ff;width:0;transition:width .3s}
.qcard{background:var(--card);border-radius:16px;padding:18px 16px;margin-top:14px;box-shadow:var(--shadow)}
.qtopic{font-size:12.5px;color:var(--sub)}
.qtext{font-size:18px;font-weight:700;margin:6px 0 14px;word-break:keep-all}
.opt{display:flex;gap:10px;width:100%;border:1.5px solid var(--sep);background:var(--card);border-radius:var(--r2);padding:12px 14px;text-align:left;font-size:15.5px;margin-top:8px;word-break:keep-all}
.opt .n{font-weight:700;color:var(--sub);flex:none}
.opt.right{border-color:var(--green);background:rgba(77,255,176,.1);box-shadow:0 0 14px rgba(77,255,176,.25)}
.opt.wrong{border-color:var(--red);background:rgba(255,107,129,.1);box-shadow:0 0 14px rgba(255,107,129,.22)}
.opt:disabled{cursor:default;opacity:1}
.explain{margin-top:14px;padding:12px 14px;border-radius:var(--r2);background:var(--fill);font-size:15px;display:none}
.explain.on{display:block}.explain b.ok{color:var(--green)}.explain b.no{color:var(--red)}
.score{font-size:54px;font-weight:800;text-align:center;margin-top:20px}
.score small{display:block;font-size:16px;color:var(--sub);font-weight:500}
.coffee{display:flex;align-items:center;gap:12px;margin:26px 0 8px;padding:14px 16px;border-radius:var(--r);box-shadow:0 0 18px rgba(254,229,0,.18);background:#FEE500;color:#191919;text-decoration:none}
.coffee .cup{font-size:24px}.coffee b{display:block;font-size:15px}.coffee small{font-size:12.5px;opacity:.8}
.toast{pointer-events:none;position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{color:var(--sub);font-size:12.5px;text-align:center;margin-top:10px}
</style>
</head>
<body>

<!-- 홈 -->
<section class="view on" id="v-home">
  <h1>간호 공부방 <span class="beta">베타</span></h1>
  <p class="lead">개념 · 술기 설명을 읽고, 문제로 스스로 점검해요. 내용은 계속 늘어나요.</p>
  <div class="search"><span>🔍</span><input id="q" placeholder="찾기 (예: ICP, 유치도뇨, 쇼크)" autocomplete="off"></div>
  <div id="results"></div>
  <div id="homeMain">
    <div class="grid2">
      <button class="tile primary" onclick="openQuizSetup()"><span class="i">📝</span><b>문제 풀기</b><small id="qCount"></small></button>
      <button class="tile" onclick="startWrong()"><span class="i">❌</span><b>오답 노트</b><small id="wCount"></small></button>
      <button class="tile" onclick="openList('★')"><span class="i">⭐</span><b>즐겨찾기</b><small id="sCount"></small></button>
      <button class="tile" onclick="openList('')"><span class="i">📚</span><b>전체 주제</b><small id="tCount"></small></button>
    </div>
    <div id="recentBox"></div>
    <div class="section">과목</div>
    <div class="card" id="subjects"></div>
  </div>
  <a class="report" id="askAdd" target="_blank" rel="noopener">➕ 이런 내용도 넣어 주세요 / 틀린 내용 알려 주기</a>
  <a class="coffee" href="https://qr.kakaopay.com/Ej8Yr8VXm" target="_blank" rel="noopener"><span class="cup">☕</span><span><b>Buy a poor nursing student a coffee</b><small>가난한 간호학생에게 커피 한 잔 (1,000원)</small></span></a>
  <p class="foot">교과서 일반 내용을 바탕으로 정리했어요. 실습·시험은 학교 교재와 기관 지침을 따르세요.</p>
</section>

<!-- 주제 목록 -->
<section class="view" id="v-list">
  <div class="top"><button class="back" onclick="back()">‹ 처음</button></div>
  <h1 id="listTitle"></h1>
  <div class="seg" id="kind" style="margin-top:14px"><button data-v="" class="on">전체</button><button data-v="개념">개념</button><button data-v="술기">술기</button></div>
  <div class="card" id="list" style="margin-top:12px"></div>
</section>

<!-- 주제 -->
<section class="view" id="v-topic">
  <div class="top"><button class="back" onclick="back()">‹ 뒤로</button><button class="icon-btn" id="star" onclick="toggleStar()" aria-label="즐겨찾기">☆</button></div>
  <div class="t-head"><h1 id="tTitle"></h1><div class="t-en" id="tEn"></div><div class="tags" id="tTags"></div></div>
  <div class="summary" id="tSummary"></div>
  <div class="tabs"><div class="seg" id="ttab"><button data-v="learn" class="on">설명</button><button data-v="steps">술기 순서</button><button data-v="quiz">문제</button></div></div>
  <div id="tBody"></div>
  <a class="report" id="tReport" target="_blank" rel="noopener">✏️ 이 내용이 틀렸거나 더 넣고 싶은 게 있어요</a>
</section>

<!-- 문제 설정 -->
<section class="view" id="v-setup">
  <div class="top"><button class="back" onclick="back()">‹ 처음</button></div>
  <h1>문제 풀기</h1>
  <p class="lead">과목과 문제 수를 고르세요. 틀린 문제는 오답 노트에 모여요.</p>
  <div class="section">과목</div>
  <div class="chips" id="setupSubj"></div>
  <div class="section">문제 수</div>
  <div class="seg" id="setupN"><button data-v="5">5</button><button data-v="10" class="on">10</button><button data-v="20">20</button><button data-v="0">전체</button></div>
  <button class="big" onclick="startFromSetup()">시작하기</button>
</section>

<!-- 문제 -->
<section class="view" id="v-quiz">
  <div class="top"><button class="back" onclick="quitQuiz()">‹ 그만하기</button></div>
  <div class="qhead"><span id="qPos"></span><span id="qRight"></span></div>
  <div class="meter"><i id="qMeter"></i></div>
  <div class="qcard"><div class="qtopic" id="qTopic"></div><div class="qtext" id="qText"></div><div id="qOpts"></div>
    <div class="explain" id="qExplain"></div></div>
  <button class="big" id="qNext" style="display:none" onclick="nextQ()">다음 문제</button>
</section>

<!-- 결과 -->
<section class="view" id="v-done">
  <div class="top"><button class="back" onclick="go('v-home')">‹ 처음</button></div>
  <div class="score" id="dScore"></div>
  <div id="dList"></div>
  <button class="big" onclick="retryWrong()" id="dRetry">틀린 문제만 다시</button>
  <button class="big ghost" onclick="go('v-home')">처음으로</button>
</section>

<div class="toast" id="toast"></div>
<script>
window.TOPICS = [{"id":"oxygen","subject":"기본간호학","kind":"개념","title":"산소요법","en":"Oxygen therapy","tags":["호흡","산소","COPD","안전"],"summary":"산소요법은 저산소혈증을 교정하고 호흡·심장의 일을 줄이기 위해 처방에 따라 산소를 주는 치료이다. 기구마다 유량과 흡입 산소 농도(FiO2)가 다르므로 기구의 특성을 알고, 가습·화재 안전·COPD 환자의 저농도 산소·산소 독성에 주의해야 한다.","numbers":[{"label":"비강 캐뉼라","value":"1~6 L/분, FiO2 약 24~44% (1 L/분 늘 때마다 약 4%씩 증가)"},{"label":"단순 안면 마스크","value":"5~8 L/분 (최소 5 L/분), FiO2 약 40~60%"},{"label":"벤추리 마스크","value":"어댑터에 표시된 유량(대략 4~12 L/분), FiO2 약 24~50% 정도를 정확하게 공급"},{"label":"비재호흡 마스크","value":"10~15 L/분, FiO2 약 60~100% (고농도)"},{"label":"COPD 환자 목표 SpO2","value":"88~92% (처방에 따름)"},{"label":"일반 성인 정상 SpO2","value":"95~100%"},{"label":"산소 독성 위험","value":"FiO2 50% 이상을 24~48시간 넘게 투여할 때"}],"sections":[{"h":"목적과 저산소증 징후","items":["목적: 저산소혈증 교정, 호흡 노력과 심근 부담 감소.","초기 징후: 불안·안절부절못함, 빈맥, 빈호흡, 혈압 상승.","후기 징후: 청색증, 서맥, 저혈압, 의식 저하, 부정맥.","산소는 약물이므로 의사 처방(유량·농도·기구·시간)에 따라 투여한다."]},{"h":"기구별 특징","items":["비강 캐뉼라: 저유량. 먹고 말하기 편해 가장 흔히 쓴다. 입으로 숨을 쉬어도 어느 정도 산소가 공급되지만, 6 L/분을 넘기면 농도는 크게 늘지 않고 코 점막이 건조·자극된다.","단순 안면 마스크: 5 L/분 미만이면 마스크 안에 내쉰 이산화탄소가 다시 흡입되므로 최소 5 L/분 이상으로 준다. 먹거나 말할 때 불편하고 피부 압박이 생길 수 있다.","벤추리 마스크: 고유량 기구. 어댑터(색깔·크기)에 따라 정해진 FiO2를 정확하게 줄 수 있어, 정확한 저농도가 필요한 COPD 환자에게 적합하다.","비재호흡 마스크: 저장주머니와 일방향 밸브가 있어 고농도 산소를 준다. 착용 전 저장주머니를 산소로 채우고, 흡기 때도 주머니가 완전히 쭈그러지지 않도록(약 2/3 이상 부풀어 있게) 유량을 맞춘다. 단기간·응급 상황에 쓴다.","FiO2 값은 대상자의 호흡 양상에 따라 달라지므로 기구별 범위는 대략적인 값이다."]},{"h":"가습","items":["산소는 건조한 가스이므로 점막 건조·분비물 끈적임을 막기 위해 가습한다.","일반적으로 비강 캐뉼라로 4 L/분 이상 줄 때 가습하며, 구체적 기준은 기관 지침에 따른다.","가습병에는 멸균 증류수를 표시선까지 채우고, 물이 줄면 보충한다(오염 방지를 위해 기관 지침에 따라 교체).","튜브에 고인 물은 대상자 쪽으로 흘러가지 않게 빼낸다."]},{"h":"안전 — 화재 예방","items":["산소는 스스로 타지는 않지만 불이 붙는 것을 돕는다(조연성).","병실 안과 주변에서 흡연·촛불·성냥 등 화기를 금지하고, 산소 사용 중 표시를 붙인다.","정전기가 생기기 쉬운 모직·합성섬유 옷과 담요를 피하고 면 제품을 사용한다.","전기기구는 접지된 것을 쓰고, 스파크가 날 수 있는 기구는 멀리한다.","기름·바셀린 같은 석유계 제품이나 알코올을 코 주위에 바르지 않는다. 코가 마르면 수용성 윤활제를 쓴다.","산소통(실린더)은 넘어지지 않게 고정하고, 열원에서 떨어뜨려 보관한다.","소화기 위치를 알아 둔다."]},{"h":"COPD 환자 주의","text":"만성적으로 이산화탄소가 높은 COPD 환자는 호흡 자극이 이산화탄소보다 낮은 산소 농도(저산소 자극)에 더 의존할 수 있다. 고농도 산소를 주면 환기가 줄어 이산화탄소가 더 쌓이고(이산화탄소 혼수), 의식이 떨어질 수 있다. 따라서 처방에 따라 저유량(예: 비강 캐뉼라 1~2 L/분) 또는 벤추리 마스크로 정확한 저농도를 주고, 목표 SpO2는 보통 88~92%로 한다. 산소를 주는 동안 의식 상태, 호흡수, 동맥혈가스(PaCO2)를 관찰한다. 단, 심한 저산소증이 있으면 산소를 끊지 않는다."},{"h":"산소 독성과 그 밖의 합병증","items":["산소 독성: 고농도(대개 FiO2 50% 이상)를 오래(24~48시간 이상) 주면 폐 조직이 손상된다.","증상: 흉골 뒤 불편감·통증, 마른기침, 호흡곤란, 손발 저림(이상감각), 피로, 오심 등.","흡수성 무기폐: 고농도 산소가 폐포의 질소를 밀어내면 산소가 흡수된 뒤 폐포가 쭈그러질 수 있다.","미숙아 망막병증: 미숙아에게 고농도 산소를 주면 망막 혈관이 손상될 수 있어 SpO2를 엄격하게 관찰한다.","예방: 가능한 가장 낮은 농도를 가장 짧게 사용하고, SpO2와 동맥혈가스로 자주 평가해 처방에 따라 줄인다."]}],"steps":[],"cautions":["산소 유량은 처방 없이 임의로 올리거나 내리지 않는다.","단순 마스크는 5 L/분 미만으로 쓰지 않는다 (이산화탄소 재호흡).","비재호흡 마스크의 저장주머니가 완전히 쭈그러지면 산소 공급이 부족한 것이므로 유량을 확인한다.","캐뉼라·마스크 끈이 닿는 귀 뒤, 콧등, 뺨에 압박 손상이 생기지 않는지 확인하고 패드를 댄다.","산소 공급을 끊을 때도 처방을 확인하고, 끊은 뒤 SpO2와 호흡 상태를 관찰한다."],"nursing":["투여 전후 호흡수, 호흡 양상, SpO2, 의식 상태, 피부색을 사정하고 필요하면 동맥혈가스 결과를 확인한다.","반좌위(파울러 체위)를 취해 폐 확장을 돕는다.","기구가 잘 맞는지, 튜브가 꺾이거나 눌리지 않았는지, 유량계 눈금이 처방과 같은지 자주 확인한다.","구강 간호를 자주 하고 수분 섭취를 격려해 점막 건조를 줄인다.","대상자와 가족에게 화기 금지와 유량을 임의로 바꾸지 않도록 교육한다.","기침·심호흡을 격려하고 분비물을 배출하도록 돕는다."],"videos":[{"label":"산소요법 기구 비교","query":"산소요법 비강캐뉼라 벤추리마스크 비재호흡마스크"},{"label":"비강 캐뉼라 적용 술기","query":"비강 캐뉼라 산소 투여 간호술기"},{"label":"COPD 산소 투여 주의","query":"COPD 환자 산소 투여 주의 간호"}],"quiz":[{"q":"만성폐쇄성폐질환(COPD) 환자에게 정확한 저농도 산소를 공급하기에 가장 적합한 기구는?","options":["비재호흡 마스크","단순 안면 마스크","부분재호흡 마스크","벤추리 마스크","산소 텐트"],"answer":3,"explain":"벤추리 마스크는 어댑터에 따라 정해진 FiO2를 정확하게 주는 고유량 기구여서 COPD 환자에게 적합하다. 비재호흡·부분재호흡 마스크는 고농도용이고, 단순 마스크는 농도를 정확히 조절하기 어렵다."},{"q":"단순 안면 마스크로 산소를 투여할 때 유량을 최소 5 L/분 이상으로 유지하는 이유는?","options":["코 점막 건조를 막기 위해","마스크 안에 쌓인 이산화탄소의 재호흡을 막기 위해","산소 독성을 예방하기 위해","가습을 하지 않아도 되도록 하기 위해","저장주머니를 채우기 위해"],"answer":1,"explain":"단순 마스크는 유량이 5 L/분보다 낮으면 내쉰 이산화탄소가 마스크 안에 남아 다시 흡입된다. 단순 마스크에는 저장주머니가 없다."},{"q":"비강 캐뉼라로 산소 2 L/분을 투여할 때 예상되는 FiO2로 가장 가까운 것은?","options":["약 21%","약 28%","약 40%","약 60%","약 90%"],"answer":1,"explain":"실내공기 약 21%(약 20%)에 1 L/분당 약 4%씩 더해지므로 1 L/분 약 24%, 2 L/분 약 28%, 6 L/분 약 44%이다."},{"q":"산소를 투여 중인 대상자의 병실 안전 관리로 옳은 것은?","options":["코가 건조하면 바셀린을 바른다","보온을 위해 모직 담요를 덮어 준다","산소통은 침대 옆에 세워 두기만 한다","면 소재의 환의와 침구를 사용한다","보호자의 흡연은 창문을 열면 허용한다"],"answer":3,"explain":"정전기를 줄이기 위해 면 소재를 쓴다. 석유계 제품(바셀린)은 불이 붙기 쉬워 수용성 윤활제를 쓰고, 모직은 정전기를 만든다. 산소통은 넘어지지 않게 고정하며, 흡연은 어떤 경우에도 금지한다."},{"q":"COPD 환자가 고농도 산소를 투여받은 뒤 졸려하고 의식이 흐려지며 호흡수가 줄었다. 가장 먼저 의심해야 할 것은?","options":["산소 독성으로 인한 폐섬유화","흡수성 무기폐","이산화탄소 저류(이산화탄소 혼수)","저혈당","미숙아 망막병증"],"answer":2,"explain":"COPD 환자는 저산소 자극에 의존할 수 있어 고농도 산소 시 환기가 줄고 PaCO2가 올라 의식이 떨어진다. 즉시 보고하고 처방에 따라 산소 농도를 조절하며 동맥혈가스를 확인한다."},{"q":"비재호흡 마스크를 적용한 대상자를 관찰할 때 옳은 것은?","options":["유량을 2~4 L/분으로 유지한다","흡기 시 저장주머니가 완전히 쭈그러지는 것이 정상이다","착용 전에 저장주머니를 산소로 채운다","장기간 사용하기에 가장 안전한 기구이다","FiO2 24~28%의 저농도 산소 공급 기구이다"],"answer":2,"explain":"비재호흡 마스크는 10~15 L/분으로 고농도를 주며, 착용 전 저장주머니를 채우고 흡기 때도 완전히 쭈그러지지 않게 유량을 맞춘다. 고농도이므로 장기간 사용하면 산소 독성 위험이 있다."}]},{"id":"vital-signs","subject":"기본간호학","kind":"술기","title":"활력징후 측정","en":"Vital signs measurement","tags":["활력징후","체온","맥박","호흡","혈압","산소포화도"],"summary":"활력징후는 체온·맥박·호흡·혈압(그리고 흔히 산소포화도)으로, 대상자 상태 변화를 가장 빨리 알려 주는 기본 사정 자료이다. 측정 부위·방법·기구에 따라 정상 범위와 오차가 달라지므로, 같은 조건에서 정확하게 측정하고 기저치와 비교하는 것이 중요하다.","numbers":[{"label":"체온 (성인, 구강)","value":"약 36.5~37.5℃ (평균 약 37℃)"},{"label":"부위별 체온 차이","value":"직장 ≥ 고막·구강 > 액와 (직장은 구강보다 약 0.5℃ 높고, 액와는 약 0.5℃ 낮음)"},{"label":"맥박 (성인)","value":"60~100회/분 (<60 서맥, >100 빈맥)"},{"label":"호흡 (성인)","value":"12~20회/분"},{"label":"혈압 (성인 정상)","value":"수축기 <120 mmHg 그리고 이완기 <80 mmHg"},{"label":"맥압","value":"수축기압 − 이완기압, 보통 약 30~50 mmHg (평균 약 40)"},{"label":"산소포화도 (SpO2)","value":"95~100%"},{"label":"혈압 커프 크기","value":"공기주머니 폭 = 상완 둘레의 약 40%, 길이 = 상완 둘레의 약 80%"},{"label":"혈압 커프 감압 속도","value":"초당 2~3 mmHg"}],"sections":[{"h":"체온 — 부위별 특성","items":["구강: 혀 밑 설하 포켓에 넣는다. 찬·뜨거운 음식, 흡연, 껌 후에는 15~30분 기다린 뒤 측정한다. 의식 저하, 경련 위험, 구강 수술, 입으로 숨 쉬는 대상자, 영아에게는 쓰지 않는다.","직장: 심부체온에 가깝고 가장 높게 나온다. 직장 수술·설사·직장 질환, 심질환자(미주신경 자극으로 서맥 위험)에게는 피한다. 윤활제를 바르고 성인은 약 3~4 cm 삽입하며 심스 체위를 취한다.","액와: 가장 안전하지만 가장 낮게 나오고 정확도가 떨어진다. 겨드랑이 땀을 닦고 팔을 몸에 붙여 측정한다.","고막: 빠르고 심부체온(시상하부)에 가깝다. 성인은 귓바퀴를 후상방으로, 3세 미만은 후하방으로 당겨 외이도를 곧게 편다. 귀지가 많거나 중이염이 있으면 부정확할 수 있다.","측두동맥(이마): 비침습적이며 빠르다. 땀이 많으면 낮게 나올 수 있다."]},{"h":"체온에 영향을 주는 요인","items":["일주기 리듬: 이른 아침(새벽)이 가장 낮고 늦은 오후~저녁이 가장 높다.","운동, 스트레스, 배란 후(프로게스테론), 고온 환경은 체온을 올린다.","노인은 체온이 다소 낮고 감염이 있어도 열이 덜 날 수 있다."]},{"h":"맥박 — 부위와 측정","items":["요골맥박: 성인에게 가장 흔히 쓰는 부위. 검지·중지(또는 3손가락)로 촉진하고 엄지는 쓰지 않는다(검사자 자신의 맥이 느껴짐).","규칙적이면 30초 측정 × 2, 불규칙하면 1분 동안 측정한다.","심첨맥박: 좌측 제5늑간과 쇄골중앙선이 만나는 곳에서 청진기로 1분 동안 센다. 디곡신 투여 전, 영아, 불규칙한 맥박일 때 사용한다.","맥박결손(pulse deficit): 심첨맥박 − 요골맥박. 두 사람이 동시에 1분간 측정한다.","그 밖의 부위: 측두, 경동맥(심정지 시·응급), 상완(영아 심폐소생술·혈압 측정), 대퇴, 슬와, 후경골, 족배.","경동맥은 양쪽을 동시에 누르지 않는다(뇌혈류 감소, 미주신경 자극)."]},{"h":"호흡","items":["대상자가 의식하면 호흡이 바뀌므로, 맥박을 재는 것처럼 손을 그대로 둔 채 이어서 측정한다.","흡기와 호기를 합쳐 1회로 센다. 규칙적이면 30초 × 2, 불규칙하면 1분 측정한다.","횟수뿐 아니라 깊이, 리듬, 호흡음, 보조근 사용, 피부색을 함께 사정한다.","용어: 빈호흡(빠름), 서호흡(느림), 무호흡, 체인-스톡스 호흡(점점 깊어졌다 얕아지며 무호흡 반복), 쿠스마울 호흡(깊고 빠름, 대사성 산증)."]},{"h":"혈압 — 측정 오차 원인","items":["커프가 너무 좁다 → 실제보다 높게 측정된다.","커프가 너무 넓다 → 실제보다 낮게 측정된다.","커프를 느슨하게 감았다 → 높게 측정된다.","팔이 심장보다 낮다 → 높게, 팔이 심장보다 높다 → 낮게 측정된다.","감압을 너무 빨리 한다 → 수축기압은 낮게, 이완기압은 높게 읽힐 수 있다.","감압을 너무 천천히 하거나, 다시 잴 때 충분히 기다리지 않았다 → 정맥 울혈로 이완기압이 높게 측정될 수 있다.","측정 직전 운동, 흡연, 카페인, 통증, 불안, 방광 팽만, 대화, 다리 꼬기 → 높게 측정될 수 있다.","청진기를 너무 세게 누름, 청진 간극(auscultatory gap)을 놓침 → 수축기압을 낮게 읽을 수 있다. 촉진법으로 먼저 수축기압을 추정하면 예방된다.","눈높이가 수은주 눈금과 맞지 않으면 읽는 값이 틀린다(눈높이를 눈금 높이에 맞춘다)."]},{"h":"혈압 측정 금기 부위","items":["정맥주사가 들어가 있는 팔, 투석용 동정맥루(AV fistula)가 있는 팔","유방절제술(특히 액와 림프절 절제)을 한 쪽 팔","외상, 화상, 깁스를 한 팔"]},{"h":"산소포화도 (맥박산소측정)","items":["손가락·귓불 등에 센서를 대고 측정하며, 화면의 맥박수가 실제 맥박과 맞는지 확인한다.","부정확하게 하는 요인: 매니큐어·인조손톱, 말초 순환 저하(저체온, 쇼크, 혈관수축제), 움직임, 강한 외부 빛, 심한 빈혈.","일산화탄소 중독에서는 실제보다 높게(정상처럼) 나올 수 있으므로 SpO2만 믿지 않는다.","장시간 측정할 때는 압박 손상을 막기 위해 센서 위치를 기관 지침에 따라 바꾼다."]}],"steps":[{"do":"의사 처방·기록을 확인하고 손위생을 한 뒤 대상자를 확인한다","why":"정확한 대상자 확인과 교차 감염 예방","key":true},{"do":"대상자에게 목적과 방법을 설명하고, 측정 전 약 5분 이상 편안히 쉬게 한다 (30분 이내 흡연·카페인·운동 여부 확인)","why":"활동·자극에 의해 혈압이 높게 측정되는 것을 막는다","key":true},{"do":"앉거나 누운 자세에서 팔을 심장 높이에 두고 손바닥을 위로 향하게 지지한다. 다리는 꼬지 않는다","why":"팔이 심장보다 낮으면 높게, 높으면 낮게 측정된다","key":true},{"do":"상완 둘레에 맞는 커프를 고른다 (공기주머니 폭 약 40%, 길이 약 80%)","why":"좁으면 높게, 넓으면 낮게 측정된다","key":true},{"do":"옷을 걷고 커프 아래 끝이 주와(팔꿈치 안쪽)보다 약 2~3 cm 위에 오도록, 공기주머니 중앙이 상완동맥 위에 오게 감는다. 손가락 1~2개가 들어갈 정도로 감는다","why":"느슨하면 높게 측정되고, 위치가 틀리면 소리가 잘 안 들린다","key":false},{"do":"상완동맥(또는 요골동맥)을 촉지하면서 커프를 부풀려 맥박이 사라지는 압력을 확인하고(촉진법), 공기를 모두 뺀 뒤 잠시 기다린다","why":"수축기압을 추정해 청진 간극으로 인한 오류를 예방한다","key":true},{"do":"주와의 상완동맥 위에 청진기 판막(막형)을 가볍게 대고, 추정 수축기압보다 약 30 mmHg 높게 부풀린다","why":"충분히 부풀려야 수축기압을 놓치지 않는다. 세게 누르면 소리가 왜곡된다","key":false},{"do":"초당 2~3 mmHg 속도로 천천히 감압한다","why":"너무 빠르면 수축기 낮게·이완기 높게, 너무 느리면 정맥 울혈로 부정확해진다","key":true},{"do":"처음 들리는 맑은 소리(코로트코프 1음)를 수축기압, 소리가 사라지는 지점(5음)을 이완기압으로 읽는다","why":"성인 혈압 판독의 기준이다","key":true},{"do":"소리가 사라진 뒤 약 10~20 mmHg 더 들어 보고 공기를 완전히 뺀다. 다시 잴 때는 1~2분 이상 기다린다","why":"정확한 이완기압 확인과 정맥 울혈 예방","key":false},{"do":"커프를 풀고 대상자를 편안하게 한 뒤 손위생을 하고, 측정값·부위·자세를 기록하고 이전 값과 비교해 이상 시 보고한다","why":"변화 추이를 알 수 있고 같은 조건으로 재측정할 수 있다","key":true}],"cautions":["처음 측정할 때는 양팔을 모두 재고, 이후에는 높게 나온 팔로 측정하는 것이 일반적이다 (구체적 기준은 기관 지침에 따라).","기립성 저혈압이 의심되면 누운 자세 → 앉은 자세 → 선 자세 순서로 측정해 비교한다.","측정값이 평소와 크게 다르면 기구·방법을 확인하고 다시 측정한 뒤 보고한다.","자동 혈압계는 부정맥이 있거나 혈압이 매우 낮을 때 부정확할 수 있어 수동 측정으로 확인한다.","체온계·청진기는 사용 전후 소독해 교차 감염을 막는다."],"nursing":["같은 시간, 같은 부위, 같은 자세, 같은 기구로 측정해 추이를 비교한다.","측정값과 함께 대상자의 증상(어지러움, 호흡곤란, 오한 등)을 함께 사정하고 기록한다.","정상 범위를 벗어나거나 갑자기 변하면 즉시 재확인하고 보고한다."],"videos":[{"label":"활력징후 측정 술기","query":"활력징후 측정 간호술기"},{"label":"혈압 측정 방법","query":"혈압 측정 간호술기 핵심기본간호술"},{"label":"맥박·호흡 측정","query":"요골맥박 호흡 측정 간호학생"},{"label":"고막 체온 측정","query":"고막 체온계 측정 방법 간호"}],"quiz":[{"q":"성인 대상자의 혈압을 측정할 때 실제 혈압보다 높게 측정되는 경우는?","options":["상완 둘레보다 넓은 커프를 사용하였다","팔을 심장보다 높게 올려 두었다","상완 둘레보다 좁은 커프를 사용하였다","커프를 꼭 맞게 감았다","측정 전 10분간 휴식하게 하였다"],"answer":2,"explain":"좁은 커프는 동맥을 누르는 데 더 높은 압력이 필요해 혈압이 높게 측정된다. 넓은 커프와 팔을 심장보다 높게 둔 경우는 낮게 측정된다. 꼭 맞는 커프와 충분한 휴식은 올바른 방법이다."},{"q":"성인의 고막 체온을 측정할 때 외이도를 곧게 펴기 위해 귓바퀴를 당기는 방향은?","options":["전하방","후상방","후하방","전상방","당기지 않는다"],"answer":1,"explain":"성인은 귓바퀴를 후상방으로 당긴다. 3세 미만 영아는 외이도 모양이 달라 후하방으로 당긴다."},{"q":"다음 중 심첨맥박을 측정하는 위치로 옳은 것은?","options":["우측 제2늑간 흉골연","좌측 제2늑간 흉골연","흉골 하단 검상돌기 위","좌측 제5늑간과 쇄골중앙선이 만나는 곳","좌측 제5늑간과 후액와선이 만나는 곳"],"answer":3,"explain":"심첨부(PMI)는 좌측 제5늑간과 쇄골중앙선이 만나는 곳이며, 청진기로 1분 동안 측정한다. 제2늑간 흉골연은 대동맥판·폐동맥판 청진 부위이다."},{"q":"구강 체온 측정 시 간호사의 행동으로 옳은 것은?","options":["뜨거운 차를 마신 직후 바로 측정한다","의식이 저하된 대상자에게 구강 체온을 측정한다","흡연 후 15~30분이 지난 뒤 측정한다","체온계를 혀 위에 올려놓는다","입으로 숨을 쉬는 대상자에게 우선 사용한다"],"answer":2,"explain":"흡연이나 찬·뜨거운 음식 섭취 후에는 15~30분 기다려야 정확하다. 체온계는 혀 밑 설하 포켓에 넣고, 의식 저하·입호흡 대상자에게는 구강 측정을 피한다."},{"q":"혈압 측정 시 커프를 감압하는 속도로 가장 적절한 것은?","options":["초당 2~3 mmHg","초당 5~6 mmHg","초당 8~10 mmHg","초당 10~15 mmHg","한 번에 빠르게 모두 뺀다"],"answer":0,"explain":"초당 2~3 mmHg로 천천히 감압해야 코로트코프음을 정확히 들을 수 있다. 너무 빠르면 수축기압은 낮게, 이완기압은 높게 읽힐 수 있다."},{"q":"맥박산소측정기로 측정한 SpO2가 실제보다 높게(정상처럼) 나올 수 있어 특히 주의해야 하는 상황은?","options":["매니큐어를 바른 경우","일산화탄소 중독","손이 차가운 경우","대상자가 계속 움직이는 경우","센서를 귓불에 붙인 경우"],"answer":1,"explain":"일산화탄소는 헤모글로빈과 결합해도 측정기가 산소헤모글로빈과 구분하지 못해 SpO2가 정상처럼 높게 나올 수 있다. 매니큐어·말초 냉감·움직임은 측정을 부정확하게(대개 낮게 또는 측정 불가) 만든다."},{"q":"다음 중 혈압 측정 부위로 적절한 팔은?","options":["정맥주사가 주입 중인 팔","투석용 동정맥루가 있는 팔","좌측 유방절제술과 액와 림프절 절제를 받은 쪽 팔","깁스를 한 팔","특별한 문제가 없는 반대쪽 팔"],"answer":4,"explain":"정맥주사 부위, 동정맥루, 유방절제술(림프절 절제) 쪽, 외상·깁스한 팔은 혈류 차단·부종·손상 위험 때문에 혈압 측정을 피한다."}]},{"id":"im-injection","subject":"기본간호술기","kind":"술기","title":"근육주사","en":"Intramuscular (IM) injection","tags":["투약","주사","투약 원칙","Z-track"],"summary":"근육주사는 혈관이 많은 근육층에 약물을 넣어 피하주사보다 빨리 흡수되게 하는 방법이다. 성인은 둔부 복면부(중둔근)가 큰 신경·혈관이 없어 가장 안전하고, 둔부 배면부는 좌골신경 손상 위험이 있어 권장하지 않는다. 투약 원칙(5 Right)을 지키고 90도로 찌르며, 자극성 약물은 Z-track으로 주사한다.","numbers":[{"label":"주사 각도","value":"90도"},{"label":"바늘 굵기·길이 (성인, 일반적)","value":"21~23 G, 2.5~3.8 cm (체격·부위에 따라, 기관 지침에 따라)"},{"label":"삼각근 위치","value":"견봉 아래 약 2.5~5 cm (손가락 2~3개 너비)"},{"label":"삼각근 주사량","value":"1 mL 이하 (교재에 따라 0.5~1 mL)"},{"label":"큰 근육(복면부·외측광근) 성인 주사량","value":"약 3 mL 이하 (교재·기관 지침에 따라)"},{"label":"Z-track 피부 당기는 거리","value":"약 2.5~3.5 cm"},{"label":"주입 후 기다리는 시간 (Z-track)","value":"약 10초"},{"label":"주입 속도","value":"천천히, 약 1 mL당 10초"}],"sections":[{"h":"투약 원칙 (5 Right)","items":["정확한 대상자 (Right patient): 두 가지 이상의 방법(이름, 등록번호 등)으로 확인","정확한 약물 (Right drug): 처방과 약 이름 대조","정확한 용량 (Right dose): 처방 용량과 계산 확인","정확한 경로 (Right route): 처방된 투여 경로(IM) 확인","정확한 시간 (Right time): 처방된 투여 시간 확인","이 밖에 정확한 기록, 대상자의 거부할 권리, 정확한 교육 등을 더해 원칙을 확장하기도 한다","약을 꺼낼 때, 준비할 때, 대상자에게 주기 전 세 번 확인한다 (3회 확인)"]},{"h":"주사 부위","items":["둔부 복면부(중둔근, ventrogluteal): 성인·소아 모두에게 가장 안전한 부위로 권장된다. 큰 신경·혈관이 없고 피하지방이 비교적 얇다. 손바닥을 대전자에, 검지를 전상장골극에 두고 중지를 장골능 쪽으로 벌려 생긴 V자 가운데에 주사한다 (오른쪽 둔부는 왼손, 왼쪽 둔부는 오른손 사용)","둔부 배면부(대둔근, dorsogluteal): 좌골신경과 큰 혈관이 가까워 손상 위험이 있어 현재는 권장하지 않는다. 쓴다면 상외측 1/4 부위를 정확히 찾아야 한다","삼각근(deltoid): 접근이 쉽고 백신에 많이 쓰이지만 근육이 작아 적은 양만 주사한다. 견봉 아래 약 2.5~5 cm, 겨드랑이 위쪽에 주사하며 요골신경·상완동맥 손상을 피한다","외측광근(vastus lateralis): 대퇴 앞바깥쪽 가운데 1/3 부위. 영아에게 권장되는 부위이며 성인에게도 쓸 수 있다","대퇴직근(rectus femoris): 대퇴 앞쪽 가운데 1/3. 스스로 주사하기 쉬우나 불편감이 클 수 있다"]},{"h":"Z-track 기법","items":["목적: 약물이 피하조직으로 새어 나와 생기는 자극·착색을 막는다 (철분제 등 자극성 약물에 사용, 최근에는 모든 근육주사에 권장하기도 함)","비우세손으로 주사 부위의 피부와 피하조직을 한쪽으로 약 2.5~3.5 cm 당긴다","당긴 상태로 90도로 찔러 천천히 주입한다","주입 후 약 10초 기다렸다가 바늘을 같은 각도로 빼고 당긴 피부를 놓는다","피부가 제자리로 돌아오며 바늘길이 지그재그로 막혀 약이 새지 않는다","주사 부위를 문지르지 않는다"]},{"h":"흡인(aspiration) 여부","text":"전통적인 교과서는 주사 후 5~10초 동안 내관을 당겨 혈액이 나오는지 확인하고, 혈액이 보이면 약을 버리고 새로 준비하도록 가르친다. 한편 미국 CDC 등 최신 예방접종 지침은 백신 근육주사에서 흡인이 필요하지 않다고 하며, 복면부·삼각근·외측광근처럼 큰 혈관이 없는 부위에서는 흡인을 생략하기도 한다. 교재와 기관 지침에 따라 다르므로 실습·시험에서는 사용 교재의 평가항목을 따른다."}],"steps":[{"do":"의사 처방과 투약 기록을 확인하고 약물의 작용·부작용·용량을 확인한다","why":"투약 오류를 막고 투약 후 관찰할 내용을 미리 안다","key":true},{"do":"손위생을 한다","why":"교차 감염 예방","key":true},{"do":"약을 꺼낼 때, 준비할 때 처방과 약 이름·용량·경로·시간을 확인한다","why":"투약 원칙과 3회 확인으로 투약 오류를 막는다","key":true},{"do":"앰플(목 부분 소독 후 거즈로 감싸 몸 반대쪽으로 꺾기, 필터 바늘 사용 권장) 또는 바이알(고무마개 소독 후 뽑을 양만큼 공기 주입)에서 정확한 용량을 뽑는다","why":"앰플 유리 조각 흡인과 손 손상을 막고, 바이알 내 음압을 막아 정확히 뽑는다","key":false},{"do":"공기를 빼고 주사 바늘을 근육주사용 새 바늘로 바꾼다 (기관 지침에 따라)","why":"약물이 묻은 바늘이 피하조직을 자극하는 것을 줄이고 무딘 바늘 사용을 피한다","key":false},{"do":"대상자를 두 가지 이상의 방법으로 확인하고 알레르기 여부를 묻는다 (투약 전 세 번째 확인)","why":"정확한 대상자 확인과 과민반응 예방","key":true},{"do":"목적과 절차를 설명하고 사생활을 보호한다","why":"불안을 줄이고 협조를 얻는다","key":false},{"do":"부위에 맞는 자세를 취하고, 해부학적 지표로 주사 부위를 정확히 찾는다 (복면부: 대전자·전상장골극·장골능)","why":"근육을 이완시켜 통증을 줄이고, 신경·혈관 손상을 피한다","key":true},{"do":"일회용 장갑을 낀다","why":"혈액 노출로부터 간호사를 보호한다","key":false},{"do":"알코올 솜으로 주사 부위 중심에서 바깥쪽으로 원을 그리며 약 5 cm 닦고 마를 때까지 기다린다","why":"피부 미생물을 줄이고, 알코올이 마르지 않으면 통증과 자극이 생긴다","key":true},{"do":"비우세손으로 피부를 팽팽하게 하거나 Z-track이면 피부를 한쪽으로 약 2.5~3.5 cm 당긴다","why":"바늘이 쉽게 들어가고, Z-track은 약물이 새는 것을 막는다","key":false},{"do":"우세손으로 주사기를 다트처럼 잡고 90도 각도로 빠르게 찌른다","why":"근육층까지 정확히 도달하고 통증을 줄인다","key":true},{"do":"흡인 여부는 교재·기관 지침에 따른다 (흡인할 경우 혈액이 나오면 바늘을 빼고 약을 새로 준비한다)","why":"혈관 내 주입을 피하기 위한 전통적 방법이나, 최신 지침은 백신 등에서 흡인을 권장하지 않는다","key":false},{"do":"약을 천천히(약 1 mL당 10초) 주입한다","why":"근육 조직이 약을 받아들일 시간을 주어 통증과 조직 손상을 줄인다","key":false},{"do":"Z-track이면 약 10초 기다린 후 찌른 각도 그대로 바늘을 빼고 피부를 놓는다","why":"약물이 근육에 퍼지게 하고 바늘길로 새는 것을 막는다","key":false},{"do":"마른 솜으로 가볍게 누른다 (문지르지 않는다)","why":"출혈을 멈추게 하며, 문지르면 약이 피하로 새어 자극될 수 있다","key":false},{"do":"바늘 뚜껑을 다시 씌우지 않고 손상성 폐기물 용기에 바로 버린다","why":"바늘 찔림 사고 예방","key":true},{"do":"장갑을 벗고 손위생을 하며, 대상자를 편안하게 해 준다","why":"감염 전파 방지와 안위","key":false},{"do":"약물명·용량·경로·부위·시간과 대상자 반응을 기록하고, 약효와 부작용을 관찰한다","why":"법적 기록이며 중복 투약을 막고 이상 반응을 빨리 발견한다","key":true}],"cautions":["둔부 배면부는 좌골신경 손상 위험 때문에 피하고, 성인은 복면부를 우선 고려한다","삼각근은 근육이 작아 적은 양(1 mL 이하)만 주사한다","멍·염증·상처·부종·딱딱한 곳에는 주사하지 않는다","반복 주사할 때는 부위를 돌아가며 바꾼다","사용한 바늘은 뚜껑을 다시 씌우지 않는다 (재캡 금지)","아나필락시스 가능성이 있는 약은 주사 후 대상자를 관찰한다 (예방접종 후 관찰 시간은 기관 지침에 따라)","흡인 여부, 최대 주사량, 바늘 교체 여부는 교재와 기관 지침이 서로 다를 수 있다"],"nursing":["주사 후 부위의 통증·발적·부종·경결을 관찰한다","약물 작용과 부작용, 알레르기 반응(두드러기, 호흡곤란 등)을 관찰한다","반복 주사 시 부위 순환 계획을 세우고 기록한다"],"videos":[{"label":"핵심기본간호술 근육주사","query":"핵심기본간호술 근육주사"},{"label":"둔부 복면부 주사 부위 찾기","query":"둔부 복면부 근육주사 부위"},{"label":"Z-track 근육주사","query":"Z-track 근육주사 방법"}],"quiz":[{"q":"성인에게 근육주사할 때 큰 신경과 혈관이 없어 가장 안전한 부위로 권장되는 곳은?","options":["둔부 배면부","삼각근","대퇴직근","전완 내측","둔부 복면부"],"answer":4,"explain":"둔부 복면부(중둔근)는 큰 신경·혈관이 없고 피하지방이 얇아 가장 안전한 부위로 권장된다. 둔부 배면부는 좌골신경 손상 위험이 있고, 삼각근은 근육이 작아 적은 양만 가능하다. 전완 내측은 피내주사 부위이다."},{"q":"둔부 복면부 근육주사 부위를 찾는 방법으로 옳은 것은?","options":["손바닥을 대전자에, 검지를 전상장골극에 두고 중지를 벌려 생긴 V자 가운데","둔부를 4등분하여 하외측 1/4","견봉 아래 손가락 2~3개 너비","대퇴 앞바깥쪽 가운데 1/3","후상장골극과 대전자를 이은 선의 아래쪽"],"answer":0,"explain":"복면부는 손바닥을 대전자에, 검지를 전상장골극에 대고 중지를 장골능 쪽으로 벌려 생긴 V자 가운데에 주사한다. 견봉 아래는 삼각근, 대퇴 앞바깥쪽 가운데 1/3은 외측광근이다. 둔부 배면부도 상외측을 쓰며, 하외측이나 선 아래쪽은 좌골신경에 가까워 위험하다."},{"q":"철분제를 Z-track 기법으로 근육주사하는 주된 이유는?","options":["약물 흡수 속도를 늦추기 위해","주사 바늘을 쉽게 넣기 위해","약물이 피하조직으로 새어 나와 생기는 자극과 착색을 막기 위해","혈관 내 주입을 확인하기 위해","주사량을 늘리기 위해"],"answer":2,"explain":"Z-track은 피부를 한쪽으로 당긴 채 주사하고 바늘을 뺀 뒤 피부를 놓아 바늘길을 지그재그로 막는다. 그래서 약물이 피하조직으로 새어 나와 생기는 자극과 피부 착색을 막는다. 주사 후 문지르지 않는다."},{"q":"근육주사 수행 방법으로 옳지 않은 것은?","options":["주사 부위를 알코올 솜으로 닦은 후 마를 때까지 기다린다","90도 각도로 빠르게 찌른다","약물은 천천히 주입한다","주사 후 약물이 잘 퍼지도록 부위를 세게 문지른다","사용한 바늘은 뚜껑을 씌우지 않고 손상성 폐기물 용기에 버린다"],"answer":3,"explain":"근육주사(특히 Z-track) 후에는 문지르지 않고 마른 솜으로 가볍게 누른다. 문지르면 약물이 피하조직으로 새어 자극될 수 있다. 나머지는 모두 옳은 방법이다."},{"q":"성인 삼각근 근육주사에 대한 설명으로 옳은 것은?","options":["5 mL까지 주사할 수 있다","견봉 아래 약 2.5~5 cm 부위에 주사한다","45도 각도로 주사한다","영아에게 가장 권장되는 부위이다","좌골신경 손상 위험이 있다"],"answer":1,"explain":"삼각근은 견봉 아래 약 2.5~5 cm(손가락 2~3개 너비)에 90도로 주사한다. 근육이 작아 1 mL 이하의 적은 양만 주사한다. 영아에게 권장되는 부위는 외측광근이며, 좌골신경 손상 위험은 둔부 배면부의 문제이다."},{"q":"간호사가 투약 직전 대상자에게 이름과 생년월일을 말하게 하고 팔찌의 등록번호를 확인하였다. 이것은 투약 원칙 중 무엇에 해당하는가?","options":["정확한 약물","정확한 용량","정확한 경로","정확한 시간","정확한 대상자"],"answer":4,"explain":"두 가지 이상의 방법(이름, 생년월일, 등록번호 등)으로 대상자를 확인하는 것은 '정확한 대상자' 원칙이다. 병실 호수나 침대 번호는 대상자 확인 방법으로 쓰지 않는다."}]},{"id":"suction","subject":"기본간호술기","kind":"술기","title":"기관내 흡인 (개방형)","en":"Endotracheal suctioning (open system)","tags":["호흡","기도 유지","무균술","산소화"],"summary":"기관내 흡인은 기관내관이나 기관절개관으로 스스로 뱉지 못하는 분비물을 멸균 카테터로 빨아내 기도를 깨끗하게 하는 술기이다. 하기도는 무균 부위이므로 무균술을 지키고, 흡인 전후 산소를 충분히 공급한다. 카테터를 넣을 때는 음압을 걸지 않고, 빼면서 돌려 가며 한 번에 10~15초 이내로 흡인한다.","numbers":[{"label":"1회 흡인 시간","value":"10~15초 이내"},{"label":"흡인 압력 (성인, 벽걸이 흡인기)","value":"교재에서 흔히 100~150 mmHg 범위 (기관 지침에 따라)"},{"label":"사전·사후 산소화","value":"100% 산소를 흡인 전후 약 30~60초 이상 (기관 지침에 따라)"},{"label":"카테터 굵기","value":"기관내관 내경의 1/2 이하 (기관 지침에 따라)"},{"label":"반복 흡인","value":"흡인 사이에 산소를 공급하며 쉬고, 한 번에 반복 횟수를 제한한다 (흔히 2~3회 이내, 기관 지침에 따라)"}],"sections":[{"h":"적응 (흡인이 필요한 징후)","items":["가래 끓는 소리가 들리거나 관 안에 분비물이 보일 때","청진 시 기관·기관지 부위의 거친 수포음(나음)","산소포화도 저하 또는 동맥혈 가스 악화","호흡수 증가, 호흡곤란, 불안·안절부절못함","인공호흡기에서 최고 기도압 상승, 일회호흡량 감소, 파형의 톱니 모양","스스로 효과적으로 기침해 분비물을 뱉지 못할 때","정해진 시간마다 하지 않고, 사정 결과 필요할 때 시행한다"]},{"h":"준비물","items":["흡인기(벽걸이 또는 이동식)와 연결관, 압력 조절기","멸균 흡인 카테터(기관내관 내경의 1/2 이하 굵기)","멸균 장갑, 멸균 생리식염수와 멸균 컵","산소 공급 장치, 수동 환기 백(앰부백)","보호구(마스크, 보안경 또는 안면보호구, 가운 등 기관 지침에 따라)","청진기, 맥박산소측정기"]},{"h":"합병증","items":["저산소증 (흡인 시 산소도 함께 빨려 나감)","서맥·부정맥 (미주신경 자극, 저산소증)","기관 점막 손상과 출혈","무기폐 (과도한 음압, 긴 흡인 시간, 굵은 카테터)","감염 (무균술 위반)","기관지 경련, 기침 발작","두개내압 상승, 혈압 변화","불안"]},{"h":"흡인 중 이상 반응 시 대처","items":["산소포화도 저하, 맥박의 큰 변화(서맥 등), 부정맥, 청색증이 나타나면 즉시 흡인을 멈춘다","카테터를 빼고 100% 산소를 공급하며 회복될 때까지 관찰한다","회복되지 않으면 즉시 보고한다"]}],"steps":[{"do":"흡인이 필요한지 사정한다 (호흡음, 산소포화도, 호흡 양상, 분비물)","why":"불필요한 흡인은 저산소증·점막 손상 등 합병증을 일으키므로 필요할 때만 한다","key":true},{"do":"손위생을 하고 대상자를 확인한 뒤 절차를 설명한다 (의식이 없어도 설명)","why":"감염 예방, 대상자 오인 방지, 불안 감소","key":true},{"do":"금기가 없으면 반좌위(파울러 또는 반파울러 체위)를 취해 준다","why":"폐가 잘 팽창되고 기침이 쉬워지며 흡인(aspiration)을 줄인다","key":false},{"do":"보호구를 착용한다 (기관 지침에 따라)","why":"분비물이 튀어 간호사가 노출되는 것을 막는다","key":false},{"do":"흡인기를 켜고 압력을 기관 지침(성인은 교재에서 흔히 100~150 mmHg)에 맞게 조절한다","why":"압력이 너무 높으면 점막 손상·무기폐, 너무 낮으면 분비물이 제거되지 않는다","key":true},{"do":"멸균 컵에 멸균 생리식염수를 붓고 멸균 카테터 포장을 연다","why":"무균 상태로 물품을 준비해 하기도 감염을 막는다","key":false},{"do":"멸균 장갑을 끼고, 우세손(멸균)으로 카테터를 잡고 비우세손(비멸균)으로 연결관을 잡아 연결한다","why":"카테터에 닿는 손은 끝까지 멸균을 유지한다","key":true},{"do":"생리식염수를 조금 빨아들여 흡인이 잘 되는지 확인한다","why":"흡인기 작동 확인과 카테터 내부 윤활","key":false},{"do":"흡인 전 100% 산소를 공급한다 (인공호흡기 산소 기능 또는 수동 환기 백, 기관 지침에 따라)","why":"흡인 중 생기는 저산소증과 서맥 등을 예방한다","key":true},{"do":"음압을 걸지 않은 상태(조절구멍을 열고)로 카테터를 기관내관에 부드럽게 넣는다. 저항이 느껴지면 약 1 cm 빼거나, 기관 지침에 따라 정해진 깊이까지만 넣는다","why":"넣는 동안 음압을 걸면 점막이 빨려 손상되고 산소가 불필요하게 빠져나간다. 기관분기부 자극을 피한다","key":true},{"do":"조절구멍을 막아 음압을 걸고, 카테터를 돌리면서 빼며 간헐적으로 흡인한다","why":"한 곳의 점막이 계속 빨리는 것을 막고 분비물을 고르게 제거한다","key":true},{"do":"한 번 흡인은 10~15초 이내로 끝낸다","why":"흡인 시간이 길면 저산소증, 서맥, 무기폐 위험이 커진다","key":true},{"do":"흡인 후 다시 100% 산소를 공급하고 산소포화도·심박수·호흡 상태를 관찰한다","why":"흡인으로 떨어진 산소를 보충하고 이상 반응을 빨리 발견한다","key":true},{"do":"생리식염수를 빨아들여 카테터와 연결관을 씻어 낸다","why":"카테터 안의 분비물을 제거해 다음 흡인이 잘 되게 한다","key":false},{"do":"더 필요하면 회복될 시간을 두고 반복하되 반복 횟수를 제한한다","why":"연속 흡인은 저산소증과 점막 손상을 키운다","key":false},{"do":"기관내 흡인을 마친 뒤 필요하면 같은 카테터로 구강·비강을 흡인한다 (반대 순서는 안 된다)","why":"구강·비강의 균이 무균 부위인 하기도로 들어가는 것을 막는다","key":true},{"do":"카테터를 장갑 안에 감아 넣으며 장갑을 벗어 버리고, 흡인기를 끈 뒤 손위생을 한다","why":"오염물 노출과 감염 전파 방지","key":false},{"do":"흡인 후 호흡음·산소포화도·활력징후를 다시 사정하여 효과를 평가한다","why":"분비물이 제거되었는지, 합병증이 없는지 확인한다","key":true},{"do":"흡인 시간, 분비물의 양·색·점도·냄새, 흡인 전후 상태, 대상자 반응을 기록한다","why":"호흡 상태 변화와 감염 징후를 추적하는 근거가 된다","key":true}],"cautions":["하기도는 무균 부위이므로 기관내 흡인은 무균술로 한다","카테터를 넣을 때는 음압을 걸지 않고, 뺄 때만 돌려 가며 흡인한다","1회 흡인은 10~15초 이내로 하고, 흡인 전후 산소를 공급한다","흡인 중 산소포화도 저하, 서맥·부정맥, 청색증이 생기면 즉시 멈추고 산소를 공급한다","흡인은 사정 결과 필요할 때 하며, 정해진 시간마다 일상적으로 하지 않는다","흡인 전 생리식염수를 기관 안에 넣는 것은 일상적으로 하지 않는다 (기관 지침에 따라)","같은 카테터로 구강을 먼저 흡인한 뒤 기관내로 넣지 않는다","두개내압 상승 위험이 있는 대상자는 흡인 시간을 짧게 하고 상태를 자주 관찰한다"],"nursing":["가습과 충분한 수분 공급(금기가 없을 때)으로 분비물을 묽게 한다","체위 변경, 심호흡·기침 격려로 분비물 배출을 돕는다","흡인 전후 호흡음과 산소포화도를 비교해 효과를 평가한다","분비물 색·냄새·양 변화로 감염 징후를 관찰한다"],"videos":[{"label":"핵심기본간호술 기관내 흡인","query":"핵심기본간호술 기관내 흡인"},{"label":"기관절개관 흡인","query":"기관절개관 흡인 간호술기"},{"label":"개방형 기관내 흡인 방법","query":"개방형 기관내 흡인 방법"}],"quiz":[{"q":"기관내관을 가진 대상자에게 개방형 기관내 흡인을 할 때 옳은 방법은?","options":["카테터를 넣을 때부터 음압을 걸어 분비물을 빨아들인다","한 번 흡인을 30초 이상 충분히 한다","구강을 먼저 흡인한 같은 카테터로 기관내를 흡인한다","카테터를 돌리면서 빼며 간헐적으로 흡인한다","흡인 후에는 산소를 공급하지 않는다"],"answer":3,"explain":"카테터는 음압 없이 넣고, 뺄 때 돌리면서 간헐적으로 흡인해 점막 손상을 줄인다. 한 번 흡인은 10~15초 이내, 기관내를 먼저 흡인하고 구강은 나중에 한다. 흡인 전후 모두 산소를 공급한다."},{"q":"기관내 흡인 전에 100% 산소를 공급하는 주된 이유는?","options":["흡인 중 생기는 저산소증을 예방하기 위해","분비물을 묽게 하기 위해","기침 반사를 억제하기 위해","카테터 삽입을 쉽게 하기 위해","감염을 예방하기 위해"],"answer":0,"explain":"흡인할 때 분비물과 함께 기도 안의 산소도 빠져나가 저산소증이 생기기 쉽다. 흡인 전후 100% 산소를 공급하면 저산소증과 그로 인한 서맥·부정맥을 예방할 수 있다."},{"q":"기관내 흡인 중 대상자의 심박수가 갑자기 50회/분으로 떨어지고 산소포화도가 85%로 감소하였다. 가장 우선적인 간호는?","options":["흡인 압력을 높여 빨리 끝낸다","생리식염수를 기관 안에 넣는다","흡인을 멈추고 카테터를 뺀 뒤 100% 산소를 공급한다","카테터를 더 깊이 넣는다","흡인을 마친 후 기록하고 보고한다"],"answer":2,"explain":"서맥과 산소포화도 저하는 미주신경 자극과 저산소증에 의한 흡인 합병증이다. 즉시 흡인을 멈추고 카테터를 빼고 100% 산소를 공급하며 관찰하고, 회복되지 않으면 보고한다."},{"q":"기관내 흡인의 합병증이 아닌 것은?","options":["저산소증","서맥","기관 점막 출혈","무기폐","고혈당"],"answer":4,"explain":"기관내 흡인의 합병증은 저산소증, 서맥·부정맥(미주신경 자극), 점막 손상·출혈, 무기폐, 감염, 기관지 경련, 두개내압 상승 등이다. 고혈당은 흡인과 직접 관련된 합병증이 아니다."},{"q":"기관내 흡인이 필요한 사정 자료로 가장 적절한 것은?","options":["흡인한 지 2시간이 지났다","청진 시 기관 부위에서 거친 수포음이 들리고 산소포화도가 떨어졌다","대상자가 잠을 잘 자고 있다","호흡음이 깨끗하고 산소포화도가 98%이다","식사 시간이 되었다"],"answer":1,"explain":"흡인은 정해진 시간마다 하지 않고, 거친 수포음, 보이는 분비물, 산소포화도 저하, 호흡곤란, 인공호흡기 최고 기도압 상승 등 사정 결과 필요할 때 한다. 불필요한 흡인은 합병증만 일으킨다."},{"q":"개방형 기관내 흡인의 무균술에 대한 설명으로 옳은 것은?","options":["기관내 흡인은 내과적 무균술로 충분하다","카테터는 비우세손으로 잡는다","멸균 장갑을 낀 우세손으로 카테터를 잡고, 비우세손으로 연결관을 잡는다","카테터는 여러 번 재사용한다","흡인 후 카테터를 생리식염수에 담가 보관한다"],"answer":2,"explain":"하기도는 무균 부위이므로 외과적 무균술로 한다. 멸균 장갑을 낀 우세손은 카테터만 잡아 멸균을 유지하고, 비우세손은 연결관 등 비멸균 물품을 다룬다. 개방형 흡인 카테터는 한 번 쓰고 버린다."}]},{"id":"foley","subject":"기본간호술기","kind":"술기","title":"유치도뇨 (단순도뇨와 구별)","en":"Indwelling urinary catheterization (Foley catheter)","tags":["배뇨","무균술","감염관리","CAUTI"],"summary":"유치도뇨는 풍선이 달린 도뇨관(Foley)을 방광에 넣어 두고 소변을 계속 배출시키는 침습적 술기이다. 처음부터 끝까지 무균술을 지키고, 여성과 남성은 삽입 길이·음경 각도·고정 위치가 다르다. 도뇨관 관련 요로감염(CAUTI)을 막기 위해 폐쇄 배액 유지, 소변주머니를 방광보다 낮게, 필요 없으면 빨리 제거하는 것이 핵심이다.","numbers":[{"label":"성인 도뇨관 굵기 (일반적)","value":"여성 14~16 Fr, 남성 16~18 Fr (기관 지침에 따라)"},{"label":"여성 삽입 길이","value":"약 5~7.5 cm, 소변이 나오면 2.5~5 cm 더 넣는다"},{"label":"남성 삽입 길이","value":"약 17~22.5 cm, 소변이 나오면 2.5~5 cm 더 넣는다"},{"label":"남성 삽입 시 음경 각도","value":"몸에 대해 60~90도로 들어 올린다"},{"label":"풍선 주입액","value":"멸균증류수, 제조사가 표시한 용량만큼"},{"label":"소변주머니 비우기","value":"2/3 정도 차기 전, 또는 기관 지침에 따라 정기적으로"}],"sections":[{"h":"목적","items":["요정체·방광 출구 폐색 등으로 스스로 소변을 볼 수 없을 때 소변 배출","중환자·수술 전후 등에서 시간당 소변량을 정확히 측정","수술 중·수술 후 방광 팽만 예방 (비뇨기·부인과 수술 등)","천골·회음부 상처가 있는 요실금 대상자의 상처 오염 예방 (다른 방법이 어려울 때)","방광 세척이나 약물 주입이 필요할 때"]},{"h":"준비물","items":["멸균 도뇨 세트 (멸균 장갑, 멸균 방포·구멍 난 방포, 소독솜·소독액, 섭자, 윤활제, 멸균증류수를 채운 주사기)","알맞은 크기의 유치도뇨관 (Foley catheter)과 폐쇄형 소변주머니","일회용 장갑 (회음부 세척용), 방수포, 조명","고정용 반창고 또는 고정 기구","회음부 세척용 물품 (비누와 물 또는 기관 지침의 세척액)"]},{"h":"여성과 남성의 차이","items":["자세: 여성은 배횡와위(무릎 세우고 다리 벌림), 남성은 앙와위(다리를 약간 벌림)","소독: 여성은 비우세손으로 음순을 벌린 채 위(치골 쪽)에서 아래(항문 쪽)로 한 번씩 닦는다. 남성은 포피를 젖히고 요도구에서 바깥쪽으로 원을 그리며 닦는다","삽입 길이: 여성 약 5~7.5 cm, 남성 약 17~22.5 cm (요도 길이 차이)","남성은 음경을 몸에 대해 60~90도로 들어 올려 요도를 곧게 펴고 삽입한다","남성은 삽입 후 젖혔던 포피를 반드시 제자리로 돌린다 (감돈포경 예방)","고정 위치: 여성은 대퇴 안쪽, 남성은 하복부 또는 대퇴 위쪽 (음경·음낭 접합부 압박과 누공 예방)"]},{"h":"도뇨관 관련 요로감염(CAUTI) 예방 관리","items":["꼭 필요한 경우에만 넣고, 필요가 없어지면 가능한 빨리 제거한다","폐쇄 배액 체계를 유지한다 (도뇨관과 소변주머니 연결을 함부로 떼지 않는다)","소변주머니는 항상 방광보다 낮게 두고, 바닥에 닿지 않게 침대 틀에 건다 (침대 난간에 걸지 않는다)","배액관이 꺾이거나 눌리거나 고이지 않게 한다","소변주머니는 각 대상자 전용 용기로 비우고, 배출구가 용기에 닿지 않게 한다","회음부와 도뇨관 주변은 매일 평소 위생 방법(비누와 물 등)으로 닦는다","도뇨관이나 소변주머니를 정해진 간격으로 일상적으로 교체하지 않는다 (막힘·감염·폐쇄 체계 파손 시 교체)","검체는 소변주머니가 아니라 도뇨관의 채취 포트를 소독한 후 멸균 주사기로 뽑는다","도뇨관을 만지기 전후 손위생을 한다"]}],"steps":[{"do":"의사 처방을 확인하고 필요한 물품을 준비한다","why":"유치도뇨는 침습적 처치로 처방이 필요하며, 물품을 미리 갖춰야 무균 상태를 유지하며 중단 없이 수행할 수 있다","key":false},{"do":"손위생을 하고 대상자를 두 가지 이상의 방법(이름, 등록번호 등)으로 확인한다","why":"교차 감염 예방과 대상자 오인 방지","key":true},{"do":"대상자에게 목적과 절차를 설명하고, 커튼·스크린으로 사생활을 보호한다","why":"불안을 줄이고 협조를 얻으며 수치심을 줄인다","key":false},{"do":"자세를 취해 준다 (여성: 배횡와위, 남성: 앙와위), 방수포를 깔고 회음부만 노출되게 덮는다","why":"요도구가 잘 보이게 하고 침구 오염과 불필요한 노출을 막는다","key":false},{"do":"일회용 장갑을 끼고 회음부를 비누와 물 등으로 씻은 뒤 장갑을 벗고 손위생을 한다","why":"회음부의 분비물과 미생물을 먼저 줄여 소독 효과를 높인다","key":false},{"do":"멸균 도뇨 세트를 멸균적으로 펼치고 멸균 장갑을 낀다","why":"도뇨관과 요도로 미생물이 들어가는 것을 막는 무균술의 시작","key":true},{"do":"구멍 난 방포를 회음부에 덮고, 소독솜에 소독액을 붓고 도뇨관 끝에 윤활제를 바른다 (여성 약 2.5~5 cm, 남성은 더 길게)","why":"멸균 영역을 넓히고, 윤활로 요도 점막 손상과 통증을 줄인다","key":false},{"do":"풍선 확인 여부는 기관 지침과 제조사 설명에 따른다 (전통적으로는 멸균증류수를 넣어 새는지 보고 다시 뺀다)","why":"풍선 결함을 미리 알 수 있으나, 실리콘 도뇨관 등은 미리 부풀리지 말라는 제조사 권고도 있다","key":false},{"do":"도뇨관을 소변주머니에 미리 연결해 둔다 (폐쇄형 세트이면 이미 연결되어 있음)","why":"삽입 후 바로 폐쇄 배액 체계를 만들어 감염 위험을 줄인다","key":false},{"do":"여성: 비우세손으로 음순을 벌려 요도구를 노출하고, 소독솜으로 위에서 아래로 한 번씩 닦는다 (솜 하나에 한 번). 남성: 비우세손으로 음경을 잡고 포피를 젖혀 요도구에서 바깥쪽으로 원을 그리며 닦는다","why":"깨끗한 곳에서 더러운 곳(항문 쪽) 방향으로 닦아 요도구 오염을 막는다. 요도구를 잡은 비우세손은 오염된 것으로 보고 끝날 때까지 떼지 않는다","key":true},{"do":"대상자에게 숨을 천천히 내쉬게(또는 배뇨하듯 힘주게) 하고, 우세손으로 도뇨관을 요도에 부드럽게 넣는다. 남성은 음경을 몸에 대해 60~90도로 들어 올린 채 넣는다","why":"괄약근이 이완되어 삽입이 쉬워지고, 남성은 요도의 굴곡을 펴서 손상을 줄인다","key":true},{"do":"여성 약 5~7.5 cm, 남성 약 17~22.5 cm 넣어 소변이 나오면 2.5~5 cm 더 넣는다","why":"풍선이 요도가 아니라 방광 안에 위치하게 하기 위해서이다","key":true},{"do":"여성에서 도뇨관이 질로 들어갔으면 그대로 두고 새 멸균 도뇨관으로 다시 삽입한다","why":"질에 들어간 도뇨관은 오염되었고, 그대로 두면 요도구 위치 표지가 되어 재삽입 실수를 줄인다","key":false},{"do":"제조사가 표시한 용량의 멸균증류수를 풍선 포트로 주입한다. 대상자가 통증을 호소하면 즉시 멈추고 물을 빼고 조금 더 넣은 후 다시 시도한다","why":"풍선으로 도뇨관이 빠지지 않게 하며, 통증은 풍선이 요도에서 부풀고 있다는 신호일 수 있다","key":true},{"do":"저항이 느껴질 때까지 도뇨관을 살짝 당긴다","why":"풍선이 방광 경부에 제대로 걸렸는지 확인한다","key":false},{"do":"남성은 젖혔던 포피를 제자리로 돌린다","why":"포피가 젖혀진 채로 있으면 부종·혈류 장애(감돈포경)가 생길 수 있다","key":true},{"do":"도뇨관을 고정한다 (여성: 대퇴 안쪽, 남성: 하복부 또는 대퇴 위쪽). 움직일 여유를 조금 남긴다","why":"도뇨관 당김으로 인한 요도·방광 경부 손상을 막고, 남성은 음경·음낭 접합부의 압박 손상과 누공을 예방한다","key":true},{"do":"소변주머니를 방광보다 낮게, 바닥에 닿지 않게 침대 틀에 걸고 배액관이 꺾이지 않게 정리한다","why":"중력으로 소변이 잘 빠지게 하고 소변의 역류와 감염을 막는다","key":true},{"do":"물품을 정리하고 장갑을 벗은 뒤 손위생을 한다. 대상자를 편안하게 해 준다","why":"감염 전파 방지와 대상자 안위","key":false},{"do":"삽입 날짜·시간, 도뇨관 크기, 풍선 주입량, 소변의 양·색·성상, 대상자 반응을 기록한다","why":"법적 기록이며 이후 관리·제거 시점 판단과 감염 감시에 필요하다","key":true}],"cautions":["처음부터 끝까지 무균술을 지킨다. 멸균 장갑이나 도뇨관이 오염되면 새것으로 바꾼다","풍선은 소변이 나오는 것을 확인하고 더 밀어 넣은 뒤에 부풀린다. 요도 안에서 부풀리면 요도 손상이 생긴다","풍선에는 생리식염수나 공기가 아닌 멸균증류수를 제조사 표시 용량만큼 넣는다 (기관 지침에 따라)","삽입할 때 강한 저항이 있으면 억지로 밀지 말고 멈춘 뒤 보고한다 (특히 전립선 비대가 있는 남성)","소변주머니는 이동할 때도 방광보다 높이 들지 않는다. 필요하면 잠깐 배액관을 잠그고 이동 후 바로 푼다","제거할 때는 풍선의 물을 주사기로 모두 뺀 다음 부드럽게 빼고, 제거 후 첫 자가배뇨 시간과 양을 확인한다","방광이 많이 팽만된 경우 한 번에 배출할 양의 제한 여부는 교과서와 기관 지침에 따라 다르므로 확인한다"],"nursing":["섭취량과 배설량을 측정·기록한다","소변의 색·혼탁도·냄새·혈뇨 여부를 관찰한다","발열, 치골 상부 통증, 혼탁뇨 등 요로감염 징후를 관찰하고 보고한다","금기가 없으면 수분 섭취를 권장하여 소변이 잘 흐르게 한다","매일 도뇨관 유지가 필요한지 확인하여 불필요한 유치를 줄인다"],"videos":[{"label":"핵심기본간호술 유치도뇨 (여성)","query":"핵심기본간호술 유치도뇨 여성"},{"label":"핵심기본간호술 유치도뇨 (남성)","query":"유치도뇨 남성 간호술기"},{"label":"도뇨관 관련 요로감염 예방","query":"CAUTI 예방 간호"}],"quiz":[{"q":"여성 대상자에게 유치도뇨를 시행할 때 옳은 방법은?","options":["회음부는 항문 쪽에서 치골 쪽으로 닦는다","도뇨관을 약 5~7.5 cm 넣어 소변이 나오면 2.5~5 cm 더 넣은 후 풍선을 부풀린다","도뇨관이 질로 들어가면 빼서 다시 요도로 넣는다","도뇨관은 하복부에 고정한다","음순을 벌린 비우세손은 소독 후 바로 떼고 도뇨관을 잡는다"],"answer":1,"explain":"여성 요도는 짧아 약 5~7.5 cm 넣고 소변이 나오면 2.5~5 cm 더 넣어 풍선이 방광 안에 있게 한다. 소독은 치골 쪽에서 항문 쪽으로, 질로 들어간 도뇨관은 오염되었으므로 그대로 두고 새 도뇨관을 쓴다. 여성은 대퇴 안쪽에 고정하며, 음순을 벌린 비우세손은 오염된 손으로 보고 끝까지 떼지 않는다."},{"q":"남성 대상자에게 유치도뇨관을 삽입할 때 음경을 몸에 대해 60~90도로 들어 올리는 이유는?","options":["소변이 빨리 나오게 하기 위해","포피를 쉽게 젖히기 위해","요도의 굴곡을 펴서 삽입을 쉽게 하고 손상을 줄이기 위해","풍선이 잘 부풀게 하기 위해","음경·음낭 접합부 누공을 예방하기 위해"],"answer":2,"explain":"남성 요도는 굴곡이 있어 음경을 60~90도로 들어 올리면 요도가 곧게 펴져 삽입이 쉬워지고 점막 손상이 줄어든다. 음경·음낭 접합부 누공 예방은 삽입 각도가 아니라 고정 위치(하복부·대퇴 위쪽)와 관련된다."},{"q":"유치도뇨관 풍선을 부풀리는 중 대상자가 심한 통증을 호소하였다. 가장 우선적인 간호는?","options":["남은 용량을 빨리 주입한다","진통제를 투여하고 계속 주입한다","도뇨관을 바로 잡아당겨 위치를 확인한다","주입을 멈추고 물을 뺀 뒤 도뇨관을 조금 더 넣고 다시 시도한다","풍선을 부풀린 상태로 고정하고 보고한다"],"answer":3,"explain":"풍선 주입 중 통증은 풍선이 방광이 아닌 요도 안에 있다는 신호일 수 있다. 즉시 멈추고 물을 뺀 뒤 도뇨관을 더 넣어 방광 안에 위치시킨 후 다시 부풀린다. 계속 주입하거나 당기면 요도 손상이 생긴다."},{"q":"유치도뇨 대상자의 도뇨관 관련 요로감염(CAUTI) 예방 간호로 옳은 것은?","options":["소변주머니를 방광보다 낮게, 바닥에 닿지 않게 건다","감염 예방을 위해 도뇨관을 1주마다 정기적으로 교체한다","소변 검체는 소변주머니 배출구에서 받는다","막힘을 막기 위해 매일 방광 세척을 한다","환자 이동 시 소변주머니를 배 위에 올려 둔다"],"answer":0,"explain":"소변주머니를 방광보다 낮게 두어야 역류가 없고, 바닥에 닿으면 오염된다. 도뇨관은 정해진 간격으로 일상 교체하지 않고 필요할 때 교체하며, 검체는 채취 포트에서 멸균적으로 뽑는다. 일상적인 방광 세척은 폐쇄 체계를 깨므로 하지 않는다. 배 위에 올리면 방광보다 높아져 역류한다."},{"q":"남성 대상자에게 유치도뇨관을 삽입한 후 고정 위치와 이유가 바르게 연결된 것은?","options":["대퇴 안쪽 – 소변 배출을 쉽게 하기 위해","하복부 – 음경·음낭 접합부의 압박과 누공을 예방하기 위해","대퇴 안쪽 – 요도 굴곡을 유지하기 위해","음낭 – 도뇨관 당김을 줄이기 위해","고정하지 않는다 – 풍선이 있으므로 빠지지 않는다"],"answer":1,"explain":"남성은 음경을 위로 향하게 하여 하복부(또는 대퇴 위쪽)에 고정해 음경·음낭 접합부가 눌리지 않게 하고 누공을 예방한다. 대퇴 안쪽은 여성의 고정 위치이다. 풍선이 있어도 당김에 의한 요도·방광 경부 손상을 막기 위해 고정한다."},{"q":"유치도뇨 수행 후 남성 대상자에게 반드시 확인해야 할 것은?","options":["음경을 90도로 들어 올린 채 고정하였는가","풍선에 공기를 넣었는가","소변주머니를 침대 난간에 걸었는가","젖혔던 포피를 제자리로 돌렸는가","도뇨관을 소변주머니와 분리해 두었는가"],"answer":3,"explain":"포피를 젖힌 채로 두면 귀두가 조여 부종과 혈류 장애(감돈포경)가 생길 수 있으므로 삽입 후 반드시 제자리로 돌린다. 풍선에는 멸균증류수를 넣고, 소변주머니는 침대 틀에 걸며, 폐쇄 배액 체계를 유지해야 한다."}]},{"id":"dm-acute","subject":"성인간호학","kind":"개념","title":"당뇨 급성 합병증 (저혈당·DKA·HHS)","en":"Acute complications of diabetes mellitus (hypoglycemia, DKA, HHS)","tags":["내분비계","응급","당뇨"],"summary":"당뇨병의 급성 합병증은 혈당이 너무 낮아지는 저혈당과, 혈당이 크게 오르는 당뇨병성 케톤산증(DKA)·고삼투성 고혈당 상태(HHS)가 있다. DKA는 주로 제1형에서 케톤과 대사성 산증이 특징이고, HHS는 주로 고령의 제2형에서 극심한 고혈당과 탈수가 특징이다. 저혈당은 '15-15 규칙'으로 바로 대처한다.","numbers":[{"label":"저혈당 기준","value":"혈당 70 mg/dL 미만 (54 mg/dL 미만은 임상적으로 의미 있는 저혈당)"},{"label":"15-15 규칙","value":"속효성 탄수화물 15 g 섭취 → 15분 후 혈당 재측정 → 70 mg/dL 미만이면 반복"},{"label":"DKA 혈당","value":"250 mg/dL 초과"},{"label":"DKA 산증","value":"pH 7.30 미만, HCO₃⁻ 18 mEq/L 미만, 케톤 양성"},{"label":"HHS 혈당","value":"600 mg/dL 초과"},{"label":"HHS 혈청 삼투압","value":"320 mOsm/kg 초과, 케톤 음성 또는 경미, pH 7.30 이상"}],"sections":[{"h":"저혈당 (Hypoglycemia)","items":["원인: 인슐린·설폰요소제 과량, 식사를 거르거나 늦춤, 평소보다 많은 운동, 음주, 신기능 저하","교감신경 증상(아드레날린 반응): 떨림, 발한, 빈맥, 두근거림, 불안, 배고픔, 창백","중추신경 증상(뇌의 포도당 부족): 두통, 집중력 저하, 혼돈, 시야 흐림, 말이 어눌함, 이상 행동, 경련, 의식 소실","베타차단제 복용자, 당뇨병 유병 기간이 긴 사람은 교감신경 증상이 가려져 저혈당을 늦게 알아챌 수 있다 (무감지 저혈당)","야간 저혈당: 악몽, 식은땀, 아침 두통"]},{"h":"저혈당 대처","items":["의식이 있고 삼킬 수 있으면: 속효성 탄수화물 15 g을 먹게 한다 (예: 포도당 정제 15 g, 주스나 일반 탄산음료 약 120 mL(반 컵), 사탕 몇 개, 설탕 1큰술 정도)","15분 뒤 혈당을 다시 재고, 여전히 70 mg/dL 미만이면 15 g을 한 번 더 준다","혈당이 회복되면 다음 식사가 1시간 이상 남았을 때 복합 탄수화물·단백질이 든 간식을 먹게 해 재발을 막는다","초콜릿·우유처럼 지방이 많은 음식은 흡수가 늦어 첫 대처로는 적절하지 않다","의식이 없거나 삼킬 수 없으면: 입으로 아무것도 주지 않는다(흡인 위험). 처방·기관 지침에 따라 글루카곤 근육·피하 주사 또는 50% 포도당 정맥주사","의식을 되찾으면 경구로 탄수화물을 준다 (글루카곤 후 구토 가능 → 옆으로 눕힌다)","알파글루코시다제 억제제(아카보스 등) 복용자는 설탕 대신 포도당으로 교정한다"]},{"h":"당뇨병성 케톤산증 (DKA)","items":["기전: 인슐린이 절대적으로 부족 → 포도당을 쓰지 못해 지방 분해 → 케톤체 생성 → 대사성 산증. 고혈당으로 삼투성 이뇨 → 탈수·전해질 손실","대상: 주로 제1형 당뇨병, 첫 진단 시 나타나기도 함","유발 요인: 인슐린 투여 중단·부족, 감염, 스트레스(수술, 외상), 첫 발병","증상: 다뇨·다갈·다식, 탈수(피부 건조, 빈맥, 저혈압), 쿠스마울 호흡(깊고 빠른 호흡), 아세톤(과일) 냄새 호흡, 오심·구토·복통, 의식 저하","발생 속도: 빠르게(수 시간~하루 이내) 진행"]},{"h":"고삼투성 고혈당 상태 (HHS)","items":["기전: 인슐린이 조금은 남아 있어 지방 분해·케톤 생성은 거의 없지만, 극심한 고혈당 → 심한 삼투성 이뇨 → 극심한 탈수와 고삼투압","대상: 주로 고령의 제2형 당뇨병","유발 요인: 감염(폐렴, 요로감염), 수분 섭취 부족, 급성 질환(뇌졸중, 심근경색), 스테로이드·이뇨제 등 약물","증상: 극심한 탈수, 저혈압, 빈맥, 신경학적 증상(혼돈, 편측 마비, 경련, 혼수)이 DKA보다 흔함. 쿠스마울 호흡·과일 냄새는 없음","발생 속도: 서서히(수일~수주) 진행, DKA보다 사망률이 높다"]},{"h":"DKA와 HHS 비교","items":["주 대상: DKA 제1형 / HHS 고령의 제2형","혈당: DKA 250 mg/dL 초과 / HHS 600 mg/dL 초과","케톤: DKA 양성(많음) / HHS 음성 또는 경미","산증: DKA pH 7.30 미만, HCO₃⁻ 감소, 음이온차 증가 / HHS pH 7.30 이상, 산증 없거나 경미","혈청 삼투압: DKA 다양함 / HHS 320 mOsm/kg 초과","호흡: DKA 쿠스마울 호흡, 아세톤 냄새 / HHS 없음","탈수: 둘 다 있으나 HHS가 더 심함","치료 공통: ① 수액(먼저 생리식염수) ② 속효성(레귤러) 인슐린 정맥 주입 ③ 칼륨 등 전해질 보충 ④ 유발 원인 치료"]},{"h":"DKA·HHS 치료 원리","items":["수액 보충이 가장 먼저: 처방에 따라 생리식염수(0.9% NaCl)로 시작, 이후 상태에 따라 0.45% 식염수","인슐린: 정맥으로 줄 수 있는 것은 속효성(레귤러) 인슐린 — 처방에 따라 지속 주입","혈당이 약 200~250 mg/dL로 떨어지면 처방에 따라 포도당이 든 수액을 추가해 저혈당과 뇌부종을 막는다","칼륨: 인슐린은 칼륨을 세포 안으로 이동시켜 저칼륨혈증을 일으킨다. 처음 혈청 칼륨이 정상이거나 높아 보여도 몸 전체 칼륨은 부족할 수 있어, 소변량 확인 후 처방에 따라 보충","중탄산나트륨은 심한 산증에서만 제한적으로 사용 (처방에 따라)"]}],"steps":[],"cautions":["의식이 없는 저혈당 환자의 입에 음식·음료를 넣지 않는다 (흡인 위험)","저혈당인지 고혈당인지 확실하지 않고 혈당 측정이 불가능하면 저혈당으로 보고 처치한다 (저혈당이 더 빨리 뇌손상을 일으킴) — 기관 지침에 따라","혈당을 너무 빨리 떨어뜨리면 뇌부종 위험이 있다","인슐린 정맥 주입 중 저칼륨혈증(근력 약화, 부정맥, 심전도 U파)을 관찰한다","인슐린 정맥 주입에는 속효성(레귤러) 인슐린만 사용한다","아픈 날(sick day)에도 인슐린을 임의로 끊지 않는다 — 먹지 못해도 인슐린 필요량은 오히려 늘 수 있다"],"nursing":["저혈당 증상을 빨리 알아보고 15-15 규칙으로 즉시 대처한다","혈당을 자주(처방에 따라 매시간 등) 측정하고 기록한다","DKA·HHS: 섭취량·배설량, 체중, 활력징후, 탈수 징후, 의식수준을 관찰한다","수액 보충 중 수분 과부하(특히 고령·심장질환자)를 관찰한다","혈청 칼륨·나트륨, 동맥혈가스(pH, HCO₃⁻), 케톤, 음이온차를 확인한다","심전도 모니터링으로 칼륨 이상에 따른 부정맥을 관찰한다","유발 요인(감염, 인슐린 중단 등)을 확인하고 교육한다","교육: 저혈당 대처법, 사탕·포도당 정제 휴대, 당뇨 인식표 착용, 운동 전 혈당 확인, 음주 시 공복 피하기","교육(아픈 날 관리): 인슐린을 끊지 않기, 혈당을 3~4시간마다 측정, 케톤 확인(제1형), 수분 충분히 섭취, 구토·혈당 지속 상승 시 병원 연락"],"videos":[{"label":"저혈당 대처 15-15 규칙","query":"저혈당 15 15 규칙 간호"},{"label":"DKA와 HHS 비교","query":"당뇨병성 케톤산증 고삼투성 고혈당 비교"},{"label":"당뇨 급성 합병증 국가고시","query":"당뇨 급성 합병증 간호 국가고시"}],"quiz":[{"q":"인슐린을 투여하는 당뇨병 환자가 식은땀, 떨림, 두근거림을 호소한다. 의식은 명료하고 혈당은 58 mg/dL이다. 우선적인 간호중재는?","options":["속효성 인슐린을 투여한다","오렌지 주스 약 120 mL(반 컵)를 마시게 한다","글루카곤을 근육주사한다","30분 뒤 혈당을 다시 측정한다","초콜릿을 먹게 한다"],"answer":1,"explain":"의식이 있고 삼킬 수 있는 저혈당 환자에게는 속효성 탄수화물 15 g(주스 반 컵 정도)을 주고 15분 뒤 혈당을 다시 잰다. 글루카곤은 의식이 없거나 삼킬 수 없을 때 쓰고, 초콜릿은 지방 때문에 흡수가 늦다. 인슐린은 저혈당을 악화시킨다."},{"q":"당뇨병성 케톤산증(DKA)의 특징으로 옳은 것은?","options":["혈중 케톤 음성","pH 7.45 이상","주로 고령의 제2형 당뇨병 환자에게 발생","혈당 600 mg/dL 초과가 진단 기준","쿠스마울 호흡과 아세톤 냄새 호흡"],"answer":4,"explain":"DKA는 케톤체로 대사성 산증이 생겨 이를 보상하려고 깊고 빠른 쿠스마울 호흡을 하고, 아세톤 냄새가 난다. 케톤 음성, 고령의 제2형, 혈당 600 mg/dL 초과는 HHS의 특징이며, pH는 7.30 미만으로 떨어진다."},{"q":"DKA 환자에게 레귤러 인슐린을 정맥 주입하는 동안 특히 주의해서 관찰해야 할 전해질 이상은?","options":["저칼륨혈증","고칼슘혈증","고나트륨혈증","저마그네슘혈증","고인산혈증"],"answer":0,"explain":"인슐린은 칼륨을 세포 안으로 이동시키므로 치료 중 혈청 칼륨이 빠르게 떨어져 부정맥이 생길 수 있다. 그래서 칼륨을 자주 확인하고 처방에 따라 보충한다."},{"q":"고삼투성 고혈당 상태(HHS)에 대한 설명으로 옳은 것은?","options":["주로 제1형 당뇨병 환자에게 발생한다","케톤이 많이 생성되어 심한 산증이 나타난다","극심한 탈수와 혈청 삼투압 320 mOsm/kg 초과가 특징이다","수 시간 안에 빠르게 발생한다","DKA보다 사망률이 낮다"],"answer":2,"explain":"HHS는 주로 고령의 제2형 당뇨병에서 서서히 생기며, 인슐린이 조금 남아 있어 케톤·산증은 거의 없고, 극심한 고혈당과 탈수로 삼투압이 크게 오른다. 사망률은 DKA보다 높다."},{"q":"DKA 치료 중 혈당이 약 250 mg/dL로 떨어졌을 때 예상되는 처방 변경은?","options":["인슐린 주입을 즉시 완전히 중단한다","중탄산나트륨을 대량 투여한다","수액을 모두 중단한다","포도당이 든 수액을 추가한다","경구 혈당강하제로 바꾼다"],"answer":3,"explain":"혈당이 200~250 mg/dL 정도로 떨어지면 저혈당과 뇌부종을 막기 위해 포도당이 든 수액을 추가하고, 케톤산증이 풀릴 때까지 인슐린은 계속 준다. 인슐린을 갑자기 끊으면 케톤산증이 다시 악화된다."},{"q":"당뇨병 환자가 의식이 없고 혈당이 40 mg/dL이다. 정맥로가 없을 때 우선적인 중재는?","options":["주스를 입에 넣어 준다","처방에 따라 글루카곤을 근육주사한다","속효성 인슐린을 피하주사한다","사탕을 입에 물려 준다","1시간 뒤 혈당을 다시 측정한다"],"answer":1,"explain":"의식이 없는 저혈당 환자는 입으로 주면 흡인 위험이 있으므로 처방에 따라 글루카곤을 근육·피하 주사하고, 정맥로가 있으면 50% 포도당을 정맥주사한다. 인슐린은 저혈당을 악화시킨다."}]},{"id":"abga","subject":"성인간호학","kind":"개념","title":"동맥혈가스분석 (ABGA) 해석","en":"Arterial blood gas analysis","tags":["호흡기계","산염기","검사"],"summary":"동맥혈가스분석은 동맥혈의 pH, PaCO₂, HCO₃⁻, PaO₂, SaO₂를 재서 산염기 균형과 산소화 상태를 본다. PaCO₂는 폐(호흡성), HCO₃⁻는 신장(대사성)이 조절한다. pH → PaCO₂ → HCO₃⁻ → 보상 → 산소화 순서로 해석한다.","numbers":[{"label":"pH","value":"7.35~7.45"},{"label":"PaCO₂","value":"35~45 mmHg"},{"label":"HCO₃⁻","value":"22~26 mEq/L"},{"label":"PaO₂","value":"80~100 mmHg"},{"label":"SaO₂","value":"95~100%"},{"label":"염기과잉 (BE)","value":"−2~+2 mEq/L"},{"label":"채혈 후 압박","value":"최소 5분 (항응고제 투여 중이면 10분 이상)"}],"sections":[{"h":"기본 원리","items":["pH 7.35 미만 = 산증(acidosis), 7.45 초과 = 알칼리증(alkalosis)","PaCO₂는 산 성분: 높으면 산 쪽, 낮으면 알칼리 쪽 — 폐(호흡)가 조절, 빠르게(수 분~수 시간) 변함","HCO₃⁻는 염기 성분: 낮으면 산 쪽, 높으면 알칼리 쪽 — 신장이 조절, 느리게(수 시간~수일) 변함","호흡성: pH와 PaCO₂가 반대 방향으로 움직인다 (pH↓ PaCO₂↑ 또는 pH↑ PaCO₂↓)","대사성: pH와 HCO₃⁻가 같은 방향으로 움직인다 (pH↓ HCO₃⁻↓ 또는 pH↑ HCO₃⁻↑)"]},{"h":"4가지 산염기 장애와 원인","items":["호흡성 산증 (pH↓, PaCO₂↑): 환기 저하로 CO₂ 축적 — 만성폐쇄성폐질환(COPD), 아편유사제·진정제 과다, 호흡근 약화(길랭-바레, 중증근무력증), 흉부 외상, 기도 폐쇄","호흡성 알칼리증 (pH↑, PaCO₂↓): 과환기로 CO₂ 과다 배출 — 불안·공황, 통증, 발열, 저산소증 초기(고지대, 폐색전 초기), 기계 환기 과다, 살리실산 중독 초기","대사성 산증 (pH↓, HCO₃⁻↓): 산 증가 또는 염기 손실 — 당뇨병성 케톤산증, 젖산산증(쇼크), 신부전, 심한 설사, 살리실산 중독","대사성 알칼리증 (pH↑, HCO₃⁻↑): 산 손실 또는 염기 증가 — 심한 구토, 위액 흡인(비위관), 이뇨제(저칼륨혈증 동반), 제산제·중탄산염 과다 섭취"]},{"h":"보상","items":["호흡성 장애는 신장이 보상: 호흡성 산증 → 신장이 HCO₃⁻를 보유해 HCO₃⁻ 상승 / 호흡성 알칼리증 → HCO₃⁻ 배설로 HCO₃⁻ 감소 (수일 걸림)","대사성 장애는 폐가 보상: 대사성 산증 → 과환기(쿠스마울 호흡)로 PaCO₂ 감소 / 대사성 알칼리증 → 저환기로 PaCO₂ 상승 (빠름)","보상 안 됨(비보상): pH 비정상, 원인 값만 비정상, 다른 값은 정상","부분 보상: pH 비정상, PaCO₂와 HCO₃⁻ 모두 비정상 (보상이 진행 중)","완전 보상: pH 정상 범위, PaCO₂와 HCO₃⁻ 모두 비정상 — pH 7.35~7.40이면 산증 쪽, 7.40~7.45이면 알칼리증 쪽이 원래 장애","보상은 pH를 정상 쪽으로 돌려놓을 뿐, 지나치게 보상(과보상)하지는 않는다"]},{"h":"해석 순서","items":["1단계 pH: 산증(7.35 미만)인가, 알칼리증(7.45 초과)인가, 정상인가","2단계 PaCO₂: pH 변화와 맞는 방향인가 → 맞으면 호흡성","3단계 HCO₃⁻: pH 변화와 맞는 방향인가 → 맞으면 대사성","4단계 보상: 반대쪽 값이 정상인지(비보상), 변했는지(부분·완전 보상) 확인","5단계 산소화: PaO₂, SaO₂로 저산소혈증 여부 확인 (PaO₂ 60 mmHg 미만이면 SaO₂가 급격히 떨어짐)","예: pH 7.30, PaCO₂ 55, HCO₃⁻ 25 → 비보상성 호흡성 산증","예: pH 7.32, PaCO₂ 30, HCO₃⁻ 16 → 부분 보상된 대사성 산증"]},{"h":"관련 전해질","items":["산증에서는 수소이온이 세포 안으로 들어가고 칼륨이 세포 밖으로 나와 고칼륨혈증이 생기기 쉽다","알칼리증에서는 반대로 저칼륨혈증이 생기기 쉽다","알칼리증에서는 이온화 칼슘이 줄어 손발 저림, 테타니, 경련이 나타날 수 있다"]}],"steps":[],"cautions":["채혈 전 요골동맥을 쓸 때는 앨런 검사(Allen test)로 척골동맥 측부 순환을 확인한다. 음성(손 색이 돌아오지 않음)이면 그 쪽 요골동맥에서 채혈하지 않는다","채혈 후 최소 5분, 항응고제 투여 중이거나 출혈 경향이 있으면 10분 이상 직접 압박한다","주사기에 공기 방울이 들어가면 PaO₂·PaCO₂ 값이 달라지므로 즉시 공기를 빼고 밀봉한다","헤파린 처리된 주사기를 사용해 혈액 응고를 막는다","검체는 바로 검사실로 보내고, 늦어질 경우 기관 지침에 따라 얼음에 담아 운반한다 (세포 대사로 PaO₂ 감소, PaCO₂ 증가)","산소 투여량이나 기계 환기 설정을 바꾼 직후에는 기관 지침에 따라(보통 20~30분) 기다린 뒤 채혈한다","검사지에 산소 투여 방법·농도와 체온을 기록한다"],"nursing":["채혈 목적을 설명하고 동맥 천자는 정맥 채혈보다 아플 수 있음을 알린다","앨런 검사: 손을 꽉 쥐게 한 뒤 요골·척골동맥을 동시에 누르고, 손을 펴게 해 창백해진 것을 확인 → 척골동맥만 압박을 풀어 손 색이 돌아오는지 본다 (보통 15초 이내 회복되면 양성, 교재에 따라 5~15초)","요골동맥이 가장 흔한 채혈 부위이다 (접근이 쉽고 측부 순환이 있음)","채혈 후 천자 부위를 압박하고 출혈, 혈종, 손의 색·온도·감각·맥박을 관찰한다","결과를 해석해 호흡 상태(호흡수·깊이, 의식, 산소포화도)와 함께 보고한다","호흡성 산증: 기도 개방, 기침·심호흡, 체위(반좌위), 처방에 따른 산소(만성 CO₂ 정체 환자는 저농도로 주의)","호흡성 알칼리증: 불안 감소, 천천히 호흡하도록 지도, 원인(통증·발열) 교정","대사성 산증·알칼리증: 원인 교정, 처방에 따른 수액·전해질 보충, 칼륨과 심전도 관찰"],"videos":[{"label":"ABGA 해석 쉽게","query":"ABGA 해석 방법 간호학생"},{"label":"산염기 불균형 보상","query":"산염기 불균형 보상 부분보상 완전보상"},{"label":"앨런 검사 방법","query":"앨런 테스트 동맥혈 채혈 간호"}],"quiz":[{"q":"ABGA 결과가 pH 7.28, PaCO₂ 58 mmHg, HCO₃⁻ 24 mEq/L일 때 해석으로 옳은 것은?","options":["비보상성 대사성 산증","부분 보상된 호흡성 알칼리증","완전 보상된 대사성 알칼리증","비보상성 호흡성 산증","부분 보상된 대사성 산증"],"answer":3,"explain":"pH가 낮아 산증이고, PaCO₂가 높아 pH와 같은 산 방향이므로 호흡성이다. HCO₃⁻는 정상이라 아직 신장 보상이 없으므로 비보상성 호흡성 산증이다."},{"q":"ABGA 결과가 pH 7.31, PaCO₂ 30 mmHg, HCO₃⁻ 15 mEq/L이다. 이 결과와 관련 있는 상황은?","options":["당뇨병성 케톤산증","심한 구토","불안으로 인한 과환기","아편유사제 과다 투여","비위관 흡인"],"answer":0,"explain":"pH 낮음(산증) + HCO₃⁻ 낮음 = 대사성 산증이고, PaCO₂가 낮아진 것은 폐의 보상(과환기)으로 부분 보상 상태이다. 당뇨병성 케톤산증이 대사성 산증의 대표 원인이다. 구토·비위관 흡인은 대사성 알칼리증, 과환기는 호흡성 알칼리증, 아편유사제 과다는 호흡성 산증의 원인이다."},{"q":"장기간 구토를 한 환자에게서 예상되는 ABGA 결과는?","options":["pH 7.30, PaCO₂ 50, HCO₃⁻ 24","pH 7.50, PaCO₂ 30, HCO₃⁻ 24","pH 7.48, PaCO₂ 46, HCO₃⁻ 32","pH 7.32, PaCO₂ 40, HCO₃⁻ 18","pH 7.40, PaCO₂ 40, HCO₃⁻ 24"],"answer":2,"explain":"구토로 위산(HCl)을 잃으면 대사성 알칼리증(pH↑, HCO₃⁻↑)이 되고, 폐가 저환기로 보상해 PaCO₂가 약간 오른다. ①은 호흡성 산증, ②는 호흡성 알칼리증, ④는 대사성 산증, ⑤는 정상이다."},{"q":"요골동맥에서 동맥혈을 채혈하기 전에 앨런 검사(Allen test)를 하는 목적은?","options":["요골동맥의 맥박 수를 세기 위해","척골동맥을 통한 손의 측부 순환을 확인하기 위해","혈액 응고 시간을 확인하기 위해","채혈 부위의 감염 여부를 확인하기 위해","정맥 귀환을 확인하기 위해"],"answer":1,"explain":"요골동맥이 손상·폐색되더라도 척골동맥이 손에 혈액을 공급할 수 있는지(측부 순환) 확인하는 검사이다. 척골동맥 압박을 풀었을 때 손 색이 빠르게 돌아오면 채혈할 수 있다."},{"q":"동맥혈 채혈 후 간호로 옳은 것은?","options":["항응고제를 투여 중인 환자는 1분만 압박한다","주사기 속 공기 방울은 그대로 두고 보낸다","검체를 실온에 몇 시간 두었다가 보낸다","천자 부위를 문질러 마사지한다","최소 5분 이상 직접 압박하고 손의 순환 상태를 관찰한다"],"answer":4,"explain":"동맥은 압력이 높아 출혈·혈종이 잘 생기므로 최소 5분(항응고제 투여 중이면 10분 이상) 직접 압박하고 손의 색·온도·맥박을 관찰한다. 공기 방울은 가스 값을 바꾸고, 지연되면 세포 대사로 결과가 변하며, 마사지는 혈종을 만들 수 있다."},{"q":"ABGA 결과가 pH 7.43, PaCO₂ 28 mmHg, HCO₃⁻ 18 mEq/L일 때 해석으로 옳은 것은?","options":["비보상성 대사성 산증","완전 보상된 호흡성 알칼리증","부분 보상된 호흡성 산증","완전 보상된 대사성 알칼리증","정상"],"answer":1,"explain":"pH는 정상 범위지만 PaCO₂와 HCO₃⁻가 모두 비정상이므로 완전 보상 상태이다. pH가 7.40보다 높아 알칼리 쪽이고, 알칼리 방향과 맞는 값은 낮은 PaCO₂이므로 원래 장애는 호흡성 알칼리증, 낮은 HCO₃⁻는 신장의 보상이다."}]},{"id":"iicp","subject":"성인간호학","kind":"개념","title":"두개내압 상승 (IICP)","en":"Increased intracranial pressure","tags":["신경계","응급","중환자"],"summary":"두개골 안의 뇌조직·혈액·뇌척수액 중 하나가 늘어나 다른 것이 보상하지 못하면 두개내압이 오른다. 두개내압이 오르면 뇌관류압이 떨어져 뇌허혈과 뇌탈출(herniation)이 생길 수 있다. 가장 먼저 나타나는 변화는 의식수준 변화이며, 쿠싱 3징후는 늦은 징후이다.","numbers":[{"label":"정상 ICP (성인)","value":"5~15 mmHg"},{"label":"치료가 필요한 ICP","value":"20 mmHg 이상이 지속될 때"},{"label":"뇌관류압 (CPP)","value":"CPP = MAP − ICP"},{"label":"정상 CPP","value":"70~100 mmHg (최소 50~60 mmHg 이상 유지, 그 아래면 뇌허혈 위험)"},{"label":"평균동맥압 (MAP)","value":"(수축기압 + 2 × 이완기압) ÷ 3"},{"label":"GCS 점수 범위","value":"3~15점 (8점 이하 = 중증, 기도 확보 고려)"},{"label":"침상머리 높이","value":"30도 (기관 지침에 따라 15~30도)"}],"sections":[{"h":"Monro-Kellie 가설","text":"두개골은 단단한 상자라서 부피가 일정하다. 그 안은 뇌조직(약 80%), 혈액(약 10%), 뇌척수액(약 10%)으로 채워져 있다. 한 가지가 늘어나면 다른 것이 줄어들어(주로 뇌척수액이 척수강으로 이동, 정맥혈 배출 증가) 압력을 유지한다. 이 보상이 한계를 넘으면 작은 부피 증가에도 두개내압이 급격히 오른다."},{"h":"원인","items":["뇌조직 증가: 뇌종양, 뇌부종(두부외상, 뇌졸중, 저산소증 후), 뇌농양","혈액 증가: 두개내 출혈(경막외·경막하·뇌실질 출혈), 고탄산혈증(PaCO₂ 상승 → 뇌혈관 확장), 정맥 배출 장애(목 굴곡·회전)","뇌척수액 증가: 수두증(생성 증가, 흡수 장애, 흐름 차단)","악화 요인: 저산소증, 고열, 경련, 기침·발살바 수기, 통증·불안, 저나트륨혈증"]},{"h":"뇌관류압(CPP) 계산","items":["CPP = MAP − ICP","예: 혈압 120/60 mmHg → MAP = (120 + 2×60) ÷ 3 = 80 mmHg, ICP 20 mmHg → CPP = 60 mmHg","정상 CPP는 70~100 mmHg이며, 50~60 mmHg 아래로 떨어지면 뇌허혈 위험이 크다","따라서 IICP 환자는 ICP를 낮추는 것과 함께 MAP(혈압)를 너무 떨어뜨리지 않는 것이 중요하다"]},{"h":"증상 — 초기","items":["의식수준 변화: 가장 먼저, 가장 민감하게 나타나는 징후 (안절부절, 혼돈, 기면, 지남력 저하)","두통 (특히 아침에 심함), 구토","동공 반응이 느려짐, 한쪽 동공 크기 변화 시작","한쪽 운동 약화(편측 마비 경향), 시력 변화(복시)"]},{"h":"증상 — 후기","items":["쿠싱 3징후(Cushing's triad): 수축기 혈압 상승과 맥압 증가, 서맥, 불규칙한 호흡","동공 확대·고정 (같은 쪽 동안신경 압박)","제피질 자세(굴곡) → 제뇌 자세(신전) → 이완","투사성 구토, 유두부종","의식 저하 → 혼수, 체온 조절 장애","뇌탈출이 진행되면 호흡 정지 위험"]},{"h":"GCS (글래스고 혼수 척도) 개요","items":["눈 뜨기(E) 1~4점, 언어 반응(V) 1~5점, 운동 반응(M) 1~6점","총점 3~15점: 15점 정상, 13~15 경증, 9~12 중등도, 8점 이하 중증","8점 이하이면 스스로 기도를 유지하기 어려울 수 있어 기관 내 삽관을 고려한다","기관 내 삽관 중이면 언어 반응은 'T'로 표시한다","점수 자체보다 이전보다 떨어졌는지(추세)가 중요하다"]},{"h":"치료 개요","items":["삼투성 이뇨제(만니톨), 고장성 식염수: 뇌의 수분을 혈관으로 끌어내 뇌부종 감소 (처방에 따라)","뇌척수액 배액(뇌실 배액관), 원인 제거 수술(혈종 제거, 감압 개두술)","산소화 유지, 정상 이산화탄소 유지 (과환기는 뇌혈관 수축으로 뇌허혈 위험이 있어 단기간·응급 시에만)","체온·경련·통증 조절, 필요 시 진정"]}],"steps":[],"cautions":["요추천자는 금기: 뇌압이 갑자기 빠지면서 뇌탈출이 생길 수 있다","트렌델렌버그 자세, 엎드린 자세, 고관절 90도 이상 굴곡, 목 굴곡·회전은 피한다 (정맥 배출 방해 → ICP 상승)","흡인은 꼭 필요할 때만, 짧게(1회 10초 이내), 흡인 전후 산소를 충분히 준다","저장성 수액(예: 5% 포도당액)은 뇌부종을 악화시킬 수 있어 피한다","만니톨은 결정이 생길 수 있으므로 필터를 사용하고 결정이 보이면 투여하지 않는다","간호 활동을 한꺼번에 몰아서 하지 않는다 (연속 자극은 ICP를 올린다)","의식수준이 떨어지거나 동공이 바뀌면 즉시 보고한다"],"nursing":["침상머리를 30도로 올리고 머리·목을 일직선(중립)으로 유지한다 → 정맥 배출 촉진","의식수준(GCS), 동공 크기·반응, 운동 기능, 활력징후를 자주 사정하고 기록한다","기침, 배변 시 힘주기(발살바), 등척성 운동을 피하게 한다 → 필요 시 처방에 따라 변완화제","기도 개방과 산소화를 유지하고 PaO₂·PaCO₂를 확인한다","고열은 뇌대사를 늘리므로 처방에 따라 해열제·냉요법으로 정상 체온을 유지한다 (떨림은 ICP를 올리므로 주의)","통증·불안을 줄이고 조용한 환경을 만든다","경련을 관찰하고 처방에 따라 항경련제를 투여한다","삼투성 이뇨제 투여 시: 섭취량·배설량(I/O), 혈청 삼투압·전해질, 탈수·저혈압 증상을 관찰한다","유치도뇨관이 있으면 시간당 소변량을 확인한다","처방된 수액 속도를 지키고 수분 과부하를 피한다"],"videos":[{"label":"두개내압 상승 간호","query":"두개내압 상승 간호"},{"label":"쿠싱 3징후 설명","query":"쿠싱 3징후 두개내압"},{"label":"GCS 사정 방법","query":"GCS 글래스고 혼수척도 간호 사정"}],"quiz":[{"q":"두개내압 상승 환자에게서 가장 먼저 나타나는 징후는?","options":["서맥","동공 고정","의식수준 변화","제뇌 자세","불규칙한 호흡"],"answer":2,"explain":"의식수준 변화(안절부절, 혼돈, 기면)가 가장 초기이고 민감한 징후이다. 서맥과 불규칙한 호흡은 쿠싱 3징후로 후기 징후이며, 동공 고정과 제뇌 자세도 뇌탈출이 진행된 후기에 나타난다."},{"q":"혈압 130/70 mmHg, 두개내압 25 mmHg인 환자의 뇌관류압(CPP)은?","options":["65 mmHg","45 mmHg","90 mmHg","105 mmHg","40 mmHg"],"answer":0,"explain":"MAP = (130 + 2×70) ÷ 3 = 90 mmHg이고, CPP = MAP − ICP = 90 − 25 = 65 mmHg이다. 90은 MAP 값이고, 105는 수축기압에서 ICP를 뺀 잘못된 계산이다."},{"q":"쿠싱 3징후(Cushing's triad)에 해당하는 것은?","options":["저혈압, 빈맥, 빈호흡","저혈압, 서맥, 경정맥 확장","고혈압, 빈맥, 고열","수축기압 상승(맥압 증가), 서맥, 불규칙한 호흡","맥압 감소, 빈맥, 쿠스마울 호흡"],"answer":3,"explain":"쿠싱 3징후는 수축기압 상승과 맥압 증가, 서맥, 불규칙한 호흡으로 IICP의 후기 징후이다. 저혈압·빈맥·빈호흡은 쇼크, 저혈압·경정맥 확장은 심낭압전(벡 3징후 일부), 쿠스마울 호흡은 대사성 산증과 관련된다."},{"q":"두개내압 상승 환자의 간호중재로 옳은 것은?","options":["트렌델렌버그 자세를 취해 준다","침상머리를 30도 올리고 머리와 목을 일직선으로 유지한다","기도 분비물을 자주, 길게 흡인한다","배변 시 힘을 주도록 격려한다","고관절을 90도 이상 굴곡시킨다"],"answer":1,"explain":"침상머리 30도와 경부 중립은 뇌정맥 배출을 도와 ICP를 낮춘다. 트렌델렌버그 자세, 잦고 긴 흡인, 발살바 수기, 고관절 과굴곡은 모두 흉강·복강 내압이나 정맥압을 올려 ICP를 상승시킨다."},{"q":"만니톨을 투여 중인 두개내압 상승 환자에게 우선 관찰해야 할 것은?","options":["혈당","섭취량·배설량과 전해질","간기능 수치","혈소판 수","갑상샘 호르몬"],"answer":1,"explain":"만니톨은 삼투성 이뇨제로 소변량이 크게 늘어 탈수, 저혈압, 전해질 불균형이 생길 수 있으므로 I/O, 혈청 삼투압, 전해질을 관찰한다. 나머지는 만니톨의 주된 부작용과 직접 관련이 적다."},{"q":"GCS 점수가 7점인 두부손상 환자에게 우선적으로 고려해야 하는 것은?","options":["경구 수분 섭취 격려","조기 보행","요추천자 준비","침상머리를 내리고 다리 거상","기도 확보(기관 내 삽관) 준비"],"answer":4,"explain":"GCS 8점 이하는 중증 의식 저하로 스스로 기도를 유지하기 어려워 기관 내 삽관을 고려한다. 의식 저하 환자에게 경구 섭취는 흡인 위험이 있고, 요추천자는 뇌탈출 위험으로 금기이며, 머리를 낮추면 ICP가 오른다."}]},{"id":"shock","subject":"성인간호학","kind":"개념","title":"쇼크","en":"Shock","tags":["순환기계","응급","중환자"],"summary":"쇼크는 조직에 혈액(산소와 영양)이 충분히 공급되지 못해 세포 대사가 무너지는 상태이다. 원인에 따라 저혈량성, 심인성, 분포성(패혈성·아나필락시스·신경성), 폐쇄성으로 나눈다. 빨리 알아차려 원인을 교정하고 조직 관류를 회복시키는 것이 핵심이다.","numbers":[{"label":"목표 평균동맥압 (MAP)","value":"65 mmHg 이상"},{"label":"적정 소변량 (성인)","value":"0.5 mL/kg/시간 이상 (약 30 mL/시간 이상)"},{"label":"평균동맥압 계산","value":"(수축기압 + 2 × 이완기압) ÷ 3"},{"label":"모세혈관 재충혈 시간","value":"2초 이내가 정상 (지연되면 말초 관류 저하)"},{"label":"패혈성 쇼크 초기 수액","value":"저혈압 또는 젖산 4 mmol/L 이상이면 결정질 수액 30 mL/kg (처방·기관 지침에 따라)"}],"sections":[{"h":"유형과 원인","items":["저혈량성 쇼크: 순환 혈액량 감소 — 출혈(외상, 위장관 출혈), 체액 손실(구토, 설사, 화상, 다뇨)","심인성 쇼크: 심장의 펌프 기능 저하 — 심근경색(가장 흔함), 심한 부정맥, 심근병증, 판막 질환","분포성 쇼크 – 패혈성: 감염에 대한 전신 반응으로 혈관 확장·모세혈관 투과성 증가","분포성 쇼크 – 아나필락시스: 알레르기 항원(약물, 음식, 벌독 등)에 의한 급성 과민 반응으로 혈관 확장, 기관지 수축, 후두 부종","분포성 쇼크 – 신경성: 척수 손상(주로 T6 이상), 척추 마취 등으로 교감신경 차단 → 혈관 확장과 서맥","폐쇄성 쇼크: 혈류가 물리적으로 막힘 — 긴장성 기흉, 심낭압전, 대량 폐색전증"]},{"h":"단계","items":["초기 단계: 세포 수준의 대사 변화, 겉으로 드러나는 증상은 거의 없음 (교재에 따라 보상기에 포함)","보상 단계: 교감신경·레닌-안지오텐신·ADH가 작동해 혈압을 정상 가까이 유지 — 빈맥, 빈호흡, 피부 창백·차가움(신경성·초기 패혈성 제외), 소변량 감소, 불안·안절부절","진행 단계: 보상이 실패해 혈압이 떨어짐 — 저혈압, 의식 저하, 대사성 산증(젖산 증가), 핍뇨, 장기 기능 저하 시작","비가역 단계: 치료에 반응하지 않는 심한 저혈압, 다발성 장기부전(MODS) → 사망 위험"]},{"h":"유형별 특징","items":["저혈량성: 중심정맥압(CVP) 낮음, 경정맥 납작, 빈맥, 차고 축축한 피부","심인성: 폐울혈(수포음, 호흡곤란), 경정맥 확장, CVP 상승 가능, 심박출량 감소","패혈성: 초기에는 따뜻하고 붉은 피부·발열(고역동기), 진행하면 차가운 피부(저역동기), 젖산 상승","아나필락시스: 두드러기·가려움, 천명음, 후두 부종(쉰 목소리, 협착음), 혈관부종, 저혈압","신경성: 저혈압 + 서맥, 손상 아래 부위 피부가 따뜻하고 건조함 (다른 쇼크와 달리 빈맥이 없음)","폐쇄성: 긴장성 기흉(기관 편위, 한쪽 호흡음 소실), 심낭압전(벡 3징후: 저혈압, 경정맥 확장, 심음 감소)"]},{"h":"사정","items":["활력징후: 혈압, 맥압, 맥박(빈맥이 혈압 저하보다 먼저 나타나는 경우가 많음), 호흡, 체온, 산소포화도","의식수준 변화: 뇌관류 저하의 초기 징후 (불안, 안절부절 → 혼돈 → 기면)","피부: 색, 온도, 습도, 모세혈관 재충혈 시간","시간당 소변량: 신장 관류를 보여 주는 중요한 지표","검사: 동맥혈가스분석, 혈청 젖산, 전해질, 혈색소·헤마토크릿, 혈액배양(패혈성 의심 시), 심근효소","혈역학 감시: 중심정맥압, 동맥압, 필요 시 심박출량 (기관 지침에 따라)"]},{"h":"치료 개요","items":["산소 공급과 기도 유지, 필요 시 기계 환기","수액 소생: 저혈량성·분포성에서 결정질 수액(생리식염수, 링거젖산액) 등, 출혈이면 수혈","혈관수축제: 수액 후에도 저혈압이 지속되면 처방에 따라 노르에피네프린 등","심인성: 수액은 신중히, 강심제(도부타민 등), 원인 교정(관상동맥 재개통), 필요 시 대동맥 내 풍선 펌프(IABP)","패혈성: 항생제 투여 전에 혈액배양 채취, 처방된 항생제를 신속히 투여","아나필락시스: 원인 물질 즉시 중단, 처방에 따라 에피네프린 근육주사(대퇴 전외측), 기도 확보","폐쇄성: 원인 해결 — 흉관 삽입·바늘 감압(긴장성 기흉), 심낭천자(심낭압전), 혈전용해(폐색전증)"]}],"steps":[],"cautions":["체위: 다리만 들어 올리는 변형 트렌델렌버그 자세(머리는 수평 또는 약간 올림)를 취한다. 전형적인 트렌델렌버그(머리 낮춤)는 호흡을 방해하고 ICP를 올릴 수 있어 권장하지 않는다","심인성 쇼크나 폐부종이 있으면 다리 거상과 대량 수액이 심장 부담을 늘리므로 주의한다","혈관수축제는 가능하면 중심정맥관으로 주입하고, 일혈(혈관 밖 누출) 시 조직 괴사 위험이 있어 즉시 주입을 멈추고 보고한다 (노르에피네프린 일혈 시 처방에 따라 펜톨아민)","혈관수축제는 반드시 수액 펌프로 정확히 주입하고 갑자기 중단하지 않는다","혈관수축제는 혈압을 올려도 말초·장기 관류를 떨어뜨릴 수 있으므로 소변량, 말초 순환, 의식을 함께 본다","쇼크 환자에게 보온은 하되 외부에서 과도하게 데우지 않는다 (말초혈관 확장으로 혈압 저하 가능)","의식이 저하된 환자에게 경구 섭취를 하지 않는다 (흡인 위험)"],"nursing":["기도 유지와 산소 공급, 산소포화도·동맥혈가스 확인","굵은 바늘로 정맥로 2개 이상 확보하고 처방된 수액·혈액을 투여한다","수액 투여 중 수분 과부하 징후(수포음, 호흡곤란, 경정맥 확장)를 관찰한다","활력징후와 의식수준을 자주 측정하고 추세를 기록한다","유치도뇨관으로 시간당 소변량을 측정한다 (0.5 mL/kg/시간 미만이면 보고)","체위: 다리를 들어 올리는 변형 트렌델렌버그 자세 (심인성 제외)","혈관수축제 투여 시 혈압을 자주 측정하고 주입 부위를 관찰한다","체온 유지, 불필요한 활동을 줄여 산소 소모를 줄인다","패혈성 쇼크: 감염 원인 사정, 손위생과 무균술 철저, 혈액배양 후 항생제 투여","환자와 가족의 불안을 줄이기 위해 상황을 쉽게 설명한다"],"videos":[{"label":"쇼크 종류와 간호","query":"쇼크 종류 간호 국가고시"},{"label":"패혈성 쇼크","query":"패혈성 쇼크 간호중재"},{"label":"아나필락시스 응급처치","query":"아나필락시스 쇼크 에피네프린 간호"}],"quiz":[{"q":"척수손상(T4) 환자에게 저혈압과 함께 서맥이 나타나고 손상 부위 아래 피부가 따뜻하고 건조하다. 의심되는 쇼크는?","options":["저혈량성 쇼크","심인성 쇼크","아나필락시스 쇼크","신경성 쇼크","폐쇄성 쇼크"],"answer":3,"explain":"신경성 쇼크는 교감신경이 차단되어 혈관이 확장되고 부교감 우세로 서맥이 생기며, 피부는 따뜻하고 건조하다. 저혈량성·심인성 쇼크는 보상성 빈맥과 차고 축축한 피부가 특징이다."},{"q":"쇼크 환자의 신장 관류 상태를 평가하는 데 가장 유용한 지표는?","options":["시간당 소변량","체온","혈당","동공 반응","장음"],"answer":0,"explain":"신장 관류가 떨어지면 소변량이 줄기 때문에 시간당 소변량(성인 0.5 mL/kg/시간 이상)은 장기 관류를 보여 주는 중요한 지표이다. 나머지는 신장 관류를 직접 반영하지 않는다."},{"q":"저혈량성 쇼크 환자에게 권장되는 체위는?","options":["좌위","머리를 낮춘 전형적인 트렌델렌버그 자세","복위","반좌위","머리는 수평으로 두고 다리만 들어 올린 자세"],"answer":4,"explain":"다리만 들어 올리는 변형 트렌델렌버그 자세는 하지 정맥혈을 심장으로 돌려보내면서 호흡을 방해하지 않는다. 머리를 낮추는 전형적인 트렌델렌버그 자세는 횡격막을 눌러 호흡을 방해하고 ICP를 올릴 수 있어 권장하지 않는다."},{"q":"노르에피네프린을 말초 정맥으로 주입하던 중 주입 부위가 창백하고 차가워졌다. 우선적인 간호중재는?","options":["주입 속도를 높인다","주입을 즉시 멈추고 보고한다","주입 부위를 마사지한다","온찜질 후 계속 주입한다","다음 근무조에 인계한다"],"answer":1,"explain":"혈관수축제가 혈관 밖으로 새면(일혈) 조직 괴사가 생길 수 있으므로 즉시 주입을 멈추고 보고하며, 처방에 따라 펜톨아민을 국소 주입할 수 있다. 계속 주입하거나 마사지하면 손상이 커진다."},{"q":"패혈성 쇼크가 의심되는 환자에게 항생제를 투여하기 전에 먼저 해야 하는 것은?","options":["혈액배양 검체 채취","흉부 X선 촬영","해열제 투여","유치도뇨관 제거","금식 해제"],"answer":0,"explain":"항생제를 먼저 주면 배양에서 균이 자라지 않을 수 있으므로, 항생제 투여를 늦추지 않는 범위에서 혈액배양을 먼저 채취한다. 나머지는 항생제 투여 전 필수 단계가 아니다."},{"q":"급성 심근경색 후 저혈압, 수포음, 경정맥 확장이 나타난 환자의 간호로 옳지 않은 것은?","options":["산소를 공급한다","처방에 따라 강심제를 투여한다","폐울혈 징후를 관찰한다","대량의 수액을 빠르게 주입한다","시간당 소변량을 측정한다"],"answer":3,"explain":"심인성 쇼크는 심장 펌프 기능이 떨어진 상태라 대량 수액은 폐울혈과 심장 부담을 악화시킨다. 산소 공급, 강심제, 폐울혈 관찰, 소변량 측정은 적절한 간호이다."},{"q":"쇼크의 보상 단계에서 나타나는 반응으로 옳은 것은?","options":["서맥","소변량 증가","빈맥과 말초혈관 수축","치료에 반응하지 않는 저혈압","다발성 장기부전"],"answer":2,"explain":"보상 단계에서는 교감신경이 활성화되어 빈맥, 말초혈관 수축(창백하고 차가운 피부), 소변량 감소로 혈압을 유지한다. 치료에 반응하지 않는 저혈압과 다발성 장기부전은 비가역 단계의 특징이다."}]},{"id":"peds-dehydration","subject":"아동간호학","kind":"개념","title":"아동 탈수","en":"Dehydration in children","tags":["수분전해질","설사","구토","경구수액요법"],"summary":"아동은 체중에 비해 체표면적이 넓고, 세포외액 비율이 높으며, 신장의 농축 능력이 미숙해 성인보다 탈수가 빨리 온다. 체중 감소율과 임상 증상으로 정도를 판단하고, 혈청 나트륨으로 유형을 나눈다. 경증~중등도는 경구수액요법(ORS), 중증은 정맥 수액으로 치료한다.","numbers":[{"label":"경증 탈수 (체중 감소)","value":"영아 약 3~5%, 큰 아동 약 3%"},{"label":"중등도 탈수 (체중 감소)","value":"영아 약 6~9%, 큰 아동 약 6%"},{"label":"중증 탈수 (체중 감소)","value":"영아 약 10% 이상, 큰 아동 약 9% 이상"},{"label":"등장성 탈수 (혈청 Na)","value":"130~150 mEq/L"},{"label":"저장성 탈수 (혈청 Na)","value":"130 mEq/L 미만"},{"label":"고장성 탈수 (혈청 Na)","value":"150 mEq/L 초과"},{"label":"정상 소변량","value":"영아·걸음마기 약 2~3 mL/kg/시간, 학령전기~학령 초기 약 1~2 mL/kg/시간, 학령기·청소년 약 0.5~1 mL/kg/시간"},{"label":"ORS 양 (흔히 쓰는 기준)","value":"경증 50 mL/kg, 중등도 100 mL/kg을 약 4시간 동안 + 지속 손실 보충"},{"label":"중증 탈수 정맥 볼루스","value":"등장성 결정질액(생리식염수·젖산링거액) 20 mL/kg (처방에 따름)"},{"label":"체중과 수분","value":"체중 1 kg 감소 ≈ 수분 약 1 L 손실, 기저귀 1 g ≈ 소변 1 mL"}],"sections":[{"h":"아동이 탈수에 취약한 이유","items":["체중에 비해 체표면적이 넓어 피부로 잃는 수분(불감손실)이 많다.","총 체액 중 세포외액 비율이 높아 빨리 잃는다.","대사율이 높아 수분 필요량이 많다.","신장이 미숙해 소변을 농축하지 못한다.","목마름을 스스로 표현하거나 물을 찾아 마시기 어렵다."]},{"h":"정도별 사정 지표","items":["경증: 맥박·혈압 정상, 의식 정상(목마름, 약간 보챔), 점막 약간 건조, 눈물 있음, 피부 탄력 정상, 모세혈관 재충혈 정상(2초 이내), 소변량 약간 감소.","중등도: 빈맥, 혈압은 대개 정상, 보챔·기면, 점막 건조, 눈물 감소, 눈과 대천문 함몰, 피부 탄력 감소, 모세혈관 재충혈 지연(약 2~3초), 소변량 감소(핍뇨).","중증: 심한 빈맥, 약하거나 잘 만져지지 않는 맥박, 저혈압(후기), 기면~혼수, 점막 바짝 마름, 눈물 없음, 눈과 대천문 깊이 함몰, 피부가 차고 얼룩덜룩함, 피부 탄력 매우 감소(텐트 모양), 모세혈관 재충혈 3초 이상, 무뇨 또는 심한 핍뇨 → 저혈량 쇼크.","아동은 보상 능력이 좋아 혈압이 늦게 떨어진다. 저혈압은 후기 징후이므로 빈맥·모세혈관 재충혈 지연·소변량 감소를 먼저 본다."]},{"h":"유형 (혈청 나트륨 기준)","items":["등장성 탈수: 수분과 나트륨을 비슷한 비율로 잃는다. 가장 흔하며 주로 세포외액이 줄어 저혈량 쇼크 위험이 있다.","저장성 탈수: 수분보다 나트륨을 더 많이 잃는다. 수분이 세포외액에서 세포 안으로 이동해 세포외액이 더 줄어들므로, 같은 수분 손실에도 쇼크가 더 잘 생긴다.","고장성 탈수: 나트륨보다 수분을 더 많이 잃는다. 수분이 세포 밖으로 빠져나가 세포가 쭈그러들고, 신경계 증상(보챔, 고음의 울음, 기면, 경련)이 나타날 수 있다. 세포외액은 상대적으로 유지되어 쇼크 증상은 늦게 나타나 탈수 정도를 과소평가하기 쉽다.","고장성 탈수는 수분을 너무 빨리 교정하면 뇌부종·경련이 생길 수 있어 천천히(대개 48시간 정도에 걸쳐, 처방에 따라) 교정한다."]},{"h":"경구수액요법 (ORS) 원칙","items":["경증~중등도 탈수의 1차 치료이다.","포도당과 나트륨이 적절한 비율로 들어 있는 상품화된 경구수액(ORS)을 사용한다.","티스푼·주사기·컵으로 조금씩 자주 준다(예: 1~2분마다 5 mL 정도). 구토가 있어도 소량씩 계속 시도한다.","결핍량 보충(경증 약 50 mL/kg, 중등도 약 100 mL/kg을 약 4시간 동안)에 더해, 설사·구토로 계속 잃는 양을 보충한다.","주스, 탄산음료, 스포츠음료, 맹물만 주기 등은 당이 많고 전해질이 맞지 않아 설사를 악화시키거나 전해질 불균형을 일으킬 수 있으므로 피한다.","모유수유 아기는 수유를 계속한다.","수분이 보충되면 연령에 맞는 평소 식이를 일찍 다시 시작한다. 바나나·쌀·사과소스·토스트(BRAT)만 먹이는 식이는 영양이 부족해 권장하지 않는다."]},{"h":"정맥 수액 시 간호","items":["중증 탈수, 쇼크, 계속되는 구토로 ORS를 못 먹을 때, 의식 저하 시 정맥 수액을 준다.","주입 펌프로 처방된 속도를 정확하게 유지하고, 1시간마다 주입량과 주사 부위를 확인한다.","칼륨은 소변이 나오는 것을 확인한 뒤에 수액에 섞는다(고칼륨혈증 예방).","주사 부위의 침윤(부종, 차가움, 창백함)과 정맥염을 관찰하고, 아동이 빼지 않도록 고정·보호한다.","수분 과다 징후(부종, 수포음, 호흡곤란, 체중 급증)를 관찰한다."]},{"h":"체중 측정과 섭취·배설량(I/O)","items":["체중은 탈수 정도를 판단하는 가장 좋은 지표이다. 매일 같은 시간, 같은 저울, 같은 옷 상태(영아는 옷과 기저귀를 벗기고)에서 잰다.","섭취량: 경구 섭취와 정맥 수액을 모두 기록한다.","배설량: 소변, 설사, 구토의 양·횟수·성상을 기록한다. 기저귀는 사용 전후 무게를 재서 차이(1 g ≈ 1 mL)로 계산한다.","소변 비중 상승과 소변량 감소는 탈수가 지속됨을 뜻한다."]}],"steps":[],"cautions":["저혈압이 나타날 때까지 기다리지 않는다. 빈맥, 모세혈관 재충혈 지연, 소변량 감소를 일찍 발견한다.","고장성 탈수는 빠른 수분 교정 시 뇌부종·경련 위험이 있다.","소변 배출을 확인하기 전에는 칼륨을 투여하지 않는다.","지사제는 아동에게 일반적으로 권장하지 않으며, 처방 없이 쓰지 않는다.","설사 아동은 기저귀 피부염이 생기기 쉬우므로 자주 갈고 피부를 깨끗하고 건조하게 유지한다."],"nursing":["활력징후, 의식, 대천문, 점막, 눈물, 피부 탄력, 모세혈관 재충혈, 소변량을 자주 사정한다.","매일 체중을 재고 섭취·배설량을 정확히 기록한다.","처방에 따라 ORS를 조금씩 자주 주거나 정맥 수액을 정확한 속도로 주입한다.","전해질(Na, K) 등 검사 결과를 확인한다.","감염성 설사가 의심되면 접촉 주의와 손위생을 철저히 한다.","구강 간호로 점막 건조를 줄이고, 기저귀 부위 피부를 보호한다."],"videos":[{"label":"아동 탈수 사정","query":"아동 탈수 정도 사정 간호"},{"label":"경구수액요법","query":"소아 경구수액요법 ORS 방법"},{"label":"탈수 유형","query":"등장성 저장성 고장성 탈수 아동간호학"}],"quiz":[{"q":"설사로 입원한 10개월 영아의 탈수 정도를 판단하는 데 가장 정확한 지표는?","options":["체온","체중 변화","울음소리 크기","혈압","식욕"],"answer":1,"explain":"체중 감소율이 탈수 정도를 판단하는 가장 좋은 지표이다(체중 1 kg 감소 ≈ 수분 약 1 L). 아동은 혈압이 늦게 떨어지므로 혈압은 초기 지표로 적합하지 않다."},{"q":"아동의 탈수에서 혈청 나트륨이 155 mEq/L이었다. 이 유형의 특징으로 옳은 것은?","options":["가장 흔한 유형이다","수분이 세포 안으로 이동해 쇼크가 빨리 온다","경련 등 신경계 증상이 나타날 수 있다","수분을 가능한 한 빠르게 교정한다","나트륨을 수분보다 더 많이 잃은 상태이다"],"answer":2,"explain":"Na 150 mEq/L 초과는 고장성 탈수로, 수분이 세포 밖으로 빠져 세포가 탈수되어 보챔·경련 등 신경계 증상이 나타날 수 있다. 빠른 교정은 뇌부종을 일으키므로 천천히 교정한다. 가장 흔한 것은 등장성, 나트륨을 더 많이 잃는 것은 저장성이다."},{"q":"경증 탈수 아동의 부모에게 경구수액요법을 교육한 내용으로 옳은 것은?","options":["경구수액 대신 이온음료를 먹인다","구토하면 24시간 동안 모든 수분을 금한다","티스푼이나 주사기로 조금씩 자주 먹인다","모유수유는 설사가 멈출 때까지 중단한다","회복될 때까지 BRAT 식이만 먹인다"],"answer":2,"explain":"ORS는 소량씩 자주 주며, 구토가 있어도 소량씩 계속 시도한다. 이온음료·주스는 당과 전해질 비율이 맞지 않고, 모유수유는 계속하며, 수분 보충 후 연령에 맞는 평소 식이를 일찍 시작한다."},{"q":"중증 탈수로 정맥 수액을 맞는 아동에게 칼륨을 첨가하기 전 간호사가 반드시 확인해야 할 것은?","options":["체온","소변 배출","대천문 크기","혈당","피부 탄력"],"answer":1,"explain":"신장 기능이 확인되지 않은 상태에서 칼륨을 주면 배설되지 않아 고칼륨혈증(부정맥) 위험이 있으므로, 소변이 나오는 것을 확인한 뒤 첨가한다."},{"q":"중증 탈수 영아에게서 나타날 수 있는 사정 결과는?","options":["모세혈관 재충혈 시간 1초","촉촉한 구강 점막","평평한 대천문","차고 얼룩덜룩한 피부와 약한 맥박","정상 소변량"],"answer":3,"explain":"중증 탈수는 저혈량 쇼크 징후로 차고 얼룩덜룩한 피부, 약한 맥박, 심한 빈맥, 모세혈관 재충혈 3초 이상, 대천문 함몰, 무뇨·핍뇨가 나타난다."},{"q":"탈수 영아의 섭취·배설량 측정 방법으로 옳은 것은?","options":["기저귀를 갈 때 젖은 정도를 눈으로만 보고 기록한다","사용 전후 기저귀 무게 차이를 재서 1 g을 1 mL로 계산한다","정맥 수액은 섭취량에 포함하지 않는다","체중은 옷을 입힌 채 아무 저울로나 잰다","구토량은 배설량에 포함하지 않는다"],"answer":1,"explain":"기저귀 무게 차이 1 g은 소변 약 1 mL로 계산한다. 정맥 수액은 섭취량에, 구토·설사는 배설량에 포함하며, 체중은 같은 시간·같은 저울·옷을 벗긴 상태에서 잰다."}]}];
</script>
<script>
// 간호 공부방: 개념·술기 읽기 + 문제로 점검. 내용은 content/*.json → build.py → window.TOPICS
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var TOPICS = (window.TOPICS || []).slice();
  var BY = {}; TOPICS.forEach(function (t) { BY[t.id] = t; });
  // 과목마다 은은한 네온 색 (목록 왼쪽 줄 · 아이콘 테두리 · 요약 카드)
  var SUBJECTS = [['기본간호학', '🩺', '#4de1ff'], ['기본간호술기', '🧤', '#4dffb0'], ['성인간호학', '🫀', '#ff5c8a'], ['아동간호학', '🧸', '#ffd24d'], ['모성간호학', '🤰', '#ff7ad9'], ['정신간호학', '🧠', '#a98bff'], ['지역사회간호학', '🏘️', '#8cff5a'], ['간호관리학', '📋', '#ff9f4d']];
  var EMOJI = {}, COLOR = {}; SUBJECTS.forEach(function (s) { EMOJI[s[0]] = s[1]; COLOR[s[0]] = s[2]; });
  var ISSUE = 'https://github.com/edwinedwin0716-sketch/nurse_ai/issues/new';

  // ---------- 저장 ----------
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem('ns_' + k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem('ns_' + k, JSON.stringify(v)); } catch (e) { } }
  var stars = load('star', []), wrong = load('wrong', {}), recent = load('recent', []), seen = load('seen', {});

  function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function qid(t, i) { return t.id + '#' + i; }
  function allQ() { var a = []; TOPICS.forEach(function (t) { (t.quiz || []).forEach(function (q, i) { a.push({ t: t, i: i, q: q }); }); }); return a; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function issueUrl(title, body) { return ISSUE + '?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body); }

  // ---------- 화면 이동 ----------
  var stack = [];
  window.go = function (id, mode) {   // mode: true = 뒤로 가기 기록에 넣기, 'back' = 뒤로 가는 중, 없음 = 처음부터
    var cur = document.querySelector('.view.on');
    if (mode === true) { if (cur && cur.id !== id) stack.push(cur.id); } else if (mode !== 'back') stack = [];
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('on', v.id === id); });
    window.scrollTo(0, 0);
    if (id === 'v-home') renderHome();
  };
  window.back = function () { var p = stack.pop(); if (p) go(p, 'back'); else go('v-home'); return true; };
  // 안드로이드 뒤로 가기
  window.onBack = function () { if ($('v-home').classList.contains('on')) return false; if ($('v-quiz').classList.contains('on')) { quitQuiz(); return true; } back(); return true; };

  function bindSeg(id, fn) {
    document.querySelectorAll('#' + id + ' button').forEach(function (b) {
      b.addEventListener('click', function () { document.querySelectorAll('#' + id + ' button').forEach(function (x) { x.classList.toggle('on', x === b); }); if (fn) fn(b.getAttribute('data-v')); });
    });
  }
  function segVal(id) { return document.querySelector('#' + id + ' .on').getAttribute('data-v'); }
  function setSeg(id, v) { document.querySelectorAll('#' + id + ' button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === v); }); }

  // ---------- 홈 ----------
  function topicRow(t) {
    var n = (t.quiz || []).length;
    return '<button class="row" style="--c:' + (COLOR[t.subject] || '#5ab8ff') + '" data-id="' + esc(t.id) + '"><span class="em">' + (EMOJI[t.subject] || '📘') + '</span><span class="info"><b>' + esc(t.title) + '</b><small>' +
      esc(t.subject) + (n ? ' · 문제 ' + n : '') + (t.en ? ' · ' + esc(t.en) : '') + '</small></span>' +
      '<span class="pill ' + (t.kind === '술기' ? 'skill' : 'concept') + '">' + esc(t.kind) + '</span>' + (seen[t.id] ? '<span class="pill done">읽음</span>' : '') + '<span class="chev">›</span></button>';
  }
  function bindRows(box) { box.querySelectorAll('.row[data-id]').forEach(function (r) { r.onclick = function () { openTopic(r.getAttribute('data-id')); }; }); }

  function renderHome() {
    var qs = allQ().length, w = Object.keys(wrong).filter(function (k) { return BY[k.split('#')[0]]; }).length;
    $('qCount').textContent = '문제 ' + qs + '개'; $('wCount').textContent = w ? w + '문제 다시 풀기' : '아직 없어요';
    $('sCount').textContent = stars.length ? stars.length + '개 주제' : '☆를 눌러 모아요'; $('tCount').textContent = TOPICS.length + '개 주제';
    var rec = recent.filter(function (id) { return BY[id]; }).slice(0, 3);
    $('recentBox').innerHTML = rec.length ? '<div class="section">최근 본 주제</div><div class="card">' + rec.map(function (id) { return topicRow(BY[id]); }).join('') + '</div>' : '';
    bindRows($('recentBox'));
    var h = '';
    SUBJECTS.forEach(function (s) {
      var list = TOPICS.filter(function (t) { return t.subject === s[0]; });
      if (!list.length) return;
      var c = list.filter(function (t) { return t.kind === '개념'; }).length;
      h += '<button class="row" style="--c:' + s[2] + '" data-s="' + esc(s[0]) + '"><span class="em">' + s[1] + '</span><span class="info"><b>' + esc(s[0]) + '</b><small>' +
        (c ? '개념 ' + c : '') + (c && list.length - c ? ' · ' : '') + (list.length - c ? '술기 ' + (list.length - c) : '') + '</small></span><span class="chev">›</span></button>';
    });
    $('subjects').innerHTML = h || '<div class="empty">아직 내용이 없어요</div>';
    $('subjects').querySelectorAll('.row').forEach(function (r) { r.onclick = function () { openList(r.getAttribute('data-s')); }; });
  }

  // 찾기: 제목·영문·태그·설명 전체
  function hay(t) {
    return [t.title, t.en, t.subject, (t.tags || []).join(' '), t.summary, (t.sections || []).map(function (s) { return s.h + ' ' + (s.text || '') + ' ' + (s.items || []).join(' '); }).join(' '),
      (t.steps || []).map(function (s) { return s.do; }).join(' '), (t.nursing || []).join(' ')].join(' ').toLowerCase();
  }
  $('q').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    $('homeMain').style.display = q ? 'none' : '';
    if (!q) { $('results').innerHTML = ''; return; }
    var words = q.split(/\s+/);
    var hits = TOPICS.map(function (t) {
      var title = (t.title + ' ' + t.en + ' ' + (t.tags || []).join(' ')).toLowerCase(), all = hay(t), score = 0;
      for (var i = 0; i < words.length; i++) { if (title.indexOf(words[i]) >= 0) score += 3; else if (all.indexOf(words[i]) >= 0) score += 1; else return null; }
      return { t: t, s: score };
    }).filter(Boolean).sort(function (a, b) { return b.s - a.s; });
    $('results').innerHTML = '<div class="section">찾은 주제 ' + hits.length + '개</div><div class="card">' + (hits.length ? hits.map(function (h) { return topicRow(h.t); }).join('') :
      '<div class="empty">아직 없는 내용이에요.<br><a target="_blank" rel="noopener" href="' + esc(issueUrl('[간호 공부방] 추가 요청: ' + this.value.trim(), '이 내용을 넣어 주세요: ' + this.value.trim())) + '">이 내용 넣어 달라고 요청하기</a></div>') + '</div>';
    bindRows($('results'));
  });

  // ---------- 목록 ----------
  var listSubj = '';
  window.openList = function (s) { listSubj = s; setSeg('kind', ''); renderList(); go('v-list', true); };
  function renderList() {
    var k = segVal('kind');
    $('listTitle').textContent = listSubj === '★' ? '⭐ 즐겨찾기' : listSubj ? (EMOJI[listSubj] || '') + ' ' + listSubj : '📚 전체 주제';
    var list = TOPICS.filter(function (t) { return (listSubj === '★' ? stars.indexOf(t.id) >= 0 : !listSubj || t.subject === listSubj) && (!k || t.kind === k); });
    $('list').innerHTML = list.length ? list.map(topicRow).join('') : '<div class="empty">' + (listSubj === '★' ? '주제 화면 오른쪽 위 ☆를 누르면 여기에 모여요' : '해당하는 주제가 없어요') + '</div>';
    bindRows($('list'));
  }
  bindSeg('kind', renderList);

  // ---------- 주제 ----------
  var cur = null, hideKey = false;
  window.openTopic = function (id) {
    cur = BY[id]; if (!cur) return;
    seen[id] = Date.now(); save('seen', seen);
    recent = [id].concat(recent.filter(function (x) { return x !== id; })).slice(0, 10); save('recent', recent);
    $('v-topic').style.setProperty('--c', COLOR[cur.subject] || '#5ab8ff');
    $('tTitle').textContent = cur.title; $('tEn').textContent = cur.en || '';
    $('tTags').innerHTML = '<span class="pill ' + (cur.kind === '술기' ? 'skill' : 'concept') + '">' + esc(cur.kind) + '</span><span class="tag">' + esc(cur.subject) + '</span>' + (cur.tags || []).map(function (x) { return '<span class="tag">#' + esc(x) + '</span>'; }).join('');
    $('tSummary').textContent = cur.summary || '';
    var hasSteps = (cur.steps || []).length > 0;
    document.querySelector('#ttab [data-v="steps"]').style.display = hasSteps ? '' : 'none';
    document.querySelector('#ttab [data-v="quiz"]').textContent = '문제 ' + (cur.quiz || []).length;
    setSeg('ttab', 'learn'); hideKey = false; renderTopic();
