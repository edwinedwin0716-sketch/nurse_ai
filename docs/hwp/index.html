<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HWP 편집기</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HWP편집기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* 안드로이드 앱에 넣은 나눔명조(OFL). 웹·PC에선 파일이 없어서 기기 글꼴을 쓴다 */
:root {
  --bar: #f3f4f6; --bar2: #ffffff; --line: #d5d8dd; --text: #1f2328; --sub: #5d6470; --accent: #2563c9; --accent-soft: #e3ecfb;
  --desk: #8b9099; --hover: #e8ebef; --press: #d9e3f3; --danger: #c62828;
  --font-ui: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bar: #24272c; --bar2: #2b2f35; --line: #3a3f47; --text: #e7e9ec; --sub: #a3a9b3; --accent: #6ea2ff; --accent-soft: #24365a; --desk: #191b1f; --hover: #343a42; --press: #2f4466; }
}
:root[data-theme="dark"] { --bar: #24272c; --bar2: #2b2f35; --line: #3a3f47; --text: #e7e9ec; --sub: #a3a9b3; --accent: #6ea2ff; --accent-soft: #24365a; --desk: #191b1f; --hover: #343a42; --press: #2f4466; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bar); color: var(--text); font: 13px/1.35 var(--font-ui); -webkit-text-size-adjust: 100%; }
button, select, input, textarea { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100%; }

/* 제목 표시줄 */
#titlebar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bar2); border-bottom: 1px solid var(--line); min-height: 38px; padding-top: max(4px, env(safe-area-inset-top)); }
#titlebar .logo { width: 22px; height: 22px; flex: none; }
#title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
#title small { font-weight: 400; color: var(--sub); margin-left: 4px; }
.qbtn { border: 0; background: none; border-radius: 6px; height: 30px; min-width: 30px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.qbtn:hover { background: var(--hover); }
.qbtn:active { background: var(--press); }
.qbtn svg { width: 18px; height: 18px; }
#modeBtn { border: 1px solid var(--line); padding: 0 10px; }
#modeBtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* 보기 모드 안내 막대 */
#viewbar { display: none; align-items: center; gap: 8px; padding: 6px 10px; background: #fff7d6; color: #5a4300; border-bottom: 1px solid #ecd98a; font-size: 13px; }
.ro #viewbar { display: flex; }
#viewbar span { flex: 1; min-width: 0; }
#viewbar button { border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
#viewbar .vb-main { background: var(--accent); color: #fff; }
#viewbar .vb-sub { background: transparent; color: #5a4300; text-decoration: underline; font-weight: 500; padding: 6px 4px; }

/* 메뉴 탭 + 도구 상자(리본) */
#menus { display: flex; gap: 2px; padding: 2px 6px 0; background: var(--bar2); overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
#menus::-webkit-scrollbar { display: none; }
.menu { flex: none; border: 0; background: none; padding: 6px 11px 7px; border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; position: relative; }
.menu:hover { background: var(--hover); }
.menu.on { color: var(--accent); font-weight: 600; }
.menu.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px; border-radius: 2px; background: var(--accent); }
.menu.ctx { color: #b25e00; }
#ribbon { display: flex; align-items: stretch; gap: 2px; padding: 4px 6px; background: var(--bar); border-bottom: 1px solid var(--line); overflow-x: auto; min-height: 66px; scrollbar-width: thin; }
.rgroup { display: flex; align-items: stretch; gap: 1px; padding-right: 6px; margin-right: 4px; border-right: 1px solid var(--line); flex: none; }
.rgroup:last-child { border-right: 0; }
.rbtn { border: 0; background: none; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 5px 6px 4px; min-width: 54px; max-width: 76px; cursor: pointer; font-size: 11.5px; line-height: 1.15; text-align: center; }
.rbtn:hover { background: var(--hover); }
.rbtn:active, .rbtn.on { background: var(--press); }
.rbtn svg { width: 26px; height: 26px; flex: none; }
.rbtn:disabled { opacity: .4; }

/* 서식 도구 상자 */
#fmtbar { display: flex; align-items: center; gap: 3px; padding: 3px 6px; background: var(--bar2); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
#fmtbar::-webkit-scrollbar { display: none; }
#fmtbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 3px; flex: none; }
#fmtbar select, #fmtbar input { height: 28px; border: 1px solid var(--line); border-radius: 5px; background: var(--bar2); padding: 0 4px; flex: none; }
#styleSel { width: 92px; } #fontSel { width: 132px; } #sizeIn { width: 48px; text-align: center; } #lsSel { width: 62px; }
.fbtn { border: 0; background: none; border-radius: 5px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; position: relative; }
.fbtn:hover { background: var(--hover); }
.fbtn.on { background: var(--press); color: var(--accent); }
.fbtn svg { width: 18px; height: 18px; }
.fbtn .swatch { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 4px; border-radius: 1px; }
.fbtn.drop { width: 16px; margin-left: -3px; font-size: 9px; }

/* 문서 화면 */
#view { flex: 1; overflow: auto; background: var(--desk); position: relative; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; }
#sizer { position: relative; margin: 0 auto; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.sheet { position: absolute; left: 0; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); color: #000; overflow: hidden; }
.mask { position: absolute; background: #fff; pointer-events: none; overflow: hidden; z-index: 2; }
.mask.gapm { background: var(--desk); }
#masks .hf, #masks .pgno { position: absolute; }
.mask .hf { overflow: hidden; font: 10pt/1.6 "함초롬바탕", "Noto Serif KR", serif; white-space: pre-wrap; color: #000; }
.mask .hf p { margin: 0; }
.mask .pgno { font: 10pt "함초롬바탕", "Noto Serif KR", serif; color: #000; white-space: nowrap; }
.pagegrid .sheet { cursor: pointer; }
.pagegrid .sheet:hover { outline: 3px solid var(--accent); }
.pcard { position: absolute; left: 0; overflow: hidden; pointer-events: none; }
.pcard .docclone { position: absolute; left: 0; }
.pgnum { position: absolute; left: 0; right: 0; text-align: center; font: 12px var(--font-ui); color: #fff; text-shadow: 0 1px 2px #0008; }
.sheet .hf { position: absolute; overflow: hidden; font: 10pt/1.6 "함초롬바탕", "Noto Serif KR", serif; white-space: pre-wrap; color: #000; }
.sheet .hf p { margin: 0; }
.sheet .guide { position: absolute; border: 1px dashed transparent; pointer-events: none; }
.show-guide .sheet .guide { border-color: #b8c4d6; }
.sheet .pgno { position: absolute; font: 10pt "함초롬바탕", "Noto Serif KR", serif; color: #000; white-space: nowrap; }
.sheet .notes { position: absolute; font: 9pt/1.5 "함초롬바탕", "Noto Serif KR", serif; color: #000; border-top: 0.5pt solid #000; padding-top: 3pt; }
.sheet .notes p { margin: 0; }

#doc { position: absolute; outline: none; color: #000; background: transparent; caret-color: #000;
  font: 10pt/1.6 "함초롬바탕", "HCR Batang", HwpSerif, AppleMyungjo, Batang, "Noto Serif KR", "Noto Serif CJK KR", serif; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; text-justify: inter-word;
  tab-size: 40pt; -moz-tab-size: 40pt; counter-reset: o1 o2 o3 o4 o5 o6 o7 fn en ln; }
#doc p { margin: 0; min-height: 1em; }
#doc table.tb { border-collapse: collapse; table-layout: fixed; margin: 0; }
#doc td table.tb, #doc th table.tb, #doc .box table.tb { table-layout: auto; max-width: 100%; }
#doc .pgap { pointer-events: none; }
#doc table.tb td { border: 0.12mm solid #000; padding: 0.5mm 1.8mm; vertical-align: middle; overflow-wrap: anywhere; }
/* 한글이 정한 줄 바꿈: 보기 모드에서만 쓴다 (편집할 땐 기기가 줄을 나눈다) */
#doc .hlb { display: none; }
#doc .pua { display: none; }
.hlines #doc .hlb { display: block; height: 0; }
.hlines #doc p:has(> .hlb):not([style*="text-align"]) { text-align-last: justify; }
.hlines #doc .hll { display: block; text-indent: 0; text-align-last: auto; }
#doc table.tb td.cellsel { background-image: linear-gradient(rgba(37, 99, 201, .28), rgba(37, 99, 201, .28)); }
#doc img { vertical-align: bottom; max-width: 100%; }
#doc img.picked { outline: 2px solid var(--accent); outline-offset: 1px; }
#doc .box { border: 0.12mm solid #000; padding: 0.5mm 1.8mm; margin: 2pt 0; }
#doc a { color: #00f; text-decoration: underline; }
#doc .fn { counter-increment: fn; color: #00f; cursor: pointer; font-size: 75%; }
#doc .fn::after { content: counter(fn) ")"; }
#doc .fn[data-end] { counter-increment: en; }
#doc .fn[data-end]::after { content: counter(en, lower-roman) ")"; }
.fnotes { font: 9pt/1.5 "함초롬바탕", HwpSerif, AppleMyungjo, Batang, "Noto Serif KR", serif; color: #000; }
.fnotes::before { content: ""; display: block; width: 40%; border-top: 0.5pt solid #000; margin-bottom: 3px; }
.fnotes p { margin: 0; }
.eq { font-family: "Times New Roman", HwpSerif, serif; padding: 0 2px; cursor: pointer; white-space: nowrap; text-indent: 0; }
.eq i { font-style: italic; }
.eq .eqrm { font-style: normal; }
.eq .eqf { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.1em; font-size: 0.95em; }
.eq .eqd { border-top: 0.06em solid currentColor; padding-top: 0.05em; }
.eq .eqr { white-space: nowrap; }
.eq .eqo { border-top: 0.06em solid currentColor; padding: 0 0.1em; }
.eq .eqv::before { content: "→"; display: block; font-size: 0.6em; line-height: 0.6; text-align: center; }
.eq .eqv { display: inline-flex; flex-direction: column-reverse; vertical-align: bottom; }
.eq .eqrn { font-size: 0.6em; margin-right: -0.3em; }
#doc .eq:hover { background: #eef3ff; }
#doc .pgn { background: #eef; }
#doc .ph { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; border: 1px dashed #999; background: #f5f5f5; color: #777; font: 9pt var(--font-ui); vertical-align: bottom; max-width: 100%; text-indent: 0; }
#doc[data-ro="1"] { caret-color: transparent; }

/* 개요 번호(1. 가. 1) 가) (1) (가) ①)와 문단 번호·글머리표 */
@counter-style circled { system: fixed; symbols: ① ② ③ ④ ⑤ ⑥ ⑦ ⑧ ⑨ ⑩ ⑪ ⑫ ⑬ ⑭ ⑮ ⑯ ⑰ ⑱ ⑲ ⑳; }
#doc p[data-outline="1"] { counter-increment: o1; counter-reset: o2 o3 o4 o5 o6 o7; }
#doc p[data-outline="2"] { counter-increment: o2; counter-reset: o3 o4 o5 o6 o7; }
#doc p[data-outline="3"] { counter-increment: o3; counter-reset: o4 o5 o6 o7; }
#doc p[data-outline="4"] { counter-increment: o4; counter-reset: o5 o6 o7; }
#doc p[data-outline="5"] { counter-increment: o5; counter-reset: o6 o7; }
#doc p[data-outline="6"] { counter-increment: o6; counter-reset: o7; }
#doc p[data-outline="7"] { counter-increment: o7; }
#doc p[data-outline="1"]::before { content: counter(o1) ". "; }
#doc p[data-outline="2"]::before { content: counter(o2, hangul) ". "; }
#doc p[data-outline="3"]::before { content: counter(o3) ") "; }
#doc p[data-outline="4"]::before { content: counter(o4, hangul) ") "; }
#doc p[data-outline="5"]::before { content: "(" counter(o5) ") "; }
#doc p[data-outline="6"]::before { content: "(" counter(o6, hangul) ") "; }
#doc p[data-outline="7"]::before { content: counter(o7, circled) " "; }
#doc p[data-list="bullet"]::before { content: "● "; font-size: 0.8em; }
#doc p[data-list="number"] { counter-increment: ln; }
#doc p:not([data-list="number"]) { counter-reset: ln; }
#doc p[data-outline] { counter-reset: none; }
#doc p[data-list="number"]::before { content: counter(ln) ". "; }
/* 문서에 정해 둔 번호 모양·글머리표 글자가 있으면 그것을 쓴다 */
#doc p[data-bullet]::before { content: attr(data-bullet) " "; font-size: 1em; }
#doc p[data-label]::before { content: attr(data-label) " "; font-size: 1em; }

/* 조판 부호·문단 부호 보기 */
.show-marks #doc p::after { content: "↵"; color: #3a7bd5; font-size: 9pt; }
.show-marks #doc br::after { content: "↓"; }
.show-codes #doc [data-pb]::before { content: "[쪽 나누기]"; display: block; color: #c62828; font: 8pt var(--font-ui); text-indent: 0; }
.show-codes #doc .fn::before { content: "[각주]"; color: #c62828; font: 8pt var(--font-ui); }

/* 상태 표시줄 */
#status { display: flex; align-items: center; gap: 12px; padding: 3px 10px; background: var(--bar2); border-top: 1px solid var(--line); font-size: 12px; color: var(--sub); white-space: nowrap; overflow-x: auto; padding-bottom: max(3px, env(safe-area-inset-bottom)); scrollbar-width: none; }
#status .grow { flex: 1; }
#status button { border: 0; background: none; color: inherit; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
#status button:hover { background: var(--hover); }
#zoomRange { width: 110px; }
#insMode { font-weight: 600; color: var(--text); }

/* 대화 상자 */
#dlgBack { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: none; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
#dlgBack.open { display: flex; }
.dlg { background: var(--bar2); color: var(--text); border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, .35); width: min(540px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.dlg header { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.dlg header .x { margin-left: auto; }
.dlg .body { padding: 12px 14px; overflow: auto; }
.dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.dlg footer button { min-width: 78px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--bar2); cursor: pointer; }
.dlg footer button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.dlg fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 8px 10px 10px; }
.dlg legend { color: var(--sub); padding: 0 4px; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; }
.fld { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--sub); }
.fld input, .fld select, .fld textarea { height: 30px; border: 1px solid var(--line); border-radius: 5px; background: var(--bar); color: var(--text); padding: 0 6px; font-size: 13px; }
.fld textarea { height: 64px; padding: 6px; resize: vertical; }
.fld input[type=color] { padding: 2px; height: 30px; }
.chk { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; font-size: 13px; }
.preview { border: 1px solid var(--line); border-radius: 6px; background: #fff; color: #000; padding: 10px; min-height: 48px; margin-top: 8px; font: 10pt/1.6 "함초롬바탕", "Noto Serif KR", serif; overflow: hidden; }
.symgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 3px; max-height: 300px; overflow: auto; }
.symgrid button { height: 34px; border: 1px solid var(--line); background: var(--bar); border-radius: 4px; font-size: 17px; cursor: pointer; }
.symgrid button:hover { background: var(--press); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { border: 1px solid var(--line); background: var(--bar); border-radius: 14px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.keys { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.keys td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
.keys td:last-child { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent); white-space: nowrap; text-align: right; }
.keys tr.h td { font-weight: 700; color: var(--text); background: var(--bar); font-family: var(--font-ui); text-align: left; }
.tblpick { display: grid; grid-template-columns: repeat(10, 18px); gap: 2px; margin-bottom: 8px; }
.tblpick i { width: 18px; height: 18px; border: 1px solid var(--line); background: #fff; display: block; }
.tblpick i.on { background: var(--accent-soft); border-color: var(--accent); }

/* 펼침 메뉴(전체 메뉴·오른쪽 클릭) */
.pop { position: fixed; z-index: 60; background: var(--bar2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); padding: 4px; min-width: 220px; max-height: 80vh; overflow: auto; }
.pop button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; text-align: left; }
.pop button:hover { background: var(--hover); }
.pop button kbd { margin-left: auto; color: var(--sub); font: 11.5px ui-monospace, Menlo, Consolas, monospace; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 3px 2px; }

#toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); background: rgba(30, 32, 36, .92); color: #fff; padding: 9px 16px; border-radius: 18px; font-size: 13px; z-index: 70; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; }
#chord { position: fixed; right: 12px; bottom: 40px; background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 12px; z-index: 65; display: none; }

/* 시작 화면 */
#welcome { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: var(--desk); z-index: 5; padding: 16px; }
#welcome.open { display: flex; }
#welcome .card { background: var(--bar2); color: var(--text); border-radius: 14px; padding: 22px; width: min(440px, 100%); box-shadow: 0 6px 30px rgba(0, 0, 0, .3); }
#welcome h1 { font-size: 19px; margin: 0 0 4px; }
#welcome p { margin: 0 0 14px; color: var(--sub); }
#welcome .big { display: flex; gap: 10px; }
#welcome .big button { flex: 1; height: 74px; border-radius: 10px; border: 1px solid var(--line); background: var(--bar); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; }
#welcome .big button svg { width: 28px; height: 28px; }
#welcome .recent { margin-top: 14px; }
#welcome .recent button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#welcome .recent button:hover { background: var(--hover); }
#welcome .foot { margin-top: 14px; font-size: 12px; color: var(--sub); }
#welcome .foot a { color: var(--accent); }

/* 좁은 화면(휴대폰) */
@media (max-width: 700px) {
  .wide-only { display: none !important; }
  #ribbon { min-height: 60px; }
  .rbtn { min-width: 50px; font-size: 11px; }
  .rbtn svg { width: 22px; height: 22px; }
  #fontSel { width: 108px; }
  #zoomRange { display: none; }
}
@media (min-width: 701px) { .narrow-only { display: none !important; } }
.ro #fmtbar, .ro #ribbon { display: none; }

@media print {
  body * { visibility: hidden; }
}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span class="logo" id="logo"></span>
    <div id="title">새 문서 <small></small></div>
    <button class="qbtn" data-cmd="undo" title="되돌리기 (Ctrl+Z)"></button>
    <button class="qbtn" data-cmd="redo" title="다시 실행 (Ctrl+Shift+Z)"></button>
    <button class="qbtn" data-cmd="save" title="저장하기 (Alt+S)"></button>

<script>
// 문서 모델: HWP·HWPX를 읽으면 이 모양이 되고, 편집 화면(HTML)과 서로 바꾼다.
//   doc = { page, header:[문단], footer:[문단], pageNum:'BOTTOM_CENTER'|null, blocks:[문단|표], bins:{key:{data,ext}} }
//   문단 = { t:'p', align, left, right, indent, before, after(HWPUNIT, 1pt=100), lsType, ls, style, outline, pageBreak, runs:[...] }
//   글자 덩이 = {t:'text', text, cs, href} | {t:'tab'} | {t:'br'} | {t:'img', bin, w, h} | {t:'table', ...} | {t:'note', blocks}
//              | {t:'eq', script} | {t:'pagenum'} | {t:'box', w, h, blocks}
//   cs(글자 모양) = { font, size(pt), bold, italic, underline, strike, sup, sub, color, bg, spacing(%), ratio(%) }
'use strict';

const Model = (() => {
  const BASE = { font: '함초롬바탕', size: 10, color: '#000000' };
  const A4 = { w: 59528, h: 84188, ml: 8504, mr: 8504, mt: 5668, mb: 4252, mh: 4252, mf: 4252, gutter: 0 };
  const STYLES = ['바탕글', '본문', '개요 1', '개요 2', '개요 3', '개요 4', '개요 5', '개요 6', '개요 7'];
  const FALLBACK = {
    '함초롬바탕': '"함초롬바탕","HCR Batang",HwpSerif,AppleMyungjo,Batang,"Noto Serif KR","Noto Serif CJK KR",serif',
    '함초롬돋움': '"함초롬돋움","HCR Dotum","Noto Sans KR","Noto Sans CJK KR",sans-serif',
    '바탕': '"바탕",Batang,HwpSerif,AppleMyungjo,"Noto Serif KR",serif', '바탕체': '"바탕체",BatangChe,HwpSerif,"Noto Serif KR",serif',
    '굴림': '"굴림",Gulim,"Noto Sans KR",sans-serif', '돋움': '"돋움",Dotum,"Noto Sans KR",sans-serif',
    '맑은 고딕': '"맑은 고딕","Malgun Gothic","Noto Sans KR",sans-serif', '궁서': '"궁서",Gungsuh,HwpSerif,serif',
  };
  const fontCss = f => FALLBACK[f] || `"${String(f).replace(/"/g, '')}",${/명조|바탕|궁서|serif|Times|Batang|Myeongjo/i.test(f) ? 'HwpSerif,AppleMyungjo,Batang,serif' : 'sans-serif'}`;
  // 장평(글자 폭 %)은 화면에서 자간으로 비슷하게 줄여 보인다 (한글 글자 폭 약 1em 기준)
  const RATIO_K = 0.85;
  const spacingEm = (sp, ratio) => ((sp || 0) + ((ratio || 100) - 100) * RATIO_K) / 100;

  const empty = () => ({ page: Object.assign({}, A4), header: [], footer: [], pageNum: null, blocks: [para()], bins: {} });
  function para(text) {
    return { t: 'p', align: 'justify', left: 0, right: 0, indent: 0, before: 0, after: 0, lsType: 'PERCENT', ls: 160, style: '바탕글',
      runs: text ? [{ t: 'text', text, cs: Object.assign({}, BASE) }] : [] };
  }

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const pt = hu => +(hu / 100).toFixed(2) + 'pt';

  // ---------- 모델 → HTML ----------
  function csCss(cs, base) {
    base = base || BASE;
    const s = [];
    if (cs.font && cs.font !== base.font) s.push('font-family:' + fontCss(cs.font).replace(/"/g, "'"));
    if (cs.size && Math.abs(cs.size - (base.size || 10)) > 0.01) s.push('font-size:' + cs.size + 'pt');
    if (cs.bold) s.push('font-weight:bold');
    if (cs.italic) s.push('font-style:italic');
    const deco = [cs.underline && 'underline', cs.strike && 'line-through'].filter(Boolean);
    if (deco.length) s.push('text-decoration:' + deco.join(' '));
    if (cs.color && cs.color.toLowerCase() !== '#000000') s.push('color:' + cs.color);
    if (cs.bg && cs.bg.toLowerCase() !== '#ffffff') s.push('background-color:' + cs.bg);
    const ls = spacingEm(cs.spacing, cs.ratio);
    if (Math.abs(ls) > 0.0001) s.push('letter-spacing:' + +ls.toFixed(4) + 'em');
    return s.join(';');
  }

  function paraCss(p) {
    const s = [];
    if (p.align && p.align !== 'justify') s.push('text-align:' + (p.align === 'distribute' ? 'justify;text-align-last:justify' : p.align));
    const hang = p.indent < 0 ? -p.indent : 0;
    if (p.left || hang) s.push('padding-left:' + pt((p.left || 0) + hang));
    if (p.right) s.push('padding-right:' + pt(p.right));
    if (p.indent) s.push('text-indent:' + pt(p.indent));
    if (p.before) s.push('padding-top:' + pt(p.before));
    if (p.after) s.push('padding-bottom:' + pt(p.after));
    if (p.lsType === 'PERCENT' && p.ls && p.ls !== 160) s.push('line-height:' + (p.ls / 100));

  const WIDTH_MM = [0.1, 0.12, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 1.0, 1.5, 2.0, 3.0, 4.0, 5.0];
  function borders(bf) {
    const one = l => !l || l.type === 0 ? 'none' : `${WIDTH_MM[l.width] || 0.12}mm ${LINE[l.type] || 'solid'} ${l.color || '#000'}`;
    return { l: one(bf.left), r: one(bf.right), t: one(bf.top), b: one(bf.bottom) };

  function findAll(rec, tag, out = []) {
    for (const ch of rec.children) { if (ch.tag === tag) out.push(ch); findAll(ch, tag, out); }

    const place = placeOf(rec.data);

  function read(bytes) {
    const files = Cfb.read(bytes);
    const fh = files.FileHeader;
    if (!fh) throw new Error('HWP 5.0 문서가 아니에요');
    const sig = new TextDecoder('latin1').decode(fh.subarray(0, 17));

    if (flags & 4) throw new Error('배포용 문서(복사·편집 막힘)는 열 수 없어요');
    const compressed = !!(flags & 1);
    const unz = b => compressed ? pako.inflateRaw(b) : b;
    const info = docInfo(records(unz(files.DocInfo)));
    const doc = Model.empty();
    doc.blocks = [];
    doc.numbering = { defs: info.numberings, outline: 1 };
    const ctx = { info, doc, files, compressed };
    for (let i = 0; files['BodyText/Section' + i]; i++) {

    delete doc.numbering.outlineSet;

  return { read, records, ctrlId };

<script>
// HWPX(.hwpx, 개방형 OWPML) 읽기·저장

  function read(bytes) {

        valign: { TOP: 'top', BOTTOM: 'bottom' }[sl && sl.getAttribute('vertAlign')] || 'middle',
        bg: fill ? fill.bg : null, border: fill ? fill.border : null, blocks: sl ? blocks(ctx, sl) : [],

  }

  function picture(ctx, el) {

  }

  // ---------- 저장 ----------
  const x = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const MM = ['0.1', '0.12', '0.15', '0.2', '0.25', '0.3', '0.4', '0.5', '0.6', '0.7', '1.0', '1.5', '2.0', '3.0', '4.0', '5.0'];
  const LANGS = ['hangul', 'latin', 'hanja', 'japanese', 'other', 'symbol', 'user'];
  const all = v => LANGS.map(l => `${l}="${v}"`).join(' ');
  const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp', webp: 'image/webp', svg: 'image/svg+xml' };
  const STYLE_ID = { '바탕글': 0, '본문': 1, '개요 1': 2, '개요 2': 3, '개요 3': 4, '개요 4': 5, '개요 5': 6, '개요 6': 7, '개요 7': 8 };

  function write(doc, meta) {
    meta = meta || {};
    const T = HwpxTemplate;
    let header = T.header;
    const fonts = ['함초롬돋움', '함초롬바탕'];
    const fontId = f => { f = f || '함초롬바탕'; let i = fonts.indexOf(f); if (i < 0) { fonts.push(f); i = fonts.length - 1; } return i; };
    const charPrs = [], charKey = new Map();
    const CHAR0 = 7;
    const charId = cs => {
      cs = cs || Model.BASE;
      const k = JSON.stringify([cs.font || '함초롬바탕', cs.size || 10, !!cs.bold, !!cs.italic, !!cs.underline, !!cs.strike, !!cs.sup, !!cs.sub, cs.color || '#000000', cs.bg || '', cs.spacing || 0, cs.ratio || 100]);
      if (charKey.has(k)) return charKey.get(k);
      const id = CHAR0 + charPrs.length;
      const f = fontId(cs.font);
      const sp = Math.max(-50, Math.min(50, Math.round(cs.spacing || 0))), ra = Math.max(50, Math.min(200, Math.round(cs.ratio || 100)));
      charPrs.push(`<hh:charPr id="${id}" height="${Math.round((cs.size || 10) * 100)}" textColor="${cs.color || '#000000'}" shadeColor="${cs.bg || 'none'}" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="2">` +
        `<hh:fontRef ${all(f)}/><hh:ratio ${all(ra)}/><hh:spacing ${all(sp)}/><hh:relSz ${all(100)}/><hh:offset ${all(0)}/>` +
        (cs.italic ? '<hh:italic/>' : '') + (cs.bold ? '<hh:bold/>' : '') +
        `<hh:underline type="${cs.underline ? 'BOTTOM' : 'NONE'}" shape="SOLID" color="#000000"/><hh:strikeout shape="${cs.strike ? 'SOLID' : 'NONE'}" color="#000000"/>` +
        '<hh:outline type="NONE"/><hh:shadow type="NONE" color="#C0C0C0" offsetX="10" offsetY="10"/>' +
        (cs.sup ? '<hh:supscript/>' : cs.sub ? '<hh:subscript/>' : '') + '</hh:charPr>');
      charKey.set(k, id);
      return id;
    };
    // 문단 번호 모양: 뼈대의 1번(개요용)은 두고 문서의 번호 모양을 2번부터 붙인다
    const numMap = {}, numXml = [];
    const defs = (doc.numbering && doc.numbering.defs) || {};
    Object.keys(defs).forEach((old, i) => {
      const id = i + 2, def = defs[old];
      numMap[old] = id;
      let h = `<hh:numbering id="${id}" start="${def.start || 1}">`;
      for (let lv = 0; lv < 10; lv++) {
        const L = def.levels[lv] || { type: 'DIGIT', fmt: '' };
        h += `<hh:paraHead start="${L.start || 1}" level="${lv + 1}" align="LEFT" useInstWidth="1" autoIndent="1" widthAdjust="0" textOffsetType="PERCENT" textOffset="50" numFormat="${L.type || 'DIGIT'}" charPrIDRef="4294967295" checkable="0">${x(L.fmt || '')}</hh:paraHead>`;
      }
      numXml.push(h + '</hh:numbering>');
    });
    const outlineId = doc.numbering && numMap[doc.numbering.outline] || 1;
    const bulletChars = [];
    const bulletId = ch => { ch = ch || '●'; let i = bulletChars.indexOf(ch); if (i < 0) { bulletChars.push(ch); i = bulletChars.length - 1; } return i + 1; };
    const paraPrs = [], paraKey = new Map();
    const PARA0 = 20;
    const AL = { justify: 'JUSTIFY', left: 'LEFT', right: 'RIGHT', center: 'CENTER', distribute: 'DISTRIBUTE' };
    const paraId = p => {
      const k = JSON.stringify([p.align, p.left, p.right, p.indent, p.before, p.after, p.lsType, p.ls, p.outline || 0, p.list || '', p.num || null, p.bullet || '', p.box || null]);
      if (paraKey.has(k)) return paraKey.get(k);
      const id = PARA0 + paraPrs.length;
      const r = v => Math.round(v || 0);
      const margin = d => `<hh:margin><hc:intent value="${r(p.indent) * d}" unit="HWPUNIT"/><hc:left value="${r(p.left) * d}" unit="HWPUNIT"/><hc:right value="${r(p.right) * d}" unit="HWPUNIT"/><hc:prev value="${r(p.before) * d}" unit="HWPUNIT"/><hc:next value="${r(p.after) * d}" unit="HWPUNIT"/></hh:margin>` +
        `<hh:lineSpacing type="${p.lsType || 'PERCENT'}" value="${(p.lsType || 'PERCENT') === 'PERCENT' ? r(p.ls || 160) : r(p.ls) * d}" unit="HWPUNIT"/>`;
      const head = p.outline ? `<hh:heading type="OUTLINE" idRef="0" level="${p.outline - 1}"/>`
        : p.list === 'number' ? `<hh:heading type="NUMBER" idRef="${p.num && numMap[p.num.id] || 1}" level="${p.num ? Math.min(9, p.num.level) : 0}"/>`
        : p.list === 'bullet' ? `<hh:heading type="BULLET" idRef="${bulletId(p.bullet)}" level="0"/>` : '<hh:heading type="NONE" idRef="0" level="0"/>';
      const bf = p.box ? fillId({ border: p.box.border || {}, bg: p.box.bg }) : 2;
      paraPrs.push(`<hh:paraPr id="${id}" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0" textDir="LTR">` +
        `<hh:align horizontal="${AL[p.align] || 'JUSTIFY'}" vertical="BASELINE"/>${head}` +
        '<hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="BREAK_WORD" widowOrphan="0" keepWithNext="0" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/>' +
        '<hh:autoSpacing eAsianEng="0" eAsianNum="0"/>' +
        `<hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar">${margin(1)}</hp:case><hp:default>${margin(2)}</hp:default></hp:switch>` +
        `<hh:border borderFillIDRef="${bf}" offsetLeft="0" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/></hh:paraPr>`);
      paraKey.set(k, id);
      return id;
    };
    const fills = [], fillKey = new Map();
    const FILL0 = 3;
    const LT = { solid: 'SOLID', dashed: 'DASH', dotted: 'DOT', double: 'DOUBLE_SLIM' };
    const side = css => {
      if (css === undefined || css === null) return { type: 'SOLID', w: '0.12', c: '#000000' };
      if (!css || /none|hidden/.test(css)) return { type: 'NONE', w: '0.1', c: '#000000' };
      const m = /([\d.]+)(mm|px|pt)?/.exec(css);
      let mm = m ? parseFloat(m[1]) : 0.12;
      if (m && m[2] === 'px') mm = mm * 25.4 / 96; else if (m && m[2] === 'pt') mm = mm * 25.4 / 72;
      if (mm <= 0) return { type: 'NONE', w: '0.1', c: '#000000' };
      const w = MM.reduce((a, b) => Math.abs(b - mm) < Math.abs(a - mm) ? b : a);
      const st = (/(solid|dashed|dotted|double)/.exec(css) || [, 'solid'])[1];
      const c = (/#[0-9a-f]{6}/i.exec(css) || [Model.hex((/rgba?\([^)]*\)/.exec(css) || [''])[0]) || '#000000'])[0];
      return { type: LT[st], w, c };
    };
    const fillId = cell => {
      const b = cell.border || {};
      const s = cell.border ? [side(b.l), side(b.r), side(b.t), side(b.b)] : [side(), side(), side(), side()];
      const k = JSON.stringify([s, cell.bg || '']);
      if (fillKey.has(k)) return fillKey.get(k);
      const id = FILL0 + fills.length;
      const ln = (n, v) => `<hh:${n} type="${v.type}" width="${v.w} mm" color="${v.c}"/>`;
      fills.push(`<hh:borderFill id="${id}" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0"><hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>` +
        ln('leftBorder', s[0]) + ln('rightBorder', s[1]) + ln('topBorder', s[2]) + ln('bottomBorder', s[3]) + '<hh:diagonal type="SOLID" width="0.1 mm" color="#000000"/>' +
        (cell.bg ? `<hc:fillBrush><hc:winBrush faceColor="${cell.bg}" hatchColor="#999999" alpha="0"/></hc:fillBrush>` : '') + '</hh:borderFill>');
      fillKey.set(k, id);
      return id;
    };
    const tableFill = fillId({ border: null });   // 표 바깥 테두리 기본

    // 그림
    const binItems = [];
    const binOf = key => {
      let it = binItems.find(b => b.key === key);
      if (!it) {
        const b = doc.bins[key];
        const ext = (b.ext || 'png').replace('jpeg', 'jpg');
        it = { key, id: 'BIN' + String(binItems.length + 1).padStart(4, '0'), ext, data: b.data };
        binItems.push(it);
      }
      return it.id;
    };

    let pid = 1, oid = 1000;
    const nid = () => String(1000000 + (oid++));
    const subList = (blocks, va, extra) => `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${va || 'TOP'}" linkListIDRef="0" linkListNextIDRef="0" textWidth="${extra && extra.w || 0}" textHeight="${extra && extra.h || 0}" hasTextRef="0" hasNumRef="0">${blocks.map(b => paraXml(b)).join('')}</hp:subList>`;
    let noteNo = 0;

    function runXml(r, cs) {
      switch (r.t) {
        case 'tab': return '<hp:t><hp:tab width="4000" leader="0" type="1"/></hp:t>';
        case 'br': return '<hp:t><hp:lineBreak/></hp:t>';
        case 'img': {
          if (!doc.bins[r.bin]) return '';
          const id = binOf(r.bin), w = Math.max(1, Math.round(r.w)), h = Math.max(1, Math.round(r.h)), o = nid();
          return `<hp:pic textWrap="${r.place && r.place.wrap === 'square' ? 'SQUARE' : 'TOP_AND_BOTTOM'}" textFlow="BOTH_SIDES" reverse="0" id="${o}" zOrder="0" numberingType="PICTURE" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${o}">` +
            `<hp:offset x="0" y="0"/><hp:orgSz width="${w}" height="${h}"/><hp:curSz width="${w}" height="${h}"/><hp:flip horizontal="0" vertical="0"/>` +
            `<hp:rotationInfo angle="0" centerX="${w >> 1}" centerY="${h >> 1}" rotateimage="1"/><hp:renderingInfo><hc:transMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:scaMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/></hp:renderingInfo>` +
            `<hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="${w}" y="0"/><hc:pt2 x="${w}" y="${h}"/><hc:pt3 x="0" y="${h}"/></hp:imgRect><hp:imgClip left="0" right="${w}" top="0" bottom="${h}"/>` +
            `<hp:inMargin left="0" right="0" top="0" bottom="0"/><hp:imgDim dimwidth="${w}" dimheight="${h}"/><hc:img binaryItemIDRef="${id}" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/><hp:effects/>` +
            `<hp:sz width="${w}" widthRelTo="ABSOLUTE" height="${h}" heightRelTo="ABSOLUTE" protect="0"/>${posXml(r.place)}` +
            '<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:shapeComment>그림입니다.</hp:shapeComment></hp:pic>';
        }
        case 'note': {
          noteNo++;
          const inner = (r.blocks.length ? r.blocks : [Model.para()]).map((b, i) => {
            const runs = i === 0 ? [{ t: 'fnnum', n: noteNo }].concat(b.runs) : b.runs;
            return paraXml(Object.assign({}, b, { runs }));
          }).join('');
          return `<hp:ctrl><hp:${r.end ? 'endNote' : 'footNote'} number="${noteNo}" suffixChar="41" instId="${nid()}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="TOP" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${inner}</hp:subList></hp:${r.end ? 'endNote' : 'footNote'}></hp:ctrl>`;
        }
        case 'fnnum': return `<hp:ctrl><hp:autoNum num="${r.n}" numType="FOOTNOTE"><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/></hp:autoNum></hp:ctrl>`;
        case 'pagenum': return '<hp:ctrl><hp:autoNum num="1" numType="PAGE"><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar="" supscript="0"/></hp:autoNum></hp:ctrl>';
        case 'eq': {
          const w = Math.max(1000, (r.script || '').length * 550), o = nid();
          return `<hp:equation id="${o}" zOrder="0" numberingType="EQUATION" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" version="Equation Version 60" baseLine="66" textColor="#000000" baseUnit="${Math.round(((cs && cs.size) || 10) * 100)}" lineMode="CHAR" font="HYhwpEQ">` +
            `<hp:sz width="${w}" widthRelTo="ABSOLUTE" height="1500" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>` +
            `<hp:outMargin left="56" right="56" top="0" bottom="0"/><hp:shapeComment>수식입니다.</hp:shapeComment><hp:script>${x(r.script || '')}</hp:script></hp:equation>`;
        }
        case 'table': return tableXml(r);
        case 'box': return tableXml({ rows: 1, cols: 1, w: r.w, cells: [{ r: 0, c: 0, rs: 1, cs: 1, w: r.w, h: r.h, blocks: r.blocks }] });
      }
      return '';
    }

    // 글자처럼 취급(기본) 또는 단(column) 기준 왼쪽·가운데·오른쪽
    function posXml(pl) {
      if (!pl) return '<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>';
      return `<hp:pos treatAsChar="0" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="${{ center: 'CENTER', right: 'RIGHT' }[pl.align] || 'LEFT'}" vertOffset="0" horzOffset="${pl.align === 'left' ? Math.round(pl.x || 0) : 0}"/>`;
    }

    function tableXml(t) {
      const o = nid();
      const rows = [];
      for (const c of t.cells) (rows[c.r] = rows[c.r] || []).push(c);
      const PAD0 = [510, 510, 141, 141];
      const tp = (t.pad || PAD0).map(v => Math.max(0, Math.round(v)));
      const same = (a, b) => a.every((v, i) => Math.abs(v - b[i]) < 2);
      const nRows = Math.max(1, rows.length), nCols = Math.max(1, t.cols || 1);
      const width = Math.round(t.w || t.cells.filter(c => c.r === 0).reduce((s, c) => s + (c.w || 0), 0) || 42520);
      let height = 0;
      for (let r = 0; r < nRows; r++) height += Math.max(...(rows[r] || [{ h: 282 }]).filter(c => c.rs === 1).map(c => c.h || 282), 282);
      let h = `<hp:tbl id="${o}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="0" rowCnt="${nRows}" colCnt="${nCols}" cellSpacing="0" borderFillIDRef="${tableFill}" noAdjust="0">` +
        `<hp:sz width="${width}" widthRelTo="ABSOLUTE" height="${height}" heightRelTo="ABSOLUTE" protect="0"/>` +
        posXml(t.place) +
        `<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="${tp[0]}" right="${tp[1]}" top="${tp[2]}" bottom="${tp[3]}"/>`;
      for (let r = 0; r < nRows; r++) {
        h += '<hp:tr>';
        for (const c of (rows[r] || []).sort((a, b) => a.c - b.c)) {
          const va = { top: 'TOP', bottom: 'BOTTOM' }[c.valign] || 'CENTER';
          const cp = (c.pad || tp).map(v => Math.max(0, Math.round(v)));
          const own = !same(cp, tp);
          h += `<hp:tc name="" header="0" hasMargin="${own ? 1 : 0}" protect="0" editable="0" dirty="0" borderFillIDRef="${fillId(c)}">` +
            subList(c.blocks && c.blocks.length ? c.blocks : [Model.para()], va) +
            `<hp:cellAddr colAddr="${c.c}" rowAddr="${c.r}"/><hp:cellSpan colSpan="${c.cs || 1}" rowSpan="${c.rs || 1}"/><hp:cellSz width="${Math.round(c.w || width / nCols)}" height="${Math.round(c.h || 282)}"/>` +
            `<hp:cellMargin left="${cp[0]}" right="${cp[1]}" top="${cp[2]}" bottom="${cp[3]}"/></hp:tc>`;
        }
        h += '</hp:tr>';
      }
      return h + '</hp:tbl>';
    }

    function paraXml(p, lead) {
      const ppr = paraId(p);
      const sid = p.outline ? 1 + p.outline : (STYLE_ID[p.style] || 0);
      let h = `<hp:p id="${pid++}" paraPrIDRef="${ppr}" styleIDRef="${sid > 8 ? 0 : sid}" pageBreak="${p.pageBreak ? 1 : 0}" columnBreak="0" merged="0">`;
      if (lead) h += lead;
      let link = null, linkId = 0;
      const runs = p.runs.slice();
      if (!runs.some(r => r.t !== 'fnnum')) runs.push({ t: 'text', text: '', cs: Model.BASE });
      let cur = null, buf = '';
      const close = () => { if (cur !== null) { h += buf + '</hp:run>'; cur = null; buf = ''; } };
      for (const r of runs) {
        const href = r.t === 'text' ? r.href || null : null;
        if (href !== link) {
          close();
          if (link) h += `<hp:run charPrIDRef="0"><hp:ctrl><hp:fieldEnd beginIDRef="${linkId}" fieldid="${linkId}"/></hp:ctrl></hp:run>`;
          link = href;
          if (link) {
            linkId = nid();
            const cmd = link.replace(/:/g, '\\:') + ';1;0;0;';
            h += `<hp:run charPrIDRef="0"><hp:ctrl><hp:fieldBegin id="${linkId}" type="HYPERLINK" name="" editable="0" dirty="0" zorder="-1" fieldid="${linkId}"><hp:parameters cnt="6" name="">` +
              `<hp:integerParam name="Prop">0</hp:integerParam><hp:stringParam name="Command">${x(cmd)}</hp:stringParam><hp:stringParam name="Path">${x(link)}</hp:stringParam>` +
              '<hp:stringParam name="Category">HWPHYPERLINK_TYPE_URL</hp:stringParam><hp:stringParam name="TargetType">HWPHYPERLINK_TARGET_BOOKMARK</hp:stringParam><hp:stringParam name="DocOpenType">HWPHYPERLINK_JUMP_CURRENTTAB</hp:stringParam></hp:parameters></hp:fieldBegin></hp:ctrl></hp:run>';
          }
        }
        const cs = r.cs || (r.t === 'fnnum' ? Model.BASE : null);
        const id = charId(cs || lastCs);
        if (cs) lastCs = cs;
        if (cur !== id) { close(); h += `<hp:run charPrIDRef="${id}">`; cur = id; }
        buf += r.t === 'text' ? `<hp:t>${x(r.text)}</hp:t>` : runXml(r, cs || lastCs);
      }
      close();
      if (link) h += `<hp:run charPrIDRef="0"><hp:ctrl><hp:fieldEnd beginIDRef="${linkId}" fieldid="${linkId}"/></hp:ctrl></hp:run>`;
      return h + '</hp:p>';
    }
    let lastCs = Model.BASE;

    // 구역 정의(용지)와 머리말·꼬리말은 첫 문단 맨 앞에
    const pg = doc.page || Model.A4;
    const land = !!pg.landscape || pg.w > pg.h;
    const pw = land ? Math.min(pg.w, pg.h) : pg.w, ph = land ? Math.max(pg.w, pg.h) : pg.h;
    const secPr = T.secPr.replace(/<hp:pagePr[^>]*>(<hp:margin[^>]*\/>)<\/hp:pagePr>/,
      `<hp:pagePr landscape="${land ? 'NARROWLY' : 'WIDELY'}" width="${Math.round(pw)}" height="${Math.round(ph)}" gutterType="LEFT_ONLY"><hp:margin header="${Math.round(pg.mh)}" footer="${Math.round(pg.mf)}" gutter="${Math.round(pg.gutter || 0)}" left="${Math.round(pg.ml)}" right="${Math.round(pg.mr)}" top="${Math.round(pg.mt)}" bottom="${Math.round(pg.mb)}"/></hp:pagePr>`);
    const bodyW = Math.round((land ? ph : pw) - pg.ml - pg.mr);
    const secPr2 = secPr.replace(/outlineShapeIDRef="\d+"/, `outlineShapeIDRef="${outlineId}"`);
    let lead = `<hp:run charPrIDRef="0">${secPr2}<hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl>`;
    const hasBlocks = b => b && b.length && b.some(p => p.runs && p.runs.length);
    if (hasBlocks(doc.header)) lead += `<hp:ctrl><hp:header id="${nid()}" applyPageType="BOTH">${subList(doc.header, 'TOP', { w: bodyW, h: Math.round(pg.mh) })}</hp:header></hp:ctrl>`;
    if (hasBlocks(doc.footer)) lead += `<hp:ctrl><hp:footer id="${nid()}" applyPageType="BOTH">${subList(doc.footer, 'BOTTOM', { w: bodyW, h: Math.round(pg.mf) })}</hp:footer></hp:ctrl>`;
    if (doc.pageNum) lead += `<hp:ctrl><hp:pageNum pos="${doc.pageNum}" formatType="DIGIT" sideChar="-"/></hp:ctrl>`;
    lead += '</hp:run>';

    const body = doc.blocks.map((b, i) => paraXml(b.t === 'table' ? Object.assign(Model.para(), { runs: [b] }) : b, i === 0 ? lead : '')).join('');
    const section = T.secOpen + body + '</hs:sec>';

    // 머리 정보(header.xml) 고치기
    header = header.replace(/<hh:fontface lang="([A-Z]+)" fontCnt="\d+">([\s\S]*?)<\/hh:fontface>/g, (m, lang, inner) => {
      let add = '';
      for (let i = 2; i < fonts.length; i++) add += `<hh:font id="${i}" face="${x(fonts[i])}" type="TTF" isEmbedded="0"/>`;
      return `<hh:fontface lang="${lang}" fontCnt="${fonts.length}">${inner}${add}</hh:fontface>`;
    });
    header = header.replace(/<hh:borderFills itemCnt="(\d+)">([\s\S]*?)<\/hh:borderFills>/, (m, n, inner) => `<hh:borderFills itemCnt="${+n + fills.length}">${inner}${fills.join('')}</hh:borderFills>`);
    header = header.replace(/<hh:charProperties itemCnt="(\d+)">([\s\S]*?)<\/hh:charProperties>/, (m, n, inner) => `<hh:charProperties itemCnt="${+n + charPrs.length}">${inner}${charPrs.join('')}</hh:charProperties>`);
    header = header.replace(/<hh:numberings itemCnt="(\d+)">([\s\S]*?)<\/hh:numberings>/, (m, n, inner) => `<hh:numberings itemCnt="${+n + numXml.length}">${inner}${numXml.join('')}</hh:numberings>`);
    if (!bulletChars.length) bulletChars.push('●');
    if (!/<hh:bullets/.test(header)) header = header.replace('</hh:numberings>', `</hh:numberings><hh:bullets itemCnt="${bulletChars.length}">` +
      bulletChars.map((c, i) => `<hh:bullet id="${i + 1}" char="${x(c)}" useImage="0"><hh:paraHead level="0" align="LEFT" useInstWidth="0" autoIndent="1" widthAdjust="0" textOffsetType="PERCENT" textOffset="50" numFormat="DIGIT" charPrIDRef="4294967295" checkable="0"/></hh:bullet>`).join('') + '</hh:bullets>');
    header = header.replace(/<hh:paraProperties itemCnt="(\d+)">([\s\S]*?)<\/hh:paraProperties>/, (m, n, inner) => `<hh:paraProperties itemCnt="${+n + paraPrs.length}">${inner}${paraPrs.join('')}</hh:paraProperties>`);

    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const NS = 'xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:hp="http://www.hancom.co.kr/hwpml/2011/paragraph" xmlns:hp10="http://www.hancom.co.kr/hwpml/2016/paragraph" xmlns:hs="http://www.hancom.co.kr/hwpml/2011/section" xmlns:hc="http://www.hancom.co.kr/hwpml/2011/core" xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head" xmlns:hhs="http://www.hancom.co.kr/hwpml/2011/history" xmlns:hm="http://www.hancom.co.kr/hwpml/2011/master-page" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:ooxmlchart="http://www.hancom.co.kr/hwpml/2016/ooxmlchart" xmlns:hwpunitchar="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar" xmlns:epub="http://www.idpf.org/2007/ops" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"';
    const hpf = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>' +
      `<opf:package ${NS} version="" unique-identifier="" id=""><opf:metadata><opf:title>${x(meta.title || '')}</opf:title><opf:language>ko</opf:language>` +
      '<opf:meta name="creator" content="text"></opf:meta><opf:meta name="subject" content="text"/><opf:meta name="description" content="text"/>' +
      `<opf:meta name="lastsaveby" content="text"></opf:meta><opf:meta name="CreatedDate" content="text">${now}</opf:meta><opf:meta name="ModifiedDate" content="text">${now}</opf:meta>` +
      '<opf:meta name="keyword" content="text"/></opf:metadata><opf:manifest>' +
      '<opf:item id="header" href="Contents/header.xml" media-type="application/xml"/><opf:item id="section0" href="Contents/section0.xml" media-type="application/xml"/><opf:item id="settings" href="settings.xml" media-type="application/xml"/>' +
      binItems.map(b => `<opf:item id="${b.id}" href="BinData/${b.id}.${b.ext}" media-type="${MIME[b.ext] || 'image/png'}" isEmbeded="1"/>`).join('') +
      '</opf:manifest><opf:spine><opf:itemref idref="header" linear="yes"/><opf:itemref idref="section0" linear="yes"/></opf:spine></opf:package>';
    const rdf = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about=""><ns0:hasPart xmlns:ns0="http://www.hancom.co.kr/hwpml/2016/meta/pkg#" rdf:resource="Contents/header.xml"/></rdf:Description><rdf:Description rdf:about="Contents/header.xml"><rdf:type rdf:resource="http://www.hancom.co.kr/hwpml/2016/meta/pkg#HeaderFile"/></rdf:Description><rdf:Description rdf:about=""><ns0:hasPart xmlns:ns0="http://www.hancom.co.kr/hwpml/2016/meta/pkg#" rdf:resource="Contents/section0.xml"/></rdf:Description><rdf:Description rdf:about="Contents/section0.xml"><rdf:type rdf:resource="http://www.hancom.co.kr/hwpml/2016/meta/pkg#SectionFile"/></rdf:Description><rdf:Description rdf:about=""><rdf:type rdf:resource="http://www.hancom.co.kr/hwpml/2016/meta/pkg#Document"/></rdf:Description></rdf:RDF>';
    const preview = Model.blocksText(doc.blocks.filter(b => b.t === 'p')).slice(0, 1000);
    return Zip.write([
      { name: 'mimetype', data: 'application/hwp+zip', store: true },
      { name: 'version.xml', data: T.version },
      { name: 'Contents/header.xml', data: header },
      { name: 'Contents/section0.xml', data: section },
      { name: 'Preview/PrvText.txt', data: preview },
      { name: 'settings.xml', data: T.settings },
      { name: 'META-INF/container.rdf', data: rdf },
      { name: 'Contents/content.hpf', data: hpf },
      { name: 'META-INF/container.xml', data: T.container },
      { name: 'META-INF/manifest.xml', data: T.manifest },
      ...binItems.map(b => ({ name: `BinData/${b.id}.${b.ext}`, data: b.data, store: true })),
    ]);
  }

  return { read, write };
})();

<script>
// 편집기 핵심: 쪽 화면, 쪽 나누기 계산, 되돌리기, 글자·문단 모양, 넣기, 표 편집, 찾기
'use strict';

const Ed = (() => {
  const el = document.getElementById('doc');
  const masksEl = document.getElementById('masks'), gridEl = document.getElementById('grid');
  const stage = document.getElementById('stage'), sizer = document.getElementById('sizer'), sheetsEl = document.getElementById('sheets'), view = document.getElementById('view');
  const PX = 75;          // 1px = 75 HWPUNIT (96dpi)
  const GAP = 18, PAD = 18;
  const st = {
    doc: Model.empty(), zoom: 1, pageView: true, overwrite: false, readOnly: false, dirty: false,
    pages: 1, urls: {}, cellSel: null, painter: null, onChange: null, onLayout: null,
  };

  // ---------- 그림 주소 ----------
  const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp', webp: 'image/webp', svg: 'image/svg+xml', wmf: 'image/wmf', emf: 'image/emf' };
  function binUrl(key) {
    if (st.urls[key]) return st.urls[key];
    const b = st.doc.bins[key];
    if (!b) return '';
    st.urls[key] = URL.createObjectURL(new Blob([b.data], { type: MIME[b.ext] || 'application/octet-stream' }));
    return st.urls[key];
  }
  function addBin(data, ext) {
    let n = Object.keys(st.doc.bins).length + 1;
    while (st.doc.bins['img' + n]) n++;
    const key = 'img' + n;
    st.doc.bins[key] = { data, ext: (ext || 'png').toLowerCase().replace('jpeg', 'jpg') };
    return key;
  }

  // ---------- 불러오기·내보내기 ----------
  function load(doc) {
    for (const k in st.urls) URL.revokeObjectURL(st.urls[k]);
    st.urls = {};
    st.doc = doc;
    el.innerHTML = Model.toHtml(doc.blocks, doc, binUrl);
    delete doc.blocks;
    st.cellSel = null;
    hist.reset();
    st.dirty = false;
    layout();
    placeCaret(el.querySelector('p') || el, 0);
    view.scrollTop = 0;
  }
  function toModel() {
    clearPagination();
    const blocks = Model.fromDom(el, st.doc);
    paginateSoon();
    return Object.assign({}, st.doc, { blocks });
  }
  function cleanHtml() {
    const c = el.cloneNode(true);
    c.querySelectorAll('.pgap, tr.pgap-row').forEach(e => e.remove());
    c.querySelectorAll('[data-rsadd]').forEach(td => { td.rowSpan = Math.max(1, td.rowSpan - (+td.dataset.rsadd || 0)); td.removeAttribute('data-rsadd'); });
    c.querySelectorAll('[data-push]').forEach(e => { e.style.marginTop = ''; e.removeAttribute('data-push'); if (!e.getAttribute('style')) e.removeAttribute('style'); });
    c.querySelectorAll('[data-shift]').forEach(e => { e.style.position = ''; e.style.top = ''; e.removeAttribute('data-shift'); if (!e.getAttribute('style')) e.removeAttribute('style'); });
    c.querySelectorAll('.cellsel').forEach(e => e.classList.remove('cellsel'));
    c.querySelectorAll('.picked').forEach(e => e.classList.remove('picked'));
    c.normalize();
    return c.innerHTML;
  }

  // ---------- 화면 배치: 쪽, 머리말·꼬리말, 쪽 번호 ----------
  const geo = () => {
    const p = st.doc.page;
    const W = p.w / PX, H = p.h / PX;
    return { W, H, left: (p.ml + (p.gutter || 0)) / PX, top: (p.mt + p.mh) / PX, bodyW: (p.w - p.ml - p.mr - (p.gutter || 0)) / PX,
      bodyH: Math.max(40, (p.h - p.mt - p.mh - p.mb - p.mf) / PX), stride: H + GAP };
  };

  // 표 줄 앞에 빈 줄을 끼운다. 위에서 이 자리를 가로질러 내려오는(줄 합친) 칸은 한 줄 더 차지하게 한다
  function rowSpacer(tr, h) {
    const table = tr.closest('table'), idx = [...table.rows].indexOf(tr);
    // 빈 줄까지 넣어 센 실제 칸 배치
    const raw = new Map(), occ = [];
    let nCols = 0;
    [...table.rows].forEach((row, r) => {
      occ[r] = occ[r] || [];
      let c = 0;
      for (const td of row.cells) {
        while (occ[r][c]) c++;
        const i = { r, c, rs: td.rowSpan || 1, cs: td.colSpan || 1 };
        raw.set(td, i);
        for (let a = 0; a < i.rs; a++) for (let b = 0; b < i.cs; b++) (occ[r + a] = occ[r + a] || [])[c + b] = true;
        c += i.cs;
        nCols = Math.max(nCols, c);
      }
    });
    const g = { nCols }, covered = new Set();
    for (const [td, i] of raw) {
      if (i.r < idx && i.r + i.rs > idx) {
        td.rowSpan = i.rs + 1; td.dataset.rsadd = (+td.dataset.rsadd || 0) + 1;
        for (let c = i.c; c < i.c + i.cs; c++) covered.add(c);
      }
    }
    const row = document.createElement('tr');
    row.className = 'pgap-row'; row.contentEditable = 'false';
    let first = true;
    for (let c = 0; c < g.nCols; c++) {
      if (covered.has(c)) continue;
      const td = document.createElement('td');
      td.style.cssText = `height:${first ? h : 0}px;padding:0;border:none;background:transparent`;
      first = false;
      row.appendChild(td);
    }
    if (first) { const td = document.createElement('td'); td.style.cssText = `height:${h}px;padding:0;border:none`; row.appendChild(td); }
    tr.parentNode.insertBefore(row, tr);
  }

  function clearPagination() {
    el.querySelectorAll('tr.pgap-row').forEach(r => r.remove());
    el.querySelectorAll('[data-rsadd]').forEach(td => { td.rowSpan = Math.max(1, td.rowSpan - (+td.dataset.rsadd || 0)); td.removeAttribute('data-rsadd'); });
    el.querySelectorAll('.pgap').forEach(s => { const p = s.parentNode; s.remove(); if (p && p.tagName === 'P') p.normalize(); });
    el.querySelectorAll('[data-push]').forEach(e => { e.style.marginTop = ''; e.removeAttribute('data-push'); if (!e.getAttribute('style')) e.removeAttribute('style'); });
    el.querySelectorAll('[data-shift]').forEach(e => { e.style.position = ''; e.style.top = ''; e.removeAttribute('data-shift'); if (!e.getAttribute('style')) e.removeAttribute('style'); });
  }

  // 문단 p 안에서 아래 끝이 y(쪽 나누기 전 문서 좌표)를 넘는 첫 줄의 시작 글자
  function lineOver(p, y, docTop, scale) {
    const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
    const pos = [];
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (n.parentElement.closest('.fn,.eq,.pgn')) continue;
      for (let i = 0; i < n.length; i++) pos.push([n, i]);
    }
    if (!pos.length) return null;
    const r = document.createRange();
    const box = ([n, i]) => {
      r.setStart(n, i); r.setEnd(n, i + 1);
      const rects = r.getClientRects();
      const rc = rects[rects.length - 1] || r.getBoundingClientRect();
      return { top: (rc.top - docTop) / scale, bottom: (rc.bottom - docTop) / scale };
    };
    let lo = 0, hi = pos.length - 1;
    if (box(pos[hi]).bottom <= y) return null;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (box(pos[mid]).bottom > y) hi = mid; else lo = mid + 1;
    }
    // 그 줄의 첫 글자까지 거슬러 올라간다
    const lineTop = box(pos[lo]).top;
    while (lo > 0 && Math.abs(box(pos[lo - 1]).top - lineTop) < 1) lo--;
    if (lo === 0) return null;
    return { node: pos[lo][0], offset: pos[lo][1], top: lineTop };
  }

  let pagTimer = 0;
  function paginateSoon() { clearTimeout(pagTimer); pagTimer = setTimeout(layout, 120); }

  // 쪽 나누기: 문서 위에서부터 쪽 끝을 넘는 첫 문단을 찾아 다음 쪽으로 넘기기를 되풀이한다.
  // 표 안(칸 안)의 문단도 똑같이 줄 단위로 넘긴다. 넘긴 자리는 .pgap(저장되지 않는 빈칸)으로 채운다.
  function paginate(g, reserve) {
    const scale = st.zoom;
    const stuck = new Set();
    const spacer = (before, h) => {
      const d = document.createElement('div');
      d.className = 'pgap'; d.contentEditable = 'false';
      d.style.height = Math.ceil(h + 0.5) + 'px';
      before.parentNode.insertBefore(d, before);
    };
    const tries = new Map(), pbDone = new Set();
    // 가운데·아래 맞춤 칸에서 글이 칸보다 짧아 떠 있으면 나누지 않는다 (밀수록 같이 내려가 끝이 없다)
    const floating = node => {
      const td = node.closest('td,th');
      if (!td || !el.contains(td)) return false;
      const va = getComputedStyle(td).verticalAlign;
      if (va === 'top' || va === 'baseline') return false;
      const kids = [...td.children].filter(k => !k.classList.contains('pgap'));
      if (!kids.length) return false;
      const used = kids[kids.length - 1].getBoundingClientRect().bottom - kids[0].getBoundingClientRect().top;
      const cs = getComputedStyle(td);
      const room = td.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      return room - used > 2 * scale;
    };
    const t0 = performance.now();
    for (let iter = 0; iter < 3000; iter++) {
      if (performance.now() - t0 > 6000) break;           // 아주 큰 문서에서 멈추지 않게
      const dt = el.getBoundingClientRect().top;
      let best = null;
      const pageOf = y => Math.max(0, Math.floor((y + 2) / g.stride));
      const endOf = pg => pg * g.stride + g.bodyH - ((reserve && reserve[pg]) || 0);
      const rg = document.createRange();
      const consider = (node, kind) => {
        if (stuck.has(node)) return;
        const r = node.getBoundingClientRect();
        if (!r.height && !r.width) return;
        const top = (r.top - dt) / scale, bottom = (r.bottom - dt) / scale;
        if (best && top >= best.top) return;
        const page = pageOf(top), start = page * g.stride, end = endOf(page);
        if (kind === 'pb') { if (top > start + 2) best = { node, kind, top, page }; return; }
        if (top <= end - 0.5 && bottom <= end + 1) return;          // 한 쪽 안에 다 들어 있다
        // 줄마다 본다: 이미 나눠 둔 문단은 여러 쪽에 걸쳐 있어도 괜찮다
        const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
        let first = null, line = null;
        for (let t = w.nextNode(); t && !line; t = w.nextNode()) {
          if (!t.length) continue;
          rg.selectNodeContents(t);
          for (const rc of rg.getClientRects()) {
            if (!rc.height) continue;
            const lt = (rc.top - dt) / scale, lb = (rc.bottom - dt) / scale;
            if (first === null) first = lt;
            const pg = pageOf(lt), e = endOf(pg);
            if (lt > e - 0.5 || lb > e + 1) { line = { lt, pg }; break; }
          }
        }
        if (first === null) {                                       // 글자 없는 문단(그림만 등)
          if (!best || top < best.top) best = { node, kind, top, page, whole: true, bottom };
          return;
        }
        if (!line) return;
        if (best && line.lt >= best.top) return;
        best = { node, kind, top: line.lt, page: line.pg, whole: line.lt <= first + 2, pTop: top, bottom };
      };
      for (const k of el.querySelectorAll(':scope > [data-pb]')) if (k !== el.firstElementChild && !pbDone.has(k)) consider(k, 'pb');
      // 표 줄: 한 쪽에 들어가는 줄이 쪽 끝에 걸리면 줄째 다음 쪽으로 (한글처럼)
      for (const tr of el.querySelectorAll('tr')) {
        if (tr.classList.contains('pgap-row') || stuck.has(tr)) continue;
        const r = tr.getBoundingClientRect();
        const top = (r.top - dt) / scale, bottom = (r.bottom - dt) / scale;
        if (best && top >= best.top) continue;
        const page = pageOf(top), start = page * g.stride, end = endOf(page);
        if (bottom - top > g.bodyH - 2 || top <= start + 2) continue;
        if (top > end - 0.5 || bottom > end + 1) best = { node: tr, kind: 'row', top, page };
      }
      for (const p of el.querySelectorAll('p')) consider(p, 'p');
      if (!best) break;
      const { node, kind, top, page } = best;
      const next = (page + 1) * g.stride;
      const n = (tries.get(node) || 0) + 1;
      tries.set(node, n);
      if (n > 30) { stuck.add(node); continue; }
      if (kind === 'pb') { spacer(node, next - top); pbDone.add(node); continue; }
      if (kind === 'row') { rowSpacer(node, Math.ceil(next - top + 0.5)); stuck.add(node); continue; }
      if (floating(node)) {
        // 가운데·아래 맞춤 칸에 떠 있는 글(여러 줄에 걸친 '활력징후' 같은 제목 칸):
        // 칸 크기는 그대로 두고, 보이는 위치만 같은 칸 안에서 쪽 위나 아래로 옮긴다
        const td = node.closest('td,th');
        const kids = [...td.children].filter(k => !k.classList.contains('pgap'));
        const tr = td.getBoundingClientRect(), cs = getComputedStyle(td);
        const cTop = (tr.top - dt) / scale + parseFloat(cs.paddingTop), cBot = (tr.bottom - dt) / scale - parseFloat(cs.paddingBottom);
        const bTop = (kids[0].getBoundingClientRect().top - dt) / scale, bBot = (kids[kids.length - 1].getBoundingClientRect().bottom - dt) / scale;
        const pg = pageOf(bTop), endA = endOf(pg), nextA = (pg + 1) * g.stride;
        const up = endA - bBot, down = nextA - bTop;
        let d = 0;
        if (bBot <= endA) d = 0;
        else if (bTop + up >= cTop - 0.5) d = up;
        else if (bBot + down <= cBot + 0.5) d = down;
        else d = Math.abs(cTop - bTop) < Math.abs(cBot - bBot) ? cTop - bTop : cBot - bBot;
        if (Math.abs(d) > 0.5) for (const k of kids) { k.style.position = 'relative'; k.style.top = d + 'px'; k.dataset.shift = '1'; }
        kids.forEach(k => stuck.add(k));
        stuck.add(node);
        continue;
      }
      if (best.whole) {
        // 첫 줄부터 넘치면 문단째 다음 쪽으로 (이미 쪽 맨 위면 그대로 둔다)
        const pTop = best.pTop !== undefined ? best.pTop : top;
        const pg = pageOf(pTop);
        if (pTop > pg * g.stride + 2) spacer(node, (pg + 1) * g.stride - pTop);
        else stuck.add(node);
        continue;
      }
      // 줄 단위로 나누기: 넘치는 줄 앞에 빈칸을 끼운다
      const ls = lineOver(node, endOf(page), dt, scale);
      if (ls && ls.top < next) {
        const rest = ls.offset > 0 ? ls.node.splitText(ls.offset) : ls.node;
        const gap = document.createElement('span');
        gap.className = 'pgap'; gap.contentEditable = 'false';
        gap.style.cssText = `display:block;height:${Math.max(1, Math.ceil(next - ls.top + 0.5))}px;text-indent:0`;
        rest.parentNode.insertBefore(gap, rest);
      } else stuck.add(node);
    }
  }

  function groupNotes(g, fns) {
    const dt = el.getBoundingClientRect().top, out = {};
    fns.forEach((f, i) => {
      const pg = Math.max(0, Math.floor(((f.getBoundingClientRect().top - dt) / st.zoom + 2) / g.stride));
      (out[pg] = out[pg] || []).push({ n: i + 1, text: f.dataset.note || '' });
    });
    return out;
  }
  const notesHtml = list => list.map(x => `<p>${x.n}) ${Model.esc(x.text)}</p>`).join('');
  function noteHeights(g, groups) {
    const probe = document.createElement('div');
    probe.className = 'fnotes';
    probe.style.cssText = `position:absolute;visibility:hidden;width:${g.bodyW}px;left:0;top:0`;
    masksEl.appendChild(probe);
    const out = {};
    for (const k in groups) { probe.innerHTML = notesHtml(groups[k]); out[k] = probe.offsetHeight + 6; }
    probe.remove();
    return out;
  }

  // 문서에 정해 둔 문단 번호 모양대로 번호 글자를 붙인다 (한글처럼 같은 번호 모양은 문서 끝까지 이어진다)
  function renumber() {
    const nb = st.doc.numbering;
    if (!nb || !nb.defs) return;
    const counters = {};
    for (const p of el.querySelectorAll('p[data-numid], p[data-outline]')) {
      let id, lv;
      if (p.dataset.numid) { id = p.dataset.numid; lv = +p.dataset.numlv || 0; }
      else { id = nb.outline; lv = (+p.dataset.outline || 1) - 1; }
      const def = nb.defs[id];
      if (!def) { if (p.dataset.label) delete p.dataset.label; continue; }
      const c = counters[id] = counters[id] || [];
      c[lv] = c[lv] === undefined ? ((def.levels[lv] && def.levels[lv].start) || 1) : c[lv] + 1;
      for (let k = lv + 1; k < 10; k++) c[k] = undefined;
      const label = Model.numLabel(def, lv, c);
      if (p.dataset.label !== label) p.dataset.label = label;
    }
  }

  function layout() {
    clearTimeout(pagTimer);
    renumber();
    const g = geo();
    Object.assign(el.style, { left: (PAD + g.left) + 'px', top: (PAD + g.top) + 'px', width: g.bodyW + 'px' });
    const sel = saveSelOffsets();
    clearPagination();
    const kids = [...el.children];
    let pages = 1;
    if (st.pageView) {
      paginate(g, null);
      // 각주: 쪽마다 아래에 둘 자리를 비워 두고 다시 나눈다
      st.noteGroups = null;
      const fns = [...el.querySelectorAll('.fn:not([data-end])')];
      if (fns.length) {
        let groups = groupNotes(g, fns), reserve = noteHeights(g, groups);
        clearPagination();
        paginate(g, reserve);
        groups = groupNotes(g, fns);
        const again = noteHeights(g, groups);
        for (const k in again) reserve[k] = Math.max(reserve[k] || 0, again[k]);
        st.noteGroups = groups; st.noteReserve = reserve;
      }
      const bottom = el.offsetHeight;
      pages = Math.max(pages, Math.floor(Math.max(0, bottom - 1) / g.stride) + 1);
    }
    restoreSelOffsets(sel);
    const contentH = el.offsetHeight;
    const notes = [...el.querySelectorAll(st.pageView ? '.fn[data-end]' : '.fn')];      // 쪽 윤곽에선 미주만 끝에
    const notesH = notes.length ? 20 + notes.length * 18 : 0;
    if (!st.pageView) pages = 1;
    const totalH = st.pageView ? pages * g.stride - GAP : Math.max(g.H, g.top + contentH + notesH + st.doc.page.mb / PX + 40);
    if (st.pageView && notes.length) {
      const last = Math.floor((contentH + notesH) / g.stride) + 1;
      pages = Math.max(pages, last);
    }
    st.pages = pages;
    drawSheets(g, pages, st.pageView ? null : totalH, notes);
    let w = g.W + PAD * 2, h = (st.pageView ? pages * g.stride - GAP : totalH) + PAD * 2;
    const cols = gridCols(g);
    st.grid = cols >= 2;
    el.style.visibility = st.grid ? 'hidden' : '';
    sheetsEl.style.display = masksEl.style.display = st.grid ? 'none' : '';
    if (st.grid) {
      drawGrid(g, pages, cols);
      const rows = Math.ceil(pages / cols);
      w = cols * (g.W + GAP) - GAP + PAD * 2; h = rows * (g.H + GAP) - GAP + PAD * 2;
    } else if (gridEl.firstChild) { gridEl.innerHTML = ''; if (gridObs) gridObs.disconnect(); }
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.transform = `scale(${st.zoom})`;
    sizer.style.width = w * st.zoom + 'px'; sizer.style.height = h * st.zoom + 'px';
    if (st.onLayout) st.onLayout();
  }

  const toRoman = n => ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'][n - 1] || String(n);
  function hfHtml(blocks, pageNo) {
    if (!blocks || !blocks.length) return '';
    return Model.toHtml(blocks, st.doc, binUrl).replace(/<span class="pgn"[^>]*>#<\/span>/g, String(pageNo));
  }

  function drawSheets(g, n, contHeight, notes) {
    const p = st.doc.page;
    let h = '', m = '';
    const hdr = st.doc.header, ftr = st.doc.footer;
    const bodyBottom = g.top + g.bodyH;                     // 쪽 위에서 본문 끝까지
    for (let i = 0; i < n; i++) {
      const top = PAD + i * g.stride, H = contHeight || g.H;
      h += `<div class="sheet" style="top:${top}px;left:${PAD}px;width:${g.W}px;height:${H}px">` +
        `<div class="guide" style="left:${g.left}px;top:${g.top}px;width:${g.bodyW}px;height:${contHeight ? H - g.top - (p.mb + p.mf) / PX : g.bodyH}px"></div></div>`;
      // 본문 위·아래 여백과 쪽 사이 틈은 글 위에 덮는다 (쪽을 넘는 표 테두리 등이 비치지 않게)
      let hf = '';
      if (hdr && hdr.length) hf += `<div class="hf" style="left:${g.left}px;top:${p.mt / PX}px;width:${g.bodyW}px;height:${p.mh / PX}px">${hfHtml(hdr, i + 1)}</div>`;
      let ff = '';
      if (ftr && ftr.length) ff += `<div class="hf" style="left:${g.left}px;bottom:${p.mb / PX}px;width:${g.bodyW}px;height:${p.mf / PX}px;display:flex;flex-direction:column;justify-content:flex-end">${hfHtml(ftr, i + 1)}</div>`;
      if (st.doc.pageNum) {
        const pos = st.doc.pageNum;
        let align = /LEFT/.test(pos) ? 'left' : /RIGHT/.test(pos) ? 'right' : 'center';
        if (/OUTSIDE/.test(pos)) align = (i % 2 === 0) ? 'right' : 'left';
        if (/INSIDE/.test(pos)) align = (i % 2 === 0) ? 'left' : 'right';
        const style = align === 'center' ? `left:${g.left}px;width:${g.bodyW}px;text-align:center` : align === 'left' ? `left:${g.left}px` : `right:${p.mr / PX}px`;
        const num = `<div class="pgno" style="${style};${/TOP/.test(pos) ? `top:${p.mt / PX}px` : `bottom:${(p.mb + p.mf / 2) / PX}px`}">- ${i + 1} -</div>`;
        if (/TOP/.test(pos)) hf += num; else ff += num;
      }
      if (contHeight) { h = h.replace(/<\/div>$/, hf + ff + '</div>'); continue; }
      m += `<div class="mask mtop" style="top:${top}px;left:${PAD}px;width:${g.W}px;height:${g.top}px">${hf}</div>`;
      m += `<div class="mask mbot" style="top:${top + bodyBottom}px;left:${PAD}px;width:${g.W}px;height:${g.H - bodyBottom}px">${ff}</div>`;
      if (i < n - 1) m += `<div class="mask gapm" style="top:${top + g.H}px;left:0;width:100%;height:${GAP}px"></div>`;
      const fg = st.noteGroups && st.noteGroups[i];
      if (fg) { const rh = st.noteReserve[i]; m += `<div class="mask fnotes" data-page="${i}" style="top:${top + bodyBottom - rh}px;left:${PAD + g.left}px;width:${g.bodyW}px;height:${rh}px">${notesHtml(fg)}</div>`; }
    }
    if (notes.length) {
      // 각주·미주는 문서 끝에 모아서 보여 준다
      const y = PAD + g.top + el.offsetHeight + 12;
      h += `<div class="sheet-notes" style="position:absolute;left:${PAD + g.left}px;top:${y}px;width:${g.bodyW * 0.5}px;font:9pt/1.5 '함초롬바탕',serif;color:#000;border-top:0.5pt solid #000;padding-top:3pt">` +
        notes.map((f, i) => `<p style="margin:0">${st.pageView ? toRoman(i + 1) : i + 1}) ${Model.esc(f.dataset.note || '')}</p>`).join('') + '</div>';
    }
    sheetsEl.innerHTML = h;
    masksEl.innerHTML = m;
  }

  // 쪽 모아보기: 화면을 줄여 두 쪽 이상이 옆으로 들어가면 쪽을 바둑판처럼 늘어놓는다
  function gridCols(g) {
    if (!st.pageView || st.pages < 2) return 1;
    const room = view.clientWidth / st.zoom - PAD * 2 + GAP;
    return Math.max(1, Math.min(st.pages, Math.floor(room / (g.W + GAP))));
  }
  let gridObs = null;
  function drawGrid(g, n, cols) {
    if (gridObs) gridObs.disconnect();
    const p = st.doc.page;
    let h = '';
    for (let i = 0; i < n; i++) {
      const x = PAD + (i % cols) * (g.W + GAP), y = PAD + Math.floor(i / cols) * (g.H + GAP);
      h += `<div class="sheet" data-page="${i + 1}" style="top:${y}px;left:${x}px;width:${g.W}px;height:${g.H}px"><div class="pcard" style="width:${g.W}px;height:${g.H}px"></div></div>`;
    }
    gridEl.innerHTML = h;
    gridEl.className = 'pagegrid';
    // 보이는 쪽만 내용을 채운다 (쪽이 많아도 가볍게)
    const fill = card => {
      if (card.dataset.filled) return;
      card.dataset.filled = '1';
      const i = +card.parentNode.dataset.page - 1;
      const c = el.cloneNode(true);
      c.removeAttribute('contenteditable'); c.style.visibility = 'visible';
      c.style.left = g.left + 'px'; c.style.top = (g.top - i * g.stride) + 'px';
      c.querySelectorAll('[contenteditable]').forEach(e => e.removeAttribute('contenteditable'));
      const top = `<div class="mask" style="top:0;left:0;width:${g.W}px;height:${g.top}px"></div>`;
      const bot = `<div class="mask" style="top:${g.top + g.bodyH}px;left:0;width:${g.W}px;height:${g.H - g.top - g.bodyH}px"></div>`;
      card.appendChild(c);
      card.insertAdjacentHTML('beforeend', top + bot);
      const mt = masksEl.querySelectorAll('.mtop')[i], mb = masksEl.querySelectorAll('.mbot')[i];
      if (mt) card.lastElementChild.previousElementSibling.innerHTML = mt.innerHTML;
      if (mb) card.lastElementChild.innerHTML = mb.innerHTML;
      const fn = masksEl.querySelector(`.fnotes[data-page="${i}"]`);
      if (fn) { const d = fn.cloneNode(true); d.style.top = (parseFloat(fn.style.top) - PAD - i * g.stride) + 'px'; d.style.left = g.left + 'px'; card.appendChild(d); }
    };
    gridObs = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) fill(e.target); }), { root: view, rootMargin: '400px' }) : null;
    gridEl.querySelectorAll('.pcard').forEach(c => gridObs ? gridObs.observe(c) : fill(c));
  }
  gridEl.addEventListener('click', e => {
    const sh = e.target.closest('.sheet'); if (!sh) return;
    const n = +sh.dataset.page;
    fitWidth();
    if (st.grid) setZoom(Math.max(st.zoom, 0.5), false);
    gotoPage(n);
  });

  function setZoom(z, keepCenter) {
    z = Math.max(0.1, Math.min(3, z));
    const g0 = geo(), old = st.zoom;
    const wasCols = st.grid ? gridCols(g0) : 1;
    st.zoom = z;
    const nowCols = gridCols(g0);

    }).join('') + '</div>').join('');

  }

    curMenu = m.id; drawMenus();
  });

  let refreshT = 0;
  function refresh() {
    cancelAnimationFrame(refreshT);
    refreshT = requestAnimationFrame(() => {
      const cs = Ed.caretStyle();
      if (cs) {
        if (document.activeElement !== $('#sizeIn')) $('#sizeIn').value = cs.size;
        const fs = $('#fontSel');
        if (document.activeElement !== fs) {
          if (![...fs.options].some(o => o.value === cs.font)) fs.insertAdjacentHTML('afterbegin', `<option>${Model.esc(cs.font)}</option>`);
          fs.value = cs.font;
        }
      }
      const p = Ed.curPara();
      if (p && document.activeElement !== $('#styleSel')) {
        const ps = Ed.paraShape(p);
        $('#styleSel').value = Model.STYLES.includes(ps.style) ? ps.style : '바탕글';
        const ls = $('#lsSel');
        if (document.activeElement !== ls) {
          if (ps.lsType === 'PERCENT' && ![...ls.options].some(o => +o.value === ps.ls)) ls.insertAdjacentHTML('beforeend', `<option value="${ps.ls}">${ps.ls}%</option>`);
          ls.value = ps.lsType === 'PERCENT' ? ps.ls : '';
        }
      }

  function sniff(bytes, name) {
    if (bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0) return 'hwp';
    if (bytes[0] === 0x50 && bytes[1] === 0x4B) return 'hwpx';
    if (/\.html?$/i.test(name)) return 'html';
    if (/\.hwp$/i.test(name) && new TextDecoder('latin1').decode(bytes.subarray(0, 16)).startsWith('HWP Document')) return 'hwp3';
    // 글자 파일이 아니면(그림·PDF 등) 열지 않는다
    const head = bytes.subarray(0, 4096);
    let zeros = 0;
    for (const b of head) if (b === 0) zeros++;
    if (zeros > 4 || /\.(pdf|docx?|pptx?|xlsx?|jpe?g|png|gif|zip|mp4|apk)$/i.test(name)) return 'other';
    return 'txt';
  }
  function openBytes(bytes, name, writable, uri) {
    let doc;
    try {
      const kind = sniff(bytes, name);
      if (kind === 'hwp') doc = Hwp5.read(bytes);
      else if (kind === 'hwpx') doc = Hwpx.read(bytes);
      else if (kind === 'hwp3') throw new Error('아주 옛날 한글(97 이전) 문서는 열 수 없어요');
      else if (kind === 'other') throw new Error('한글 문서(.hwp · .hwpx)가 아니라서 열 수 없어요');
      else if (kind === 'html') {
        doc = Model.empty();
        const tmp = document.createElement('div'); tmp.style.cssText = 'position:absolute;left:-9999px;width:600px';
        tmp.innerHTML = sanitize(new TextDecoder().decode(bytes));
        document.body.appendChild(tmp); doc.blocks = Model.fromDom(tmp, doc); tmp.remove();
      } else {
        doc = Model.empty();
        let text = new TextDecoder('utf-8').decode(bytes);
        if (/�/.test(text)) { try { text = new TextDecoder('euc-kr').decode(bytes); } catch (e) { } }
        doc.blocks = text.replace(/\r\n?/g, '\n').split('\n').map(t => Model.para(t));
      }
      app.kind = kind;
    } catch (e) {
      console.error(e);
      dialog('문서를 열지 못했어요', `<p>${Model.esc(/열 수 없어요|아니에요/.test(e.message) ? e.message : '문서를 읽다가 문제가 생겼어요: ' + e.message)}</p><p style="font-size:12px;color:var(--sub)">${Model.esc(name)} · ${(bytes.length / 1048576).toFixed(1)}MB · 버전 ${VERSION}</p>`, { ok: false });
      return false;
    }
    const outName = name;
    openModel(doc, outName, app.kind);
    app.writable = !!writable && app.kind === 'hwpx';
    app.uri = uri || null;
    if (narrow()) Ed.fitWidth();
    setReadOnly(narrow() && pref('directEdit') !== '1');      // 휴대폰은 먼저 보기 모드(뷰어)로

    return true;
  }
